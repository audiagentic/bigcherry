# Engine pillar: radiance (run-multi-engine MEN01, MEN02). Evaluate lane only: no patches or overlay files yet.
# On the lab host the source checkout currently lives under the work root (see tools/lab/radiance/); the vendor
# location below is where it belongs once builds go through the platform's build lanes (MEN04).
schema = 1
name = "radiance"
upstream = "https://codeberg.org/StillDeadcode/radiance"

[layout]
# Every patch ID starts with this before its order digits, so IDs never collide across engines.
patch-id-prefix = "rad"
patches = "engines/radiance/patches"
overlay = "engines/radiance/overlay"
vendor = "vendor/radiance"
recipes = "engines/radiance/recipes.toml"

# How the server is run (run-multi-engine MEN03). The plugins (kernel libraries, architectures, quantisers) are found
# through RADIANCE_HOME, which a source build places beside its bin/ directory.
# How a build names its GPU targets (CMake cache variable).
[build]
targets-option = "RAD_GPU_TARGETS"
binary = "bin/radiance"
# The runtime a served build needs beside its binary: radiance builds its plugin libraries, architectures and
# quantisers into radiance_home as part of its default target.
runtime-targets = ["all"]
runtime-home = "radiance_home"

# How this engine's release versions are numbered (docs/reference/build/RELEASES.md): the pin is a commit, so the major
# of <major>.<minor>.<patch> is the recipes' pinned-version with its dots removed (1.3.0 -> 130).
[release]
version-source = "pinned-version"

[serve]
binary = "bin/radiance"
model-flag = "--model"
host-flag = "--host"
port-flag = "--port"
health = "/health"
shutdown = "sigint"

[serve.env-from-binary]
RADIANCE_HOME = "../radiance_home"

[serve.draft-stats]
source = "metrics"
path = "/metrics"
drafted = "radiance:draft_tokens_total"
accepted = "radiance:draft_accepted_total"

# BigCherry-owned source built against the pinned engine and installed into its runtime (RAD01 PR 5).
[components]
libr3 = "engines/radiance/components/libr3"

# RAM-only smoke test (MEN15): `bigcherry --engine radiance smoke-cpu --build <dir>` serves this tiny container on the
# CPU kernel plugins (libavx, libref; --tp 1) with no GPU visible. `model` is relative to the model root (--model-root,
# BIGCHERRY_MODEL_ROOT or the host's model-root); `sha256` is the digest of that exact file. The digest below is a
# PLACEHOLDER: the runner refuses it until the owner pins a real tiny .rad container (convert a small model with
# radiance's quantisers once). `args` carry the container-specific serve flags (context length, sequences).
[smoke.cpu]
model = "smoke/tiny.rad"
sha256 = "PLACEHOLDER-pin-the-sha256-of-the-tiny-rad-container"
args = ["--max-model-len", "512", "--max-num-seqs", "1"]
