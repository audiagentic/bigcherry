# Dense Qwen3.8-27B layouts.
# Layout definitions: run-time data that bc-serve (--layouts / BIGCHERRY_LAYOUTS) and the Python tools read; nothing is compiled
# in. Format: README.md in this directory.
schema = 1

# Dense tensor-parallel lane: the model is sharded across both selected XTX
# engine cards. There are no remote-MoE helper processes or route-heat inputs.
[layout.qwen27b-2xtx]
description = "Qwen3.8-27B MXFP4, two RDNA3 engine ranks with host-memory wht6 all-reduce"
model = "radiance/StillDeadcode/qwen3.8-27b-mxfp4/qwen3.8-27b-mxfp4.rad"
engine = { arch = "gfx1100", count = 2 }
tp-wire = "wht6"
server-args = [
  "--max-model-len", "8192",
  "--max-num-seqs", "6",
  "--max-num-batched-tokens", "2048",
  "--kv-cache-dtype", "fp8",
  "--num-speculative-tokens", "3",
]

# Native three-rank tensor parallelism over two card types (VTP14): both XTX ranks first, then the R9700, each rank on
# its own architecture's kernels. The uneven split is a setting (tuning.tp_ownership, checked against the loaded model), so a
# sweep is `--set tuning.tp_ownership=...` and needs no rebuild. Needs a build with the VTP14 patches (rad0016-rad0022).
# The exact wire: the lossy three-rank wire is not usable yet.
[layout.qwen27b-tp3]
description = "Qwen3.8-27B MXFP4 over XTX, XTX, R9700 (native TP3): 6/6/12 query heads, the R9700 the largest share"
model = "radiance/StillDeadcode/qwen3.8-27b-mxfp4/qwen3.8-27b-mxfp4.rad"
engine = [{ arch = "gfx1100", count = 2 }, { arch = "gfx1201", count = 1 }]
tp-wire = "exact"
server-args = [
  "--max-model-len", "8192",
  "--max-num-seqs", "8",
  "--kv-cache-dtype", "fp8",
  "--num-speculative-tokens", "3",
]
[layout.qwen27b-tp3.settings]
tuning.tp_ownership = "kv=1,1,2;ffn=5120,4864,7424;lk=4,4,8;lv=12,12,24"
tuning.pipelined_prefill = "auto"
# The all-reduce's launch grid (rad0022): four blocks of 256 threads beat the default (scaled with the message, 1024
# threads) at every stream count and prompt size on this world, with identical output (VTP31 experiment 1).
# The two-shot's form (rad0032, rad0033): four pieces with the fused step, the duplex link weights (the R9700 owns no
# shard) and the reduced shard written once. Against the grid alone: one-prompt time to first token -21 / -27 / -25% at
# 512 / 2048 / 6144 tokens, 4/6/8 streams +13.6 / +13.5 / +16.7%, bit-identical output (VTP36).
tuning.tune_pin = "all_reduce:nblocks=4,nthreads=256,ts_pieces=4,ts_fuse=1,ts_once=1,ts_duplex=1"
# Pipeline a one-sequence prefill step from 256 rows rather than the plugin's 1024, so a 512-token prompt overlaps its
# all-reduces too: +7.6% / +2.9% / +1.6% at 1/4/8 streams, identical output (VTP31 experiment 7; 128 measured the same).
tuning.pipelined_prefill_min_rows = 256

# The int8 container on the same three ranks: int8 runs natively on both card types, so the split the VTP14 sweep found
# best gives the XTX ranks the larger delta-net and feed-forward shares.
[layout.qwen27b-tp3-int8]
description = "Qwen3.8-27B w8a8 over XTX, XTX, R9700 (native TP3): delta-net 6/6/4, feed-forward 6656/6656/4096"
model = "radiance/bigcherry/qwen3.8-27b-w8a8/qwen3.8-27b-w8a8-df2.rad"
engine = [{ arch = "gfx1100", count = 2 }, { arch = "gfx1201", count = 1 }]
tp-wire = "exact"
server-args = [
  "--max-model-len", "8192",
  "--max-num-seqs", "8",
  "--kv-cache-dtype", "fp8",
  "--num-speculative-tokens", "3",
]
[layout.qwen27b-tp3-int8.settings]
tuning.tp_ownership = "kv=1,1,2;ffn=6656,6656,4096;lk=6,6,4;lv=18,18,12"
# The pipelined prefill on the int8 trunk is opt-in (rad0030): "on", not "auto", which keeps such a trunk serial.
# One-prompt time to first token -17% to -21%, four 4096-token prompts -16%, 4/6/8 streams +7.4% / +7.8% / +8.4%; KLD
# against the serial prefill 0.0012 mean, top-1 99.3%, less than the serial prefill moves when its chunk is halved (VTP37).
tuning.pipelined_prefill = "on"
# The same all-reduce grid as the MXFP4 layout: +1-5% decode, -3 to -7% TTFT on int8 too (VTP31). The same two-shot
# form (rad0032, rad0033): time to first token -13 / -24 / -22% at 512 / 2048 / 6144 tokens, 4/6/8 streams +7.6 / +10.9 /
# +13.9%, bit-identical output (VTP36).
tuning.tune_pin = "all_reduce:nblocks=4,nthreads=256,ts_pieces=4,ts_fuse=1,ts_once=1,ts_duplex=1"
# The narrowest pipelined step, as in the MXFP4 layout. Before rad0030 the int8 trunk never pipelined, so the gain VTP31
# experiment 12 recorded for this floor on int8 (+0.3-1.3% decode, about -2% TTFT) was run-to-run noise.
tuning.pipelined_prefill_min_rows = 256

# The int8 layout with the delta-net and feed-forward shares moved toward the R9700 (5/5/6, 5632/5632/6144). Against
# qwen27b-tp3-int8 on one build (ABBA, n=8): 1/4/6/8 streams +2.6 / +2.3 / +12.0 / +5.4%, one-prompt time to first token
# -2.8 / -0.1 / -4.3% at 512 / 2048 / 6144 tokens, and the KV cache reaches ~228,000 tokens a card against ~56,000.
# Quality: pipelined against its own serial prefill KLD 0.00054 mean, p99.9 0.022, top-1 99.3% (the floor, chunk 1024:
# 0.0032 / 0.051 / 97.9%); against BF16 0.0025 / 0.054 / 97.0%, closer than qwen27b-tp3-int8 (0.0033 / 0.086 / 96.9%)
# (VTP36). Opt-in until chosen as the default.
[layout.qwen27b-tp3-int8-556]
description = "Qwen3.8-27B w8a8 over XTX, XTX, R9700 (native TP3): delta-net 5/5/6, feed-forward 5632/5632/6144"
model = "radiance/bigcherry/qwen3.8-27b-w8a8/qwen3.8-27b-w8a8-df2.rad"
engine = [{ arch = "gfx1100", count = 2 }, { arch = "gfx1201", count = 1 }]
tp-wire = "exact"
server-args = [
  "--max-model-len", "8192",
  "--max-num-seqs", "8",
  "--kv-cache-dtype", "fp8",
  "--num-speculative-tokens", "3",
]
[layout.qwen27b-tp3-int8-556.settings]
tuning.tp_ownership = "kv=1,1,2;ffn=5632,5632,6144;lk=5,5,6;lv=15,15,18"
tuning.pipelined_prefill = "on"
tuning.tune_pin = "all_reduce:nblocks=4,nthreads=256,ts_pieces=4,ts_fuse=1,ts_once=1,ts_duplex=1"
tuning.pipelined_prefill_min_rows = 256

# The MXFP4 container on the same three ranks, for resident context rather than speed: the delta-net and feed-forward
# shares move off the R9700, so with rad0029 (every rank its own VRAM split) its memory goes to the KV cache. At 262,144
# tokens and 8 sequences it holds 6.7 full-length sessions against qwen27b-tp3's 5.5 and dual-XTX TP2's 3.3, at 3-8%
# less throughput than qwen27b-tp3 (VTP33).
[layout.qwen27b-tp3-capacity]
description = "Qwen3.8-27B MXFP4 over XTX, XTX, R9700 (native TP3) for resident context: 7/7/2 delta-net, 7680/7680/2048 feed-forward"
model = "radiance/StillDeadcode/qwen3.8-27b-mxfp4/qwen3.8-27b-mxfp4.rad"
engine = [{ arch = "gfx1100", count = 2 }, { arch = "gfx1201", count = 1 }]
tp-wire = "exact"
server-args = [
  "--max-model-len", "262144",
  "--max-num-seqs", "8",
  "--kv-cache-dtype", "fp8",
  "--num-speculative-tokens", "3",
]
[layout.qwen27b-tp3-capacity.settings]
tuning.tp_ownership = "kv=1,1,2;ffn=7680,7680,2048;lk=7,7,2;lv=21,21,6"
tuning.pipelined_prefill = "auto"
tuning.tune_pin = "all_reduce:nblocks=4,nthreads=256"
tuning.pipelined_prefill_min_rows = 256
