# Naming only: architecture tokens come from archs.toml, and aliases below
# preserve the existing family spelling. They do not assert build support.
[patch]
suffixes = ["_{arch}_{id}", "_{id}"]

[architecture_aliases]
gfx1030 = ["gfx10"]
gfx1100 = ["gfx11"]
gfx1201 = ["gfx12"]

[rewrite.libr3]
suffixes = ["_gfx11_r3"]
