# Suffix patterns for the names a layer introduces (tools/bigcherry/patch/unit_ownership.py). {arch} is gfx<digits>, {id} is
# the patch's id (rad0042). A patch's code that builds for every architecture uses the second pattern.
[patch]
suffixes = ["_{arch}_{id}", "_{id}"]

[rewrite]
suffixes = ["_gfx11_r3"]
