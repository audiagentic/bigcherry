# Radiance engine recipes (RAD01 PR 3; docs/reference/engines/radiance/PLATFORM_DESIGN.md).
# Patch sets, sources, builds, experiments and runtime profiles for the radiance engine pillar. The patches named
# here are engines/radiance/patches/<id>/ packages; they never mix with llama.cpp's.
version = 2
engine = "radiance"
# radiance 1.14.0 (codeberg StillDeadcode/radiance; exact-SHA mirror Quackster/radiance). v1.14.0 is commit 4a61d72.
pinned = "v1.17.0"
pinned-version = "1.17.0"

# Validated serving patches, including the production remote-MoE hand-off.
[patch-set.serving-core]
patches = [
  "rad0008_hc_upmix_rt_sweep",
  "rad0002_moe_remote_handoff",
  "rad0011_plan_memory",
  "rad0013_mtp_pass_replay",
  "rad0009_serving_manifest",
]

# Host build compatibility for the pinned engine (rad0005: MP4 writer against FFmpeg 6). Enablers with no runtime path of
# their own; promoted to validated by a passing bump (compile, plugin ABI, component tests, cpu-smoke) and then moved to
# serving-core.
[patch-set.host-compat]
patches = ["rad0005_mp4_ffmpeg6_writer"]
required-state = "untested"

# Start from a resolved serving manifest (rad0009, RSC07): `--manifest PATH` replaces command-line flags. Untested until a
# manifest launch is shown to parse to the same config as the argv launch on hardware, then moved to serving-core.
[patch-set.serving-manifest]
patches = []
required-state = "untested"

# Remote-MoE diagnostics (shadow compare, mask-only); the hand-off is in serving-core. Patch-lint fails
# if a patch declaring `diagnostic-build` (rad0004) enters any recipe not named *-diag.
[patch-set.moe-remote-diag]
patches = [
  "rad0004_moe_remote_diagnostics",
  "rad0006_heat_freeze_diagnostic",
]
required-state = "untested"


# RHP01: isolated opt-in read-only histogram evidence, never part of production sources.
[patch-set.routing-evidence]
patches = ["rad0010_routing_evidence"]
required-state = "untested"

# Required by the helper and kernel ports; engine behavior remains unchanged until RSC07.
# MTP draft/verify recorded-pass replay restored on the v1.17 pin (rad0013): v1.17's qwen4exp pass_key refuses every draft and
# verify pass, so each speculation round issues them live (~1.7% decode step). Untested until the decode-step A/B, output identity
# and KLD on hardware, then moved to serving-core.
[patch-set.mtp-pass-replay]
patches = []
required-state = "untested"

[patch-set.helper-config]
patches = ["rad0012_helper_kernel_config"]
required-state = "untested"

# VTP14 native TP3 (experimental). N1: per-rank kernel code masks and --rank-devices, inert without the flag.
# N3: one all-reduce rendezvous shared by libr3 and libr4d, without which a mixed-library world hangs in declare.
[patch-set.vtp14-rank-code-selection]
patches = ["rad0016_vtp14_rank_code_selection"]
required-state = "untested"

[patch-set.vtp14-shared-rendezvous]
patches = ["rad0017_vtp14_n3_shared_rendezvous"]
required-state = "untested"

[patch-set.vtp14-tp-ownership]
patches = ["rad0018_vtp14_n2_tp_ownership", "rad0019_vtp14_n2_tp_ownership_fp8"]
required-state = "untested"

# Pipelined prefill (the fp8 plugin's two-piece step, all-reduces beside the other piece's work) at TP3.
[patch-set.vtp14-overlap]
patches = ["rad0020_vtp14_tp3_pipelined_prefill"]
required-state = "untested"

[source.radiance-vtp14-rank-code-selection]
description = "Experimental native Radiance TP3 across RX 7900 XTX and R9700: per-rank kernel selection (--rank-devices) and a shared all-reduce rendezvous."
overlay = false
patch-sets = ["serving-core", "host-compat", "serving-manifest", "helper-config", "mtp-pass-replay", "vtp14-rank-code-selection", "vtp14-shared-rendezvous", "vtp14-tp-ownership", "vtp14-overlap"]

[source.radiance-native]
description = "radiance 1.14.0 as released: no overlay, no patches."
overlay = false
patch-sets = []

[source.radiance]
description = "radiance 1.14.0 with BigCherry's validated engine patch sets."
overlay = false
patch-sets = ["serving-manifest", "serving-core", "host-compat", "helper-config", "mtp-pass-replay"]

[source.radiance-diag]
description = "radiance 1.14.0 with the validated engine patch sets plus remote-MoE diagnostics (rad0004); build it with build.moe-diag."
overlay = false
patch-sets = ["serving-core", "host-compat", "serving-manifest", "moe-remote-diag", "helper-config", "mtp-pass-replay"]

[source.radiance-routing-evidence]
description = "Production Radiance plus RHP01 opt-in host histogram coverage diagnostics; not a production source."
overlay = false
patch-sets = ["serving-core", "host-compat", "serving-manifest", "routing-evidence", "helper-config", "mtp-pass-replay"]

[build.stock]
description = "radiance's own release build of the engine binary."
options = {}
needs = []

# The diagnostic build: defines BC_MOE_REMOTE_DIAG for the engine core and the arch plugins (rad0004's call sites and
# the extension point's diagnostic answers are compiled out without it). Pair it with source.radiance-diag.
[build.moe-diag]
description = "radiance built with BC_MOE_REMOTE_DIAG: remote-MoE shadow compare and mask-only available."
options = { CMAKE_CXX_FLAGS = "-DBC_MOE_REMOTE_DIAG" }
needs = []

# Experiments contain only unpromoted patches; promotion retires their memberships.
[experiment.mtp-full-head-switch]
patches = ["rad0003_mtp_full_head_switch"]


# Profiles list only what they switch; libr3's runtime defaults (R3_ATTN_NATIVE on, every other R3_* off) are the
# component's, never restated here.
[runtime-profile.flashnext-2xtx]
server-args = [
  "--tp", "2", "--tp-wire", "exact",
  "--placement", "expert_tiered",
  "--ngram-placement", "ram",
  "--host-pool-mib", "14336",
  "--max-num-seqs", "6",
  "--max-num-batched-tokens", "4096",
  "--checkpoint-interval", "4096",
  "--kv-cache-dtype", "fp8",
  "--num-speculative-tokens", "3",
]
tune-context = 4096
production-context = 32768
min-free-vram-bytes-per-device = 268435456

[runtime-profile.qwen38-27b-2xtx]
server-args = ["--tp", "2", "--tp-wire", "wht6"]
tune-context = 4096
production-context = 8192
min-free-vram-bytes-per-device = 268435456

# dev: radiance's host code needs GCC 14 (C++23); hipcc, the HIP compiler and the ROCm runtime come from the selected ROCm
# SDK (engine.toml build.rocm-paths; docs/reference/ENVIRONMENT.md, ROCm).
# RAD_GPU_TARGETS names libr4d's kernel targets (gfx12 only); the gfx1100 kernels come from the libr3 component.
# ${VAR} values come from the environment or config/environment.local.toml [env].
# Each recipes file is loaded alone, so the stack the lane names is declared here. sdk is a version in the host's
# rocm-sdks table (config/environment.example.toml for CI); the CI image's ARG ROCM_VERSION must be that version.
[stack.rocm-7-2]
backend = "hip"
sdk = "7.2"
required-providers = ["hip", "rocblas"]

[platform.linux-radiance]
description = "dev: radiance engine build (GCC 14 host compiler; HIP from the selected ROCm SDK)"
targets = ["gfx1201"]
# The ROCm SDK is named, never the host default: [stack.rocm-7-2] -> sdk "7.2" in the host's rocm-sdks table. Its
# root, version and hashed identity are recorded in the build.
stack = "rocm-7-2"
# ccache (through the bc-ccache launcher, which gives an unchanged unit the same command text in every build) wraps every compiler CMake invokes (host C/C++ AND the HIP device-code compiler) so a
# from-scratch build after a small source change only recompiles the touched translation units --
# unconditional here since ccache is present on every host this platform builds on (dev and the
# CI image both have it); if a future host lacks it, configure fails loudly rather than silently
# rebuilding everything, which is the right failure mode to notice and fix.
options = { RAD_BUILD_TESTS = "OFF", CMAKE_C_COMPILER_LAUNCHER = "bc-ccache", CMAKE_CXX_COMPILER_LAUNCHER = "bc-ccache", CMAKE_HIP_COMPILER_LAUNCHER = "bc-ccache" }
c-compiler = "${RADIANCE_HOST_CC}"
cxx-compiler = "${RADIANCE_HOST_CXX}"
