# Radiance engine recipes (RAD01 PR 3; docs/reference/engines/radiance/PLATFORM_DESIGN.md).
# Patch sets, sources, builds, experiments and runtime profiles for the radiance engine pillar. The patches named
# here are engines/radiance/patches/<id>/ packages; they never mix with llama.cpp's.
version = 2
engine = "radiance"
# radiance 1.9.0 (codeberg StillDeadcode/radiance; exact-SHA mirror Quackster/radiance). v1.9.0 is commit 685ec5b.
pinned = "v1.9.0"
pinned-version = "1.9.0"

# Validated engine fixes only; the set starts empty rather than claiming a validated state no package has.
[patch-set.serving-core]
patches = []

# Empty: rad0001 (shutdown drain) is superseded by radiance 1.7.0 (1e968f6 drains the mover stream in Engine::~Engine).
# The set stays declared as the home for evaluated engine fixes the lab source needs.
[patch-set.engine-fixes-evaluated]
patches = []
required-state = "evaluated"

# Host build compatibility for the pinned engine (rad0005: MP4 writer against FFmpeg 6). Enablers with no runtime path of
# their own; promoted to validated by a passing bump (compile, plugin ABI, component tests, cpu-smoke) and then moved to
# serving-core.
[patch-set.host-compat]
patches = ["rad0005_mp4_ffmpeg6_writer"]
required-state = "untested"

# The remote-MoE hand-off and its diagnostics (shadow compare, mask-only). Diagnostic builds only: patch-lint fails
# if a patch declaring `diagnostic-build` (rad0004) enters any recipe not named *-diag.
[patch-set.moe-remote-diag]
patches = ["rad0002_moe_remote_handoff", "rad0004_moe_remote_diagnostics", "rad0006_heat_freeze_diagnostic"]
required-state = "untested"

[source.radiance-native]
description = "radiance 1.9.0 as released: no overlay, no patches."
overlay = false
patch-sets = []

[source.radiance]
description = "radiance 1.9.0 with BigCherry's validated engine patch sets."
overlay = false
patch-sets = ["serving-core", "host-compat"]

[source.radiance-lab]
description = "radiance 1.9.0 with the evaluated engine fixes the Flash-Next two-XTX configuration needs (none at present)."
overlay = false
patch-sets = ["engine-fixes-evaluated", "host-compat"]

[source.radiance-diag]
description = "radiance 1.9.0 with the validated engine patch sets plus the remote-MoE hand-off and its diagnostics (rad0004); build it with build.moe-diag."
overlay = false
patch-sets = ["serving-core", "host-compat", "moe-remote-diag"]

[build.stock]
description = "radiance's own release build of the engine binary."
options = {}
needs = []

# The diagnostic build: defines BC_MOE_REMOTE_DIAG for the engine core and the arch plugins (rad0004's call sites and
# the extension point's diagnostic answers are compiled out without it). Pair it with source.radiance-diag.
[build.moe-diag]
description = "radiance built with BC_MOE_REMOTE_DIAG: remote-MoE shadow compare and mask-only available."
options = { CMAKE_CXX_FLAGS = "-DBC_MOE_REMOTE_DIAG" }
needs = []

# One focal engine patch per experiment; the 0002-0003 stack is never one indivisible experiment.
[experiment.moe-remote-handoff]
patches = ["rad0002_moe_remote_handoff"]

[experiment.mtp-full-head-switch]
patches = ["rad0003_mtp_full_head_switch"]

# Profiles list only what they switch; libr3's runtime defaults (R3_ATTN_NATIVE on, every other R3_* off) are the
# component's, never restated here.
[runtime-profile.flashnext-2xtx]
server-args = [
  "--tp", "2", "--tp-wire", "exact",
  "--placement", "expert_tiered",
  "--ngram-placement", "ram",
  "--host-pool-mib", "14336",
  "--max-num-seqs", "6",
  "--max-num-batched-tokens", "4096",
  "--checkpoint-interval", "4096",
  "--kv-cache-dtype", "fp8",
  "--num-speculative-tokens", "3",
]
tune-context = 4096
production-context = 32768
min-free-vram-bytes-per-device = 268435456

[runtime-profile.qwen38-27b-2xtx]
server-args = ["--tp", "2", "--tp-wire", "wht6"]
tune-context = 4096
production-context = 8192
min-free-vram-bytes-per-device = 268435456

# Brutus: radiance's host code needs GCC 14 (C++23); HIP is found by radiance's own CMake from ROCm on PATH.
# RAD_GPU_TARGETS names libr4d's kernel targets (gfx12 only); the gfx1100 kernels come from the libr3 component.
# ${VAR} values come from the environment or config/environment.local.toml [env].
[platform.linux-radiance]
description = "brutus: radiance engine build (GCC 14 host compiler; ROCm from PATH)"
targets = ["gfx1201"]
options = { RAD_BUILD_TESTS = "OFF" }
c-compiler = "${RADIANCE_HOST_CC}"
cxx-compiler = "${RADIANCE_HOST_CXX}"
