# How the cards of a host are used by the remote-MoE offload (RAD23): named layouts, no device indices and no host facts. A layout picks
# cards from the host's inventory (config/environment.local.toml [[host.*.devices]]) by architecture, or by index with `devices`, and says what each
# does. The card types themselves are engines/radiance/archs.toml. `bigcherry layout show NAME` resolves one against this host.
#
#   [layout.NAME]                  description, model (relative to BC_MODEL_ROOT), engine
#   engine = { arch = "gfx1201" }  engine card(s); count = 2 makes two TP ranks; devices pins explicit indices
#   tp-wire                         required for TP > 1 (host-memory transport, no P2P)
#   server-args                     optional engine options, each one a manifest setting (context, sessions, chunk, KV dtype, speculative
#                                   tokens, checkpoint interval, host pool, host KV tier, n-gram placement); for a helper layout they are the
#                                   launcher's defaults, which its command-line options override
#   A TP engine (count > 1) may have helpers (RAD49): one request slot a (helper, rank), at most the protocol's kMaxSlots (4), so two
#                                   helpers behind two ranks. A helper computes each expert full width; a layer's consumer rank adds it once.
#   [[layout.NAME.helper]]         a group of helper cards, in order (helper 0 first; helper 0 creates the shared segment)
#     arch      architecture to take from the inventory         devices  explicit indices instead of arch
#     count     how many of that arch ("all" or a number)       budget-mib  VRAM for experts on each card; omitted: derived by bc-serve, the
#                                                               card's own VRAM (inventory / sysfs) less its archs.toml reserve-mib less
#                                                               the helper's own lanes, pointer banks, slot map and incoming slot for
#                                                               this model (moe-remote worker_footprint.h, which the helper checks its
#                                                               lanes against) -- prefer that to a hand-picked number (a literal here is
#                                                               an interim value, RSC03)
#     placement "head": the group takes the heat ranking by `share` (round robin)  "tail": takes the coldest experts that fit what the heads
#               left; only the last group may be tail, and only after a head group
#     share     weight of each card in a head group (default 1; 0 owns nothing)
#   [layout.NAME.env]              R3_MOE_WORKER_* settings for the engine and every helper (strings); not the ones the cards decide
schema = 1

[layout.flashnext-2xtx]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "Flash-Next as it has run since RAD02: the R9700 runs the model, both 7900 XTX cards hold the hottest experts (22 GiB each)"
engine = { arch = "gfx1201" }
[[layout.flashnext-2xtx.helper]]
arch = "gfx1100"
count = "all"
budget-mib = 22528
placement = "head"

[layout.flashnext-r9700]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "Flash-Next on the R9700 alone: no helpers, the experts tiered to host memory (the engine-only isolation probe)"
engine = { arch = "gfx1201" }
# The experts live in the pinned host pool and the n-gram table on disk (47.7 GiB of it in RAM beside the pool does not fit 91 GiB):
# the engine's own default pool is 0, so this layout cannot start without a pool. Context and sessions are what the KL arms use.
# Known limit (launcher, 2026-11-08): a SERVING start of this layout reaches the plan check and is refused by about 1 MiB of VRAM
# (live claimable 33241.7 MB against 33242.7 MB required), because the plan fills the card with experts exactly and the real
# start has a little less free than the measuring start. KL runs (no plan check) are unaffected. A planner margin is the fix.
server-args = [
  "--max-model-len", "8192",
  "--max-num-seqs", "1",
  "--max-num-batched-tokens", "64",
  "--kv-cache-dtype", "fp8",
  "--host-pool-mib", "45056",
  "--ngram-placement", "disk",
]

[layout.flashnext-2xtx-rdna2-tail]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "flashnext-2xtx plus the RX 6900 XT as a third helper holding a small tail of the coldest experts (RAD23: 2 GiB passes the KLD gate cleanly)"
engine = { arch = "gfx1201" }
[[layout.flashnext-2xtx-rdna2-tail.helper]]
arch = "gfx1100"
count = "all"
budget-mib = 22528
placement = "head"
[[layout.flashnext-2xtx-rdna2-tail.helper]]
arch = "gfx1030"
count = 1
budget-mib = 2048
placement = "tail"

[layout.flashnext-2xtx-rdna2-head]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "flashnext-2xtx plus the RX 6900 XT as a head helper with a small share: it takes a weighted slice of the hottest experts, sized so it finishes with the XTX cards (RAD23)"
engine = { arch = "gfx1201" }
[[layout.flashnext-2xtx-rdna2-head.helper]]
arch = "gfx1100"
count = "all"
budget-mib = 22528
placement = "head"
share = 5
[[layout.flashnext-2xtx-rdna2-head.helper]]
arch = "gfx1030"
count = 1
budget-mib = 4096
placement = "head"
share = 1

[layout.flashnext-2xtx-combine]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "flashnext-2xtx with the helper-row combine (RAD18): the two XTX helpers' result rows are added on the CPU so the R9700 reads one plane; the 3,600 tok/s prefill of the model page against ~3,200 without"
engine = { arch = "gfx1201" }
[[layout.flashnext-2xtx-combine.helper]]
arch = "gfx1100"
count = "all"
budget-mib = 22528
placement = "head"
[layout.flashnext-2xtx-combine.env]
R3_MOE_WORKER_COMBINE = "1"

[layout.flashnext-2xtx-rdna2-tail-combine]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "flashnext-2xtx-rdna2-tail with the helper-row combine over all three helpers (RAD23): helper 0 adds the XTX and RX 6900 XT rows on the CPU so the R9700 reads one plane"
engine = { arch = "gfx1201" }
[[layout.flashnext-2xtx-rdna2-tail-combine.helper]]
arch = "gfx1100"
count = "all"
budget-mib = 22528
placement = "head"
[[layout.flashnext-2xtx-rdna2-tail-combine.helper]]
arch = "gfx1030"
count = 1
budget-mib = 2048
placement = "tail"
[layout.flashnext-2xtx-rdna2-tail-combine.env]
R3_MOE_WORKER_COMBINE = "1"

[layout.flashnext-4gpu]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "All four cards, the launcher default (RAD23): the R9700 runs the model, both 7900 XTX cards hold the hottest experts (22 GiB each), the RX 6900 XT the 14 GiB of coldest experts left (tail placement), and helper 0 combines all three helpers' rows on the CPU so the R9700 reads one plane over its link. 8 sessions filling the cache (1.04M prompt tokens): 2,369 tok/s against 1,353 for flashnext-2xtx (+75%) and 2,003 with a 10 GiB tail; a 42K prefill 14.3 s against 16.7 s without the combine and the dot2 tail kernel. Record heat (launcher --record-heat) for the workload served: with stale heat the tail holds experts that are hot for the text."
engine = { arch = "gfx1201" }
[[layout.flashnext-4gpu.helper]]
arch = "gfx1100"
count = "all"
budget-mib = 22528
placement = "head"
[[layout.flashnext-4gpu.helper]]
arch = "gfx1030"
count = 1
budget-mib = 14336
placement = "tail"
[layout.flashnext-4gpu.env]
R3_MOE_WORKER_COMBINE = "1"

# RAD49 step 2: the two XTX run the model tensor-parallel (attention by KV head, GDN by head, the trunk and every resident expert
# split by width, ARCHITECTURES.md qwen4exp) and the R9700 is one remote-MoE helper behind both ranks (it computes each routed
# expert full width once; the layer's consumer rank, alternating by layer, adds it before the all-reduce). No budget-mib: the helper takes its card less archs.toml
# reserve-mib less its own lanes and tables (derived by bc-serve, worker_footprint.h). The XTX pair holds the ~29 GiB of experts the R9700 cannot, so the sessions are
# few and short: 6 x 65536 bounds the KV at about 2.7 GiB a rank (7 KiB a token a rank at fp8), leaving ~14 GiB a rank for
# experts; the engine's measured plan (plan check) decides the split, the rest goes to the host pool. The exact wire: wht6 cost
# Flash-Next 0.075 KLD at 1.3.0 and is a KL-gated arm only.
# --host-pool-mib is INTERIM (RSC03: to be derived per rank from the experts neither the helper's budget nor the ranks' measured
# VRAM holds). radiance pins it once per rank, so 4096 is 8 GiB pinned: the RAD49 estimate's shortfall (expert bytes 59.2 GiB less
# the helper's ~29.9 GiB, halved per rank, against ~14 GiB of each XTX left by trunk, KV bound, GDN state and workspaces) is near
# zero, with ~4 GiB a rank of slack; beside the 47.7 GiB n-gram table in RAM and the 12 GiB host KV tier that stays below what
# flashnext-4gpu pins (9 GiB pool), so the host check keeps its margin. The plan check refuses it if the estimate is wrong.
[layout.flashnext-tp2xtx-r9700]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "RAD49: Flash-Next tensor-parallel on the two 7900 XTX (exact host-memory wire), the R9700 the one remote-MoE helper (its card less the arch reserve and its own lanes), 6 sessions of up to 65,536 tokens"
engine = { arch = "gfx1100", count = 2 }
tp-wire = "exact"
server-args = [
  "--max-model-len", "65536",
  "--max-num-seqs", "6",
  "--host-pool-mib", "4096",
]
[[layout.flashnext-tp2xtx-r9700.helper]]
arch = "gfx1201"
count = 1
placement = "head"

# RAD49 steps 3-4: the two XTX run the model tensor-parallel (exact host-memory wire, as flashnext-tp2xtx-r9700), and both other
# cards are remote-MoE helpers behind both ranks: the R9700 takes the hottest experts it holds, the RX 6900 XT the coldest that fit
# what it left (tail), and helper 0 combines both helpers' rows on the CPU into the consumer rank's plane (one plane a consumer, so
# the alternating consumer reads one row a token over its link). No budget-mib on either: each is its card less archs.toml
# reserve-mib less the helper's own lanes, pointer banks, slot map and incoming slot (worker_footprint.h; ~0.9 GiB a helper behind
# TP2, two consumer ranks' lanes): about 29.0 + 14.1 GiB of the 59.2 GiB of experts. Context and sessions (RAD49 STEP1 D, per XTX of about 23 GiB):
# trunk ~2.2 GiB + lm_head/embed/MTP ~1.1-1.7 + workspaces ~1.5-2.5, the ~16 GiB of experts neither helper holds width-split
# (~8 GiB a rank), which leaves ~8-9 GiB for the KV (fp8, ~7 KiB a token a rank) and the GDN state (~54 MiB a session):
# 8 x 131072 (the 1.05M tokens flashnext-4gpu serves) is ~7.4 GiB of it. 8 x 262144 does not fit (~14.7 GiB). The engine's
# measured plan (plan check) decides the actual split.
# --host-pool-mib is INTERIM (RSC03: to be derived per rank from the experts neither the helpers' budgets nor the ranks' measured
# VRAM hold): the estimate leaves ~1 GiB a rank of slack, and the pool (pinned once per rank, 4 GiB in all) covers an estimate
# error of the same size instead of a start refused by the plan check.
[layout.flashnext-tp2xtx]
model = "radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad"
description = "RAD49: Flash-Next tensor-parallel on the two 7900 XTX (exact host-memory wire); the R9700 (head) and the RX 6900 XT (tail) are remote-MoE helpers behind both ranks, each its card less the arch reserve and its own lanes, with the helper-row combine; 8 sessions of up to 131,072 tokens"
engine = { arch = "gfx1100", count = 2 }
tp-wire = "exact"
server-args = [
  "--max-model-len", "131072",
  "--max-num-seqs", "8",
  "--host-pool-mib", "2048",
]
[[layout.flashnext-tp2xtx.helper]]
arch = "gfx1201"
count = 1
placement = "head"
[[layout.flashnext-tp2xtx.helper]]
arch = "gfx1030"
count = 1
placement = "tail"
[layout.flashnext-tp2xtx.env]
R3_MOE_WORKER_COMBINE = "1"

# Dense tensor-parallel lane: the model is sharded across both selected XTX
# engine cards. There are no remote-MoE helper processes or route-heat inputs.
[layout.qwen27b-2xtx]
