# PWR08: named intent, never a command to write power controls. The one profile file: bc-serve compiles it in (like
# archs.toml) and reads it through the engine's YAML parser; tools/bigcherry/hardware/power_profiles.py reads the same file.
# A serving config selects a profile with x-bigcherry.power.profile (stock when absent).
# default_mode: apply means a model start applies the profile's rules to the cards it runs on and its stop restores the
# originals; observe (the default) writes nothing unless the operator passes --allow-power-apply. stock always observes.
# Every write still needs a qualifying per-card receipt (a lab --allow-power-apply --qualify-power start), the gpu lease
# and the shared PowerTransaction owner. No physical BDF or host-specific calibration may be committed here.
schema: 1
profiles:
  stock:
    default_mode: observe
  # Owner decision 2026-11-28: efficient applies by default at model start. Per-card qualifying receipts remain mandatory.
  # No memory-clock rules.
  efficient:
    default_mode: apply
    rules:
      - role: engine
        arch: gfx1100
        evidence: docs/reference/power-tuning-evidence-2026-11.md
        settings: {sclk_max_mhz: 2700, vddgfx_offset_mv: -125}
      - role: "helper*"
        arch: gfx1100
        evidence: docs/reference/power-tuning-evidence-2026-11.md
        settings: {sclk_max_mhz: 2700, vddgfx_offset_mv: -125}
      - role: engine
        arch: gfx1201
        evidence: docs/reference/power-tuning-evidence-2026-11.md
        settings: {sclk_offset_mhz: -300, vddgfx_offset_mv: -125, power_cap_w: 210}
      - role: "helper*"
        arch: gfx1201
        evidence: docs/reference/power-tuning-evidence-2026-11.md
        settings: {sclk_offset_mhz: -300, vddgfx_offset_mv: -125, power_cap_w: 210}
  # Legacy names retained for old configurations and reproducible research; not new supported targets.
  quiet:
    default_mode: observe
  performance:
    default_mode: observe
  xtx-soak-candidate:
    default_mode: observe
    # Only locally measured extended test: two XTX helper devices, not all gfx1100.
    # This is a CANDIDATE RULE, never an automatic write. The S10 resolver must require evidence for the exact
    # card/build/driver in an explicit apply plan.
    rules:
      - role: "helper*"
        arch: gfx1100
        evidence: "${BC_WORK_ROOT}/runs/pwr01-baseline-10272216/summary.txt"
        settings: {vddgfx_offset_mv: -125}
  # November 2026 power sweep candidate: XTX only. Observe by default. Neither the sweep nor this rule grants per-BDF
  # apply qualification. An explicit apply requires fresh PWR07 probes and independent matching evidence.
  xtx-sclk2700-uv125:
    default_mode: observe
    rules:
      - role: engine
        arch: gfx1100
        evidence: docs/reference/power-tuning-evidence-2026-11.md
        settings: {sclk_max_mhz: 2700, vddgfx_offset_mv: -125}
      - role: "helper*"
        arch: gfx1100
        evidence: docs/reference/power-tuning-evidence-2026-11.md
        settings: {sclk_max_mhz: 2700, vddgfx_offset_mv: -125}
