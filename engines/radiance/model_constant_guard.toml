# Model-constant execution guard (RCS12): the model-shaped literals and symbols the audit found, each with a category and a reason.
# C and D entries name an OPEN plan item as owner and stop being valid when it completes. See tools/bigcherry/model_constants.py.

[scope]
roots = ["engines/radiance/components", "engines/radiance/patches", "tools/lab/radiance"]
extensions = [".h", ".hip", ".cpp", ".cc", ".py", ".sh", ".rw", ".txt", ".toml"]
literals = [2560, 640, 384, 160, 49]
symbols = ["kActivationBf16Bytes", "kActivationQBytes", "kExpertWidth", "kRankWidth", "kHidden", "kMaxRoutes"]
test_patterns = ["session_fake_engine\\.cpp$", "_test\\.cpp$", "/test_[^/]*$", "/tests/", "_fixture\\.h$", "replay"]

