cards: [0, 1, 2]
server:
  host: 127.0.0.1
  port: 36080
  kernels: libbciqr,libr3,libr4d,libref
models:
  qwen27b:
    model: radiance/bigcherry/qwen3.8-27b-iq6r-v4-w3/qwen3.8-27b-iq6r-v4-bc-df2-tp3.rad
    tp: 3
    tp-wire: exact
    max-model-len: 262144
    max-num-seqs: 8
    max-num-batched-tokens: 2048
    checkpoint-interval: 4096
    placement: expert_tiered
    kv-cache-dtype: bf16_i8
    # A dense model has no n-gram table to keep in RAM.
    ngram-placement: disk
    num-speculative-tokens: 3
    prefix-resume: nearest
    rope-scaling: none
    # The ranks exchange through host memory: this host has no peer-to-peer path.
    p2p: "off"
    # The pipelined prefill on an int8 trunk is opt-in (rad0030): "on", not "auto", which keeps such a trunk serial.
    pipelined-prefill: "on"
    # The narrowest pipelined step (VTP31 experiment 12).
    pipelined-prefill-min-rows: 256
    # Prefill governor (VTP42): prompt left in flight held within 1.5x the largest request (262,144 -> 393k tokens) and
    # free KV; prompts within 16k tokens are never held back; prefill work goes to the prompt with least left; a prompt
    # still waiting to start after 120 s reserves its place against later long prompts. Eight 100k prompts plus 4k / 8k /
    # 16k requests arriving mid-run (-long-bf16): 100k mean first token 299 -> 228 s and last 477 -> 390 s against the
    # VTP39/VTP41 cap of two, mid-size 5-8 / 11-16 / 19-28 s (unchanged), no preemptions. Evidence:
    # docs/evidence/2026-11-16-vtp42-prefill-governor/README.md (and the VTP39/VTP41 evidence it builds on).
    prefill-governor: "kind=budget;factor=1.5;long_tokens=16384;order=remaining;age_ms=120000"
    prefill-interleave: 2
    tp-ownership: "kv=1,1,2;ffn=6656,6656,4096;lk=6,6,4;lv=18,18,12"
    # The all-reduce grid and two-shot form (rad0022, rad0032, rad0033): time to first token -13 / -24 / -22% at 512 / 2048 /
    # 6144 tokens, 4/6/8 streams +7.6 / +10.9 / +13.9%, bit-identical output (VTP31, VTP36).
    tune-pin: "all_reduce:nblocks=4,nthreads=256,ts_pieces=4,ts_fuse=1,ts_once=1,ts_duplex=1"
x-bigcherry:
  schema: 1
  power: {profile: efficient}
  description: "qwen27b-tp3-long-q6bc with bf16 keys and int8 values (bf16_i8): 993,258 tokens, the bf16 cache's decode speed"
  variant-of: "qwen27b-tp3-long-q6bc"
  differs: ["models.qwen27b.kv-cache-dtype"]
  ranks:
    - {arch: "gfx1100", count: 2}
    - {arch: "gfx1201", count: 1}
  memory: {host-pool-mib: 0, host-kv-mib: 0}
