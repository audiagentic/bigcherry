# Dense Qwen3.8-27B serving configs (RSC12). Format: README.md in this directory.
# Converted from engines/radiance/layouts/qwen27b.toml one config at a time; the names stay the layout names until the
# v2 manifest switch (RSC11 S13), so the plan keys and live-policy records do not move.
schema = 1

# Native three-rank tensor parallelism over two card types, int8 (w8a8) weights: both XTX ranks first, then the R9700,
# each rank on its own architecture's kernels. Exact wire: the lossy three-rank wire is not usable yet.
[config.qwen27b-tp3-int8]
description = "Qwen3.8-27B w8a8 over XTX, XTX, R9700 (native TP3): delta-net 6/6/4, feed-forward 6656/6656/4096"
model = "radiance/bigcherry/qwen3.8-27b-w8a8/qwen3.8-27b-w8a8-df2.rad"
ranks = [{ arch = "gfx1100", count = 2 }, { arch = "gfx1201", count = 1 }]
tp_wire = "exact"

[config.qwen27b-tp3-int8.service]
max_context = 8192
max_sessions = 8

[config.qwen27b-tp3-int8.engine]
kv_cache_dtype = "fp8"
num_speculative_tokens = 3
# A dense model has no n-gram table to keep in RAM.
ngram_placement = "disk"

# No host expert pool and no host KV tier: the engine sizes its own memory. bc-serve's constants (a 9 GiB pool, a 12 GiB
# tier) are measured for helper layouts.
[config.qwen27b-tp3-int8.memory]
host_pool_mib = 0
host_kv_mib = 0

[config.qwen27b-tp3-int8.tuning]
# The ranks exchange through host memory: this host has no peer-to-peer path.
p2p = "off"
tp_ownership = "kv=1,1,2;ffn=6656,6656,4096;lk=6,6,4;lv=18,18,12"
# The pipelined prefill on the int8 trunk is opt-in (rad0030): "on", not "auto", which keeps such a trunk serial.
# One-prompt time to first token -17% to -21%, four 4096-token prompts -16%, 4/6/8 streams +7.4% / +7.8% / +8.4%; KLD
# against the serial prefill 0.0012 mean, top-1 99.3%, less than the serial prefill moves when its chunk is halved (VTP37).
pipelined_prefill = "on"
# The all-reduce grid and two-shot form (rad0022, rad0032, rad0033): time to first token -13 / -24 / -22% at 512 / 2048 /
# 6144 tokens, 4/6/8 streams +7.6 / +10.9 / +13.9%, bit-identical output (VTP31, VTP36).
tune_pin = "all_reduce:nblocks=4,nthreads=256,ts_pieces=4,ts_fuse=1,ts_once=1,ts_duplex=1"
# The narrowest pipelined step, as in the MXFP4 layout (VTP31 experiment 12).
pipelined_prefill_min_rows = 256

# The 5,5,6 split: the R9700 takes the largest share of heads and feed-forward, so each card keeps about 228,000 tokens of
# KV cache against about 56,000. Against qwen27b-tp3-int8 (ABBA, n=8): 1/4/6/8 streams +2.6 / +2.3 / +12.0 / +5.4%, time to
# first token -2.8 / -0.1 / -4.3% at 512 / 2048 / 6144 tokens; passes the reordering quality gate against its own serial
# prefill and is nearer BF16 (VTP36). Not the default until the owner chooses.
[config.qwen27b-tp3-int8-556]
base = "qwen27b-tp3-int8"
description = "qwen27b-tp3-int8 with the 5,5,6 split: about 4x the KV cache per card"

[config.qwen27b-tp3-int8-556.tuning]
tp_ownership = "kv=1,1,2;ffn=5632,5632,6144;lk=5,5,6;lv=15,15,18"

# The MXFP4 container on the same three ranks (VTP14): the R9700 takes the largest share. The split is a setting, checked
# against the loaded model, so a sweep is `--set tuning.tp_ownership=...` and needs no rebuild.
[config.qwen27b-tp3]
description = "Qwen3.8-27B MXFP4 over XTX, XTX, R9700 (native TP3): 6/6/12 query heads, the R9700 the largest share"
model = "radiance/StillDeadcode/qwen3.8-27b-mxfp4/qwen3.8-27b-mxfp4.rad"
ranks = [{ arch = "gfx1100", count = 2 }, { arch = "gfx1201", count = 1 }]
tp_wire = "exact"

[config.qwen27b-tp3.service]
max_context = 8192
max_sessions = 8

[config.qwen27b-tp3.engine]
kv_cache_dtype = "fp8"
num_speculative_tokens = 3
ngram_placement = "disk"   # a dense model has no n-gram table to keep in RAM

[config.qwen27b-tp3.memory]   # the engine sizes its own memory (see qwen27b-tp3-int8)
host_pool_mib = 0
host_kv_mib = 0

[config.qwen27b-tp3.tuning]
p2p = "off"   # the ranks exchange through host memory
tp_ownership = "kv=1,1,2;ffn=5120,4864,7424;lk=4,4,8;lv=12,12,24"
pipelined_prefill = "auto"
# The all-reduce grid (rad0022): four blocks of 256 threads beat the default at every stream count and prompt size, with
# identical output (VTP31 experiment 1). The two-shot form (rad0032, rad0033): four pieces with the fused step, the duplex
# link weights and the reduced shard written once. Against the grid alone: time to first token -21 / -27 / -25% at
# 512 / 2048 / 6144 tokens, 4/6/8 streams +13.6 / +13.5 / +16.7%, bit-identical output (VTP36).
tune_pin = "all_reduce:nblocks=4,nthreads=256,ts_pieces=4,ts_fuse=1,ts_once=1,ts_duplex=1"
# Pipeline a one-sequence prefill step from 256 rows rather than 1024, so a 512-token prompt overlaps its all-reduces too:
# +7.6% / +2.9% / +1.6% at 1/4/8 streams, identical output (VTP31 experiment 7).
pipelined_prefill_min_rows = 256

# For resident context rather than speed: the delta-net and feed-forward shares move off the R9700, so with rad0029 (every
# rank its own VRAM split) its memory goes to the KV cache. At 262,144 tokens and 8 sequences it holds 6.7 full-length
# sessions against qwen27b-tp3's 5.5 and dual-XTX TP2's 3.3, at 3-8% less throughput than qwen27b-tp3 (VTP33).
[config.qwen27b-tp3-capacity]
base = "qwen27b-tp3"
description = "qwen27b-tp3 for resident context: 7/7/2 delta-net, 7680/7680/2048 feed-forward, 262,144 tokens"

[config.qwen27b-tp3-capacity.service]
max_context = 262144

[config.qwen27b-tp3-capacity.tuning]
tp_ownership = "kv=1,1,2;ffn=7680,7680,2048;lk=7,7,2;lv=21,21,6"
# the all-reduce grid without the two-shot form, as this split was measured (VTP33)
tune_pin = "all_reduce:nblocks=4,nthreads=256"

# Two RDNA3 engine ranks with the lossy wht6 all-reduce over host memory: no helpers, no route heat.
[config.qwen27b-2xtx]
description = "Qwen3.8-27B MXFP4, two RDNA3 engine ranks with host-memory wht6 all-reduce"
model = "radiance/StillDeadcode/qwen3.8-27b-mxfp4/qwen3.8-27b-mxfp4.rad"
ranks = [{ arch = "gfx1100", count = 2 }]
tp_wire = "wht6"

[config.qwen27b-2xtx.service]
max_context = 8192
max_sessions = 6

[config.qwen27b-2xtx.engine]
max_num_batched_tokens = 2048
kv_cache_dtype = "fp8"
num_speculative_tokens = 3
ngram_placement = "disk"

[config.qwen27b-2xtx.memory]
host_pool_mib = 0
host_kv_mib = 0

[config.qwen27b-2xtx.tuning]
p2p = "off"

# The 5,5,6 split at 262,144 tokens a session. The cache is sized from the context setting, not the cards: at 8 x 8192
# the cards kept about 10 GiB each unused, and at 8 x 262,144 the cache takes them. 2026-11-14 (one start each):
#
#                     cache tokens   1 / 4 / 8 streams tok/s   TTFT 2048   KLD against a bf16 cache (short / long)
#   -556 (8 x 8192)        320,167     91.4 / 226.0 / 275.5     777 ms     0.0022 / 0.0054
#   -556-long            1,253,943     91.6 / 225.2 / 274.4     782 ms     0.0022 / 0.0054
#   -556-long-bf16         624,051     93.5 / 231.1 / 284.9     781 ms     0 (the reference)
#
# A 60,000-token prompt (bc-serve serve, one start each): time to first token 30.7 s with fp8 and 27.2 s with bf16, then a
# decode step of 39.4 and 32.6 ms. The XTX cards have no native fp8, so an fp8 cache costs a conversion on every read.
#
# The fp8 cache (E4M3, its scales at 1.0) costs about what the int8 weights do on short text; on 25K-104K documents its
# mean is 0.0054 and the tail is wide (two of five documents reach p99.9 of 4 and 8 late in the text). The bf16 cache has
# no rounding and holds half as many tokens. Full-length sessions at once, as the engine counts them: 2.8 with fp8, 1.4
# with bf16; with all 8 sessions busy that is about 157,000 and 78,000 tokens each.
[config.qwen27b-tp3-int8-556-long]
base = "qwen27b-tp3-int8-556"
description = "qwen27b-tp3-int8-556 at 262,144 tokens a session: about 1.25 M tokens of fp8 cache"

[config.qwen27b-tp3-int8-556-long.service]
max_context = 262144

[config.qwen27b-tp3-int8-556-long-bf16]
base = "qwen27b-tp3-int8-556-long"
description = "qwen27b-tp3-int8-556-long with a 16-bit (bf16) cache: about 624,000 tokens, no cache rounding"

[config.qwen27b-tp3-int8-556-long-bf16.engine]
kv_cache_dtype = "bf16"
