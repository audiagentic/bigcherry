cards: [0, 1, 2]
server:
  host: 127.0.0.1
  port: 36080
  kernels: libr3,libr4d,libref
models:
  qwen27b:
    # Radiance 2.2 retired MXFP4 and the packed KV caches (bf16_fp8, bf16_i8); this config serves upstream's IQ8R container
    # (StillDeadcode/qwen3.8-27b-iq8r-dflash, 29 GiB, served by qwen35_w8a8, DFlash2 drafter in IQ4R codes) with the 8-bit i8 KV cache
    # upstream pairs with it (GUIDE 4.4: K and V as int8 with an f16 scale per token and head; mean KL 0.000436 against bf16).
    # The measurements quoted below were taken on the earlier MXFP4 / w8a8 containers and the fp8 cache: re-measure before relying on them.
    model: radiance/StillDeadcode/qwen3.8-27b-iq8r-dflash/qwen3.8-27b-iq8r-dflash.rad
    tp: 3
    tp-wire: exact
    max-model-len: 262144
    max-num-seqs: 8
    max-num-batched-tokens: 2048
    checkpoint-interval: 4096
    placement: expert_tiered
    kv-cache-dtype: i8
    # A dense model has no n-gram table to keep in RAM.
    ngram-placement: disk
    num-speculative-tokens: 3
    prefix-resume: nearest
    rope-scaling: none
    # The ranks exchange through host memory: this host has no peer-to-peer path.
    p2p: "off"
    # The pipelined prefill on the int8 trunk is opt-in (rad0030): "on", not "auto", which keeps such a trunk serial.
    # One-prompt time to first token -17% to -21%, four 4096-token prompts -16%, 4/6/8 streams +7.4% / +7.8% / +8.4%; KLD
    # against the serial prefill 0.0012 mean, top-1 99.3%, less than the serial prefill moves when its chunk is halved (VTP37).
    pipelined-prefill: "on"
    # The narrowest pipelined step, as in the MXFP4 layout (VTP31 experiment 12).
    pipelined-prefill-min-rows: 256
    # Prefill governor (VTP42): prompt left in flight held within 1.5x the largest request (262,144 -> 393k tokens) and
    # free KV; prompts within 16k tokens are never held back; prefill work goes to the prompt with least left; a prompt
    # still waiting to start after 120 s reserves its place against later long prompts. Eight 100k prompts plus 4k / 8k /
    # 16k requests arriving mid-run (-long-bf16): 100k mean first token 299 -> 228 s and last 477 -> 390 s against the
    # VTP39/VTP41 cap of two, mid-size 5-8 / 11-16 / 19-28 s (unchanged), no preemptions. Evidence:
    # docs/evidence/2026-11-16-vtp42-prefill-governor/README.md (and the VTP39/VTP41 evidence it builds on).
    prefill-governor: "kind=budget;factor=1.5;long_tokens=16384;order=remaining;age_ms=120000"
    prefill-interleave: 2
    tp-ownership: "kv=1,1,2;ffn=5632,5632,6144;lk=5,5,6;lv=15,15,18"
    # The all-reduce grid and two-shot form (rad0022, rad0032, rad0033): time to first token -13 / -24 / -22% at 512 / 2048 /
    # 6144 tokens, 4/6/8 streams +7.6 / +10.9 / +13.9%, bit-identical output (VTP31, VTP36).
    tune-pin: "all_reduce:nblocks=4,nthreads=256,ts_pieces=4,ts_fuse=1,ts_once=1,ts_duplex=1"
x-bigcherry:
  schema: 1
  description: "qwen27b-tp3-int8-556 at 262,144 tokens a session: about 1.25 M tokens of fp8 cache"
  variant-of: "qwen27b-tp3-int8-556"
  differs: ["models.qwen27b.max-model-len", "models.qwen27b.prefill-governor", "models.qwen27b.prefill-interleave"]
  ranks:
    - {arch: "gfx1100", count: 2}
    - {arch: "gfx1201", count: 1}
  memory: {host-pool-mib: 0, host-kv-mib: 0}
