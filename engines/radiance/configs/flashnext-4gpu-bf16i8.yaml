cards: [0]
server:
  host: 127.0.0.1
  port: 36080
  kernels: libbciqr,libr4d,libr3moe,libref
models:
  flashnext:
    model: radiance/StillDeadcode/qwen3.8-next-flash-fp8-iq4r-moe/qwen3.8-next-flash-fp8-iq4r-moe.rad
    tp: 1
    max-model-len: 262144
    max-num-seqs: 4
    max-num-batched-tokens: 2048
    checkpoint-interval: 4096
    placement: expert_tiered
    kv-cache-dtype: bf16_i8
    num-speculative-tokens: 3
    prefix-resume: nearest
    rope-scaling: none
    prefill-interleave: 0
    mixed-step-target-ms: 0
x-bigcherry:
  schema: 1
  power: {profile: efficient}
  description: "flashnext-4gpu with a bf16_i8 cache at 4 sessions (not the default: fp8 at 8 sessions is)"
  variant-of: "flashnext-4gpu"
  differs: ["models.flashnext.kv-cache-dtype", "models.flashnext.max-num-seqs"]
  ranks:
    - {arch: "gfx1201", count: 1}
  helpers:
    - {arch: "gfx1100", count: "all", placement: "head"}
    - {arch: "gfx1030", count: 1, placement: "tail"}
  handoff: {heat: "@bundle/heat/flashnext-mixed.hot-first", histogram-period-s: 1}
  helper: {combine: true}
