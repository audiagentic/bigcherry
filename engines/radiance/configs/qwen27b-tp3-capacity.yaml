cards: [0, 1, 2]
server:
  host: 127.0.0.1
  port: 36080
  kernels: libr3,libr4d,libref
models:
  qwen27b:
    # Radiance 2.2 retired MXFP4 and the packed KV caches (bf16_fp8, bf16_i8); this config serves upstream's IQ8R container
    # (StillDeadcode/qwen3.8-27b-iq8r-dflash, 29 GiB, served by qwen35_w8a8, DFlash2 drafter in IQ4R codes) with the 8-bit i8 KV cache
    # upstream pairs with it (GUIDE 4.4: K and V as int8 with an f16 scale per token and head; mean KL 0.000436 against bf16).
    # The measurements quoted below were taken on the earlier MXFP4 / w8a8 containers and the fp8 cache: re-measure before relying on them.
    model: radiance/StillDeadcode/qwen3.8-27b-iq8r-dflash/qwen3.8-27b-iq8r-dflash.rad
    tp: 3
    tp-wire: exact
    max-model-len: 262144
    max-num-seqs: 8
    max-num-batched-tokens: 2048
    checkpoint-interval: 4096
    placement: expert_tiered
    kv-cache-dtype: i8
    ngram-placement: disk
    num-speculative-tokens: 3
    prefix-resume: nearest
    rope-scaling: none
    p2p: "off"
    pipelined-prefill: auto
    # Pipeline a one-sequence prefill step from 256 rows rather than 1024, so a 512-token prompt overlaps its all-reduces too:
    # +7.6% / +2.9% / +1.6% at 1/4/8 streams, identical output (VTP31 experiment 7).
    pipelined-prefill-min-rows: 256
    tp-ownership: "kv=1,1,2;ffn=7680,7680,2048;lk=7,7,2;lv=21,21,6"
    # the all-reduce grid without the two-shot form, as this split was measured (VTP33)
    tune-pin: "all_reduce:nblocks=4,nthreads=256"
x-bigcherry:
  schema: 1
  description: "qwen27b-tp3 for resident context: 7/7/2 delta-net, 7680/7680/2048 feed-forward, 262,144 tokens"
  variant-of: "qwen27b-tp3"
  differs: ["models.qwen27b.max-model-len", "models.qwen27b.tp-ownership", "models.qwen27b.tune-pin"]
  ranks:
    - {arch: "gfx1100", count: 2}
    - {arch: "gfx1201", count: 1}
  memory: {host-pool-mib: 0, host-kv-mib: 0}
