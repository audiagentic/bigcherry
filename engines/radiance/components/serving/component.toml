# CPU-only serving configuration (RSC01).
schema = 1
name = "serving"
engine = "radiance"
# Existing engine targets; this component itself has no GPU code.
targets = ["gfx1100", "gfx1201"]
built-against = "v1.17.0"
outputs = ["bin/bc-serve", "bin/bc-release"]

[build]
configure = { RADIANCE_SRC = "{engine_source}" }

[test]
targets = ["bc_serving_test", "bc_session_test", "bc_session_guards_test", "bc_stored_manifest_cache_test", "bc_session_stored_test", "bc_s15_dry_run_test", "bc_stored_manifest_test", "bc_manifest_power_test", "bc_resources_parity_test", "bc_session_callback_guard", "bc_power_transaction_test", "bc_callback_boundary_abi_test", "bc_callback_boundary_cpp17_test", "bc_callback_boundary_guard", "bc_live_policy_test", "bc_live_policy_ingest_test", "bc_jcs_test", "bc_contract_test", "bc_contract_check", "bc_v2_reader_test", "bc_s5_refusal_test", "bc_experts_test", "bc_owner_map_test", "bc_v2_codec_test", "bc_v2_s8_test", "bc_v2_s10_test", "bc_v2_p1_test", "bc_v2_p1_live_test", "bc_v2_p1_producer_test", "bc_v2_native_measurement_test", "bc_v2_runtime_receipt_test", "bc_v2_runtime_receipt_live_test", "bc_release_install_test", "bc_typed_settings_test"]
