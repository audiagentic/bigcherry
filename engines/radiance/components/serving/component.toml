# CPU-only serving configuration (RSC01).
schema = 1
name = "serving"
engine = "radiance"
# Existing engine targets; this component itself has no GPU code.
targets = ["gfx1100", "gfx1201"]
built-against = "b6b8751cccb0e834a13ae9e5afca824ee9a487aa"
outputs = ["bin/bc-serve", "bin/bc-release"]

[build]
configure = { RADIANCE_SRC = "{engine_source}" }

[test]
targets = ["bc_lab_trace_experiment_test", "bc_session_host_start_test", "bc_feature_state_test", "bc_helper_vram_test", "bc_engine_identity_test", "bc_serving_test", "bc_session_test_part1", "bc_session_test_part2", "bc_session_test_part3", "bc_session_test_part4", "bc_contract_identity_test", "bc_session_guards_test", "bc_stored_manifest_cache_test", "bc_session_stored_test", "bc_stored_manifest_test", "bc_manifest_power_test", "bc_resources_parity_test", "bc_session_callback_guard", "bc_power_transaction_test", "bc_callback_boundary_abi_test", "bc_callback_boundary_cpp17_test", "bc_live_policy_test", "bc_live_policy_ingest_test", "bc_jcs_test", "bc_contract_test", "bc_contract_check", "bc_s5_refusal_test", "bc_experts_test", "bc_owner_map_test", "bc_v2_s8_test", "bc_v2_p1_test", "bc_v2_p1_live_test", "bc_v2_p1_producer_test", "bc_v2_native_measurement_test", "bc_v2_runtime_receipt_test", "bc_v2_runtime_receipt_live_test", "bc_release_install_test", "bc_serving_v3_wire_test", "bc_serving_v3_writer_test"]

# Names crossing the Radiance build/runtime boundary. The core coupling gate
# checks literals and source inventory; RUM02-07 own the eventual migration.
[coupling]
upstream-headers = ["rad_abi.h", "rad_encoding.h", "rad_format.h", "rad_types.h"]
upstream-files = ["abi/rad_abi.h", "abi/rad_encoding.h", "abi/rad_format.h", "abi/rad_types.h"]
upstream-source-globs = []
patch-provided-files = []
protocol-flags = ["--bc-heat-launch-nonce", "--bc-step-phase-dir", "--manifest", "--measuring", "--plan-memory", "--plan-memory-ranks", "--role"]
owned-flags = ["--allow-downgrade", "--allow-power-apply", "--apply", "--bc-inspect-native-config", "--bc-native-config-fd", "--calibration", "--calibration-records", "--calibration-run", "--configs", "--detect", "--engine-binary", "--expected-dev", "--expected-ino", "--expected-manifest-digest", "--expected-owner-attempt", "--expected-plan-key", "--experiment", "--explain", "--from-log", "--help", "--json", "--kld-corpus", "--kld-out", "--kld-record", "--kld-ref", "--lab-experiment", "--live-policy", "--model-root", "--native-config", "--plan-cache", "--plan-extra", "--power-profile", "--profile", "--record-dir", "--run-dir", "--run-id", "--s8-replay-evidence", "--schema", "--set", "--site", "--step-phase-trace", "--strict-production-features", "--sys-root", "--unmeasured", "--validate", "--work-root", "--write-manifest"]
runtime-env = ["GPU_DEVICE_ORDINAL", "HIP_PATH", "HIP_VISIBLE_DEVICES", "R3_AR_WIRE4", "R3_ATTN_NATIVE", "R3_DEC11", "R3_GEMV", "R3_MOE_AHALF", "R3_MOE_FP16", "R3_MOE_NATIVE", "R3_MOE_WORKER_FORMATS", "R3_MOE_WORKER_FUSESTAGE", "R3_MOE_WORKER_MASK_ONLY", "RADIANCE_HOME", "RADIANCE_KERNELS", "ROCR_VISIBLE_DEVICES"]
abi-version = 43
option-registry = "contract/serving.toml"
