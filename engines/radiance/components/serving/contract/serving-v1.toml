# Serving manifest v1 field registry: the one authoritative description of the v1 contract
# (docs/design/serving-manifest-v1/spec.md). contract/generate.cpp turns it into the JSON Schema, the typed model,
# the field reference and the contract fingerprint (engines/radiance/components/serving/generated/); CI regenerates
# them and byte-diffs the committed copies. v1 is closed (spec §8): a change that moves either fingerprint (what
# validates, or a field's class or Radiance binding) is a bigcherry/v2 change; correcting a doc is not (README.md).
#
# Format (see contract/README.md): [contract] identity; [[def]] shared types ($defs); [[class_default]] provenance
# class defaults by path prefix; [[calibration_key]] the calibrated keys and each value's type; [[field]] one entry per
# schema node, parents before children, members in document order. Paths are JSON Pointers from the document root, or
# from a def as "$defs/<name>/..."; "[]" is an array's item and "*" a map's value. Numbers are integers only.

[contract]
api_version = "bigcherry/v1"
kind = "ServingManifest"
contract_version = 1
schema_dialect = "https://json-schema.org/draft/2020-12/schema"
schema_id = "urn:bigcherry:serving-manifest:v1"
title = "BigCherry ServingManifest v1 (wire)"
namespace = "bc::serving::v1"
lifecycle = "startup_only"

# Provenance class of each subtree (the longest matching prefix wins). `envelope` marks the integrity fields that
# identify the document; it is not a provenance record class and decides nothing about coverage (spec §7; README.md).

[[class_default]]
path = "/apiVersion"
class = "envelope"

[[class_default]]
path = "/kind"
class = "envelope"

[[class_default]]
path = "/metadata"
class = "envelope"

[[class_default]]
path = "/provenance"
class = "envelope"

[[class_default]]
path = "/spec/intent"
class = "policy"

[[class_default]]
path = "/spec/facts"
class = "fact"

[[class_default]]
path = "/spec/calibration"
class = "tuned"

[[class_default]]
path = "/spec/resources"
class = "derived"

[[class_default]]
path = "/spec/handoff"
class = "derived"

[[class_default]]
path = "/spec/handoff/telemetry"
class = "policy"

[[class_default]]
path = "/spec/processes/engine"
class = "derived"

[[class_default]]
path = "/spec/processes/engine/runtime"
class = "policy"

[[class_default]]
path = "/spec/processes/engine/server"
class = "policy"

[[class_default]]
path = "/spec/processes/engine/execution"
class = "policy"

[[class_default]]
path = "/spec/processes/helper_common"
class = "policy"

[[class_default]]
path = "/spec/processes/helpers"
class = "derived"

[[class_default]]
path = "/spec/processes/helpers/[]/settings"
class = "policy"

[[class_default]]
path = "/spec/plan"
class = "derived"

[[class_default]]
path = "/spec/experiment"
class = "diagnostic"

[[class_default]]
path = "$defs/helperCommon"
class = "policy"

[[class_default]]
path = "$defs/enginePlan"
class = "derived"

# Calibrated keys, in schema order; each value's type (spec §11, amendment 1: integers only).

[[calibration_key]]
key = "host_reserve.floor_mib"
value_kind = "ref"
value_ref = "uint"
doc = "Smallest host reserve, MiB."

[[calibration_key]]
key = "host_reserve.total_fraction_ppm"
value_kind = "integer"
value_minimum = 0
value_exclusive_maximum = 1000000
doc = "Host reserve as a fraction of MemTotal, ppm."

[[calibration_key]]
key = "kv_backing_floor.fraction_ppm"
value_kind = "integer"
value_minimum = 0
value_exclusive_maximum = 1000000
doc = "KV backing floor as a fraction of the total KV ceiling, ppm (spec §5.2)."

[[calibration_key]]
key = "checkpoint_share"
value_kind = "enum"
value_values = ["tier_first", "want", "floor"]
doc = "How checkpoint memory is shared with the KV tier."

[[calibration_key]]
key = "host_kv_tier.target_mib"
value_kind = "ref"
value_ref = "uint"
doc = "Host KV tier target, MiB."

# ---- shared types ($defs), in schema order ----

[[def]]
name = "uint"
kind = "integer"
minimum = 0
maximum = 9007199254740991
doc = "Unsigned integer within I-JSON's safe range."

[[def]]
name = "positive"
kind = "integer"
minimum = 1
maximum = 9007199254740991
doc = "Positive integer within I-JSON's safe range."

[[def]]
name = "hex64"
kind = "string"
pattern = "^[0-9a-f]{64}$"
max_length = 64
doc = "64 lowercase hexadecimal digits."

[[def]]
name = "digest"
kind = "string"
pattern = "^sha256:[0-9a-f]{64}$"
max_length = 71
doc = "`sha256:` followed by 64 lowercase hexadecimal digits."

[[def]]
name = "bdf"
kind = "string"
pattern = "^[0-9a-f]{4}:[0-9a-f]{2}:[0-1][0-9a-f]\\.[0-7]$"
max_length = 12
doc = "PCI address, `dddd:bb:dd.f`, lowercase."

[[def]]
name = "jsonPointer"
kind = "string"
pattern = "^(|/(?:[^~/]|~[01])*(?:/(?:[^~/]|~[01])*)*)$"
max_length = 4096
doc = "RFC 6901 JSON Pointer; \"\" is the root."

[[def]]
name = "helperCommon"
kind = "object"
cpp = "HelperCommon"
doc = "The seven helper concern groups (spec §2.1)."

[[field]]
path = "$defs/helperCommon/cpu"
kind = "object"
cpp = "HelperCpu"
doc = "CPU paths."

[[field]]
path = "$defs/helperCommon/cpu/reference"
kind = "boolean"
doc = "Use the CPU reference path."

[[field]]
path = "$defs/helperCommon/cpu/affinity"
kind = "enum"
values = ["auto", "all"]
cpp_type = "Affinity"
doc = "Worker CPU affinity: `auto` or `all`."

[[field]]
path = "$defs/helperCommon/runtime"
kind = "object"
cpp = "HelperRuntime"
doc = "Helper runtime behaviour."

[[field]]
path = "$defs/helperCommon/runtime/power_save"
kind = "boolean"
doc = "Let the helper idle its GPU between requests."

[[field]]
path = "$defs/helperCommon/runtime/queue_warm"
kind = "boolean"
doc = "Keep the helper's queues warm."

[[field]]
path = "$defs/helperCommon/gemv"
kind = "object"
cpp = "HelperGemv"
doc = "GEMV kernels."

[[field]]
path = "$defs/helperCommon/gemv/mode"
kind = "int_enum"
values = [0, 1, 2]
doc = "GEMV mode (0, 1 or 2)."

[[field]]
path = "$defs/helperCommon/gemv/wide"
kind = "boolean"
doc = "Use the wide GEMV kernel."

[[field]]
path = "$defs/helperCommon/gemv/h2"
kind = "int_enum"
values = [0, 1, 2, 4]
doc = "Half-precision pair mode (0, 1, 2 or 4)."

[[field]]
path = "$defs/helperCommon/gemv/w4h2"
kind = "boolean"
doc = "Use the W4 H2 kernel."

[[field]]
path = "$defs/helperCommon/gemv/mr"
kind = "boolean"
doc = "Use the multi-row GEMV kernel."

[[field]]
path = "$defs/helperCommon/lanes"
kind = "object"
cpp = "HelperLanes"
doc = "Request lanes."

[[field]]
path = "$defs/helperCommon/lanes/small_lanes"
kind = "array"
item_kind = "ref"
item_ref = "positive"
min_items = 0
max_items = 4
doc = "Up to four sorted small-lane row thresholds."

[[field]]
path = "$defs/helperCommon/lanes/rows"
kind = "boolean"
doc = "Use the rows kernel by policy (active also when the architecture requires it)."

[[field]]
path = "$defs/helperCommon/lanes/rows_small"
kind = "boolean"
doc = "Use the rows kernel for small lanes."

[[field]]
path = "$defs/helperCommon/combine"
kind = "object"
cpp = "HelperCombine"
doc = "Helper-side combine."

[[field]]
path = "$defs/helperCommon/combine/enabled"
kind = "boolean"
doc = "Combine expert outputs on the helper."

[[field]]
path = "$defs/helperCommon/combine/min_rows"
kind = "ref"
ref = "positive"
doc = "Fewest rows a combine is used for."

[[field]]
path = "$defs/helperCommon/combine/threads"
kind = "ref"
ref = "positive"
doc = "Combine worker threads."

[[field]]
path = "$defs/helperCommon/kernels"
kind = "object"
cpp = "HelperKernels"
doc = "Kernel choices."

[[field]]
path = "$defs/helperCommon/kernels/native"
kind = "boolean"
doc = "Use native kernels."

[[field]]
path = "$defs/helperCommon/kernels/fp16"
kind = "boolean"
doc = "Use fp16 kernels."

[[field]]
path = "$defs/helperCommon/kernels/ahalf"
kind = "boolean"
doc = "Use half-precision activations."

[[field]]
path = "$defs/helperCommon/kernels/moe_form"
kind = "int_enum"
values = [0, 1, 2]
doc = "MoE kernel form (0, 1 or 2)."

[[field]]
path = "$defs/helperCommon/kernels/moe_long_rows"
kind = "ref"
ref = "uint"
doc = "Row count from which the long-rows MoE kernel is used."

[[field]]
path = "$defs/helperCommon/kernels/fuseroute"
kind = "boolean"
doc = "Fuse routing into the MoE kernel."

[[field]]
path = "$defs/helperCommon/kernels/vecio"
kind = "boolean"
doc = "Vectorized I/O."

[[field]]
path = "$defs/helperCommon/kernels/sparse_act"
kind = "boolean"
doc = "Sparse activations."

[[field]]
path = "$defs/helperCommon/kernels/lane_quant"
kind = "boolean"
doc = "Quantize per lane."

[[field]]
path = "$defs/helperCommon/placement"
kind = "object"
cpp = "HelperPlacement"
doc = "Load balancing across helpers."

[[field]]
path = "$defs/helperCommon/placement/balance"
kind = "boolean"
doc = "Balance load across helpers by speed."

[[field]]
path = "$defs/helperCommon/placement/balance_speeds_milli"
optional = true
kind = "array"
item_kind = "integer"
item_minimum = 1
doc = "Per-helper relative speed in thousandths (1000 = 1.0); one value per helper, only when balance is true."

[[def]]
name = "helperPatch"
kind = "patch"
of = "helperCommon"
cpp = "HelperPatch"
doc = "A partial `helperCommon`: each present group is a nonempty partial field map (spec §2.2)."

[[def]]
name = "enginePlan"
kind = "object"
cpp = "EnginePlan"
doc = "rad0011's measured memory plan, plan_version 1 (spec §5)."

[[field]]
path = "$defs/enginePlan/plan_version"
mismatch = "unsupported_version"
kind = "integer"
const = 1
doc = "Plan format; exactly 1."

[[field]]
path = "$defs/enginePlan/producer"
kind = "string"
const = "radiance --plan-memory (rad0011)"
doc = "Plan producer; exactly `radiance --plan-memory (rad0011)`."

[[field]]
path = "$defs/enginePlan/host"
kind = "array"
item_kind = "object"
min_items = 0
doc = "Pinned host consumers."

[[field]]
path = "$defs/enginePlan/host/[]"
kind = "object"
cpp = "PlanHostConsumer"
doc = "One host consumer."

[[field]]
path = "$defs/enginePlan/host/[]/name"
kind = "string"
min_length = 1
doc = "Consumer name."

[[field]]
path = "$defs/enginePlan/host/[]/bytes"
kind = "ref"
ref = "uint"
doc = "Bytes the consumer holds."

[[field]]
path = "$defs/enginePlan/host/[]/residence"
kind = "enum"
values = ["pinned", "mlocked", "pageable"]
cpp_type = "Residence"
doc = "`pinned`, `mlocked` or `pageable`."

[[field]]
path = "$defs/enginePlan/host/[]/from"
kind = "string"
min_length = 1
doc = "Where the engine computes it."

[[field]]
path = "$defs/enginePlan/host/[]/remedy"
kind = "string"
doc = "What reduces it, or empty."

[[field]]
path = "$defs/enginePlan/checkpoints"
kind = "object"
cpp = "PlanCheckpoints"
doc = "Prefix checkpoint store."

[[field]]
path = "$defs/enginePlan/checkpoints/slot_bytes"
kind = "ref"
ref = "uint"
doc = "Bytes per checkpoint slot."

[[field]]
path = "$defs/enginePlan/checkpoints/floor_slots"
kind = "ref"
ref = "uint"
doc = "Slots the store must have."

[[field]]
path = "$defs/enginePlan/checkpoints/want_slots"
kind = "ref"
ref = "uint"
doc = "Slots the store would use."

[[field]]
path = "$defs/enginePlan/checkpoints/from"
kind = "string"
min_length = 1
doc = "Where the engine computes it."

[[field]]
path = "$defs/enginePlan/kv_one_session"
kind = "object"
cpp = "PlanKvOneSession"
doc = "KV of one full-length session."

[[field]]
path = "$defs/enginePlan/kv_one_session/bytes"
kind = "ref"
ref = "uint"
doc = "Bytes."

[[field]]
path = "$defs/enginePlan/kv_one_session/from"
kind = "string"
min_length = 1
doc = "Where the engine computes it."

[[field]]
path = "$defs/enginePlan/vram"
kind = "object"
cpp = "PlanVram"
doc = "The engine card's VRAM split (vram_budget_resolve)."

[[field]]
path = "$defs/enginePlan/vram/claimable"
kind = "ref"
ref = "uint"
doc = "VRAM claimable after fixed costs (live)."

[[field]]
path = "$defs/enginePlan/vram/statics"
kind = "ref"
ref = "uint"
doc = "Static weights (stable)."

[[field]]
path = "$defs/enginePlan/vram/elastic"
kind = "ref"
ref = "uint"
doc = "Claimable minus statics (live)."

[[field]]
path = "$defs/enginePlan/vram/experts"
kind = "ref"
ref = "uint"
doc = "Expert residency (live)."

[[field]]
path = "$defs/enginePlan/vram/kv"
kind = "ref"
ref = "uint"
doc = "KV share before MiB rounding (live; never an admission input)."

[[field]]
path = "$defs/enginePlan/vram/stage"
kind = "ref"
ref = "uint"
doc = "Prefill staging region (live)."

[[field]]
path = "$defs/enginePlan/vram/kv_resolved"
kind = "ref"
ref = "uint"
doc = "Common KV budget after the staging split and MiB rounding (live; spec §5.2)."

[[field]]
path = "$defs/enginePlan/vram/expert_floor"
kind = "ref"
ref = "uint"
doc = "Expert residency the host pool cannot hold (stable)."

[[field]]
path = "$defs/enginePlan/vram/kv_ceiling"
kind = "ref"
ref = "uint"
doc = "KV for every session at full length (stable)."

[[field]]
path = "$defs/enginePlan/vram/expert_ceiling"
kind = "ref"
ref = "uint"
doc = "Every expert resident (stable)."

[[field]]
path = "$defs/enginePlan/vram/from"
kind = "string"
min_length = 1
doc = "Where the engine computes it."

[[field]]
path = "$defs/enginePlan/vram/cards"
kind = "array"
item_kind = "object"
min_items = 1
doc = "Per-card facts, in rank order."

[[field]]
path = "$defs/enginePlan/vram/cards/[]"
kind = "object"
cpp = "PlanCard"
doc = "One card."

[[field]]
path = "$defs/enginePlan/vram/cards/[]/capacity"
kind = "ref"
ref = "uint"
doc = "Card VRAM (minimum bound)."

[[field]]
path = "$defs/enginePlan/vram/cards/[]/free"
kind = "ref"
ref = "uint"
doc = "Free VRAM at measurement (live)."

[[field]]
path = "$defs/enginePlan/vram/cards/[]/engine_expert_plane"
kind = "ref"
ref = "uint"
doc = "Engine expert plane bytes (stable)."

[[field]]
path = "$defs/enginePlan/vram/cards/[]/expert_unit_max"
kind = "ref"
ref = "uint"
doc = "Largest expert unit (stable)."

[[field]]
path = "$defs/enginePlan/host_pool_mib"
kind = "ref"
ref = "uint"
doc = "Receipt echo; equals `spec.resources.host.pool_mib`."

# ---- the document ----

[[field]]
path = ""
kind = "object"
cpp = "Manifest"
doc = "A serving manifest v1 document."

[[field]]
path = "/apiVersion"
mismatch = "unsupported_version"
cpp_member = "api_version"
kind = "string"
const = "bigcherry/v1"
doc = "Contract identity; exactly `bigcherry/v1`."

[[field]]
path = "/kind"
mismatch = "unsupported_version"
kind = "string"
const = "ServingManifest"
doc = "Document kind; exactly `ServingManifest`."

[[field]]
path = "/metadata"
kind = "object"
cpp = "Metadata"
doc = "Identity of this resolved serving instance and its producer."

[[field]]
path = "/metadata/instance_id"
kind = "string"
pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
max_length = 36
doc = "Canonical lowercase UUIDv4, created once per resolved serving instance; every process of one launch reads the same ID."

[[field]]
path = "/metadata/producer"
kind = "object"
cpp = "Producer"
doc = "The executable that resolved this manifest."

[[field]]
path = "/metadata/producer/name"
kind = "string"
const = "bc-serve"
doc = "Producer name; exactly `bc-serve`."

[[field]]
path = "/metadata/producer/build_sha256"
kind = "ref"
ref = "hex64"
doc = "SHA-256 of the installed bc-serve executable (64 lowercase hex)."

[[field]]
path = "/metadata/contract_version"
mismatch = "unsupported_version"
kind = "integer"
const = 1
doc = "Contract version; exactly 1, matching the apiVersion suffix."

[[field]]
path = "/metadata/content_digest"
kind = "ref"
ref = "digest"
doc = "`sha256:` + JCS SHA-256 of the manifest with this member removed (spec §8)."

[[field]]
path = "/spec"
kind = "object"
cpp = "Spec"
constraints = '''
[
  {"if": {"properties": {"intent": {"properties": {"service": {"properties": {"profile": {"const": "production"}}, "required": ["profile"]}}, "required": ["service"]}}, "required": ["intent"]}, "then": {"not": {"required": ["experiment"]}}},
  {"if": {"required": ["experiment"]}, "then": {"properties": {"intent": {"properties": {"service": {"properties": {"profile": {"const": "lab"}}}}}}}}
]'''
doc = "The resolved serving configuration. `experiment` is present only when the profile is `lab`."

[[field]]
path = "/spec/intent"
kind = "object"
cpp = "Intent"
doc = "What the operator asked for: model, layout and service policy."

[[field]]
path = "/spec/intent/model"
radiance_option = "--model"
radiance_config = "Config.model"
kind = "string"
min_length = 1
doc = "Model container path the engine loads (`--model`)."

[[field]]
path = "/spec/intent/layout"
kind = "string"
min_length = 1
doc = "Named GPU layout (engines/radiance/layouts.toml)."

[[field]]
path = "/spec/intent/service"
kind = "object"
cpp = "Service"
doc = "Service objective and policy."

[[field]]
path = "/spec/intent/service/profile"
kind = "enum"
values = ["production", "lab"]
cpp_type = "Profile"
doc = "`production`, or `lab`, which alone permits `spec.experiment`."

[[field]]
path = "/spec/intent/service/objective"
kind = "enum"
values = ["latency", "balanced", "throughput"]
cpp_type = "Objective"
doc = "Service objective that selects calibration and derivations."

[[field]]
path = "/spec/intent/service/max_sessions"
radiance_option = "--max-num-seqs"
radiance_config = "Config.max_seqs"
kind = "ref"
ref = "positive"
doc = "Concurrent sessions served (`--max-num-seqs`)."

[[field]]
path = "/spec/intent/service/max_context_tokens"
radiance_option = "--max-model-len"
radiance_config = "Config.max_ctx"
kind = "ref"
ref = "positive"
doc = "Longest session in tokens (`--max-model-len`)."

[[field]]
path = "/spec/intent/service/retention"
kind = "enum"
values = ["keep", "discard"]
cpp_type = "Retention"
doc = "Whether finished sessions' prefix state is kept for reuse."

[[field]]
path = "/spec/intent/service/quality"
kind = "enum"
values = ["baseline", "strict"]
cpp_type = "Quality"
doc = "Numerical quality policy: baseline, or strict reference-equivalent paths."

[[field]]
path = "/spec/facts"
kind = "object"
cpp = "Facts"
doc = "Detected host and GPU facts the resolution used."

[[field]]
path = "/spec/facts/source"
kind = "string"
min_length = 1
doc = "Detector that produced these facts."

[[field]]
path = "/spec/facts/host"
kind = "object"
cpp = "HostFacts"
doc = "Host facts."

[[field]]
path = "/spec/facts/host/memory"
kind = "object"
cpp = "HostMemory"
doc = "Host memory limits."

[[field]]
path = "/spec/facts/host/memory/total_mib"
kind = "ref"
ref = "positive"
doc = "MemTotal, MiB."

[[field]]
path = "/spec/facts/host/memory/available_mib"
kind = "ref"
ref = "uint"
doc = "MemAvailable at resolution, MiB."

[[field]]
path = "/spec/facts/host/memory/swap_total_mib"
kind = "ref"
ref = "uint"
doc = "SwapTotal, MiB."

[[field]]
path = "/spec/facts/host/memory/shm_available_mib"
kind = "ref"
ref = "uint"
doc = "Free space in /dev/shm, MiB."

[[field]]
path = "/spec/facts/host/memory/cgroup_limits"
kind = "array"
item_kind = "object"
min_items = 0
doc = "Memory limits of each enclosing cgroup, innermost first."

[[field]]
path = "/spec/facts/host/memory/cgroup_limits/[]"
kind = "object"
cpp = "CgroupLimit"
doc = "One cgroup's memory limit."

[[field]]
path = "/spec/facts/host/memory/cgroup_limits/[]/path"
kind = "string"
min_length = 1
doc = "cgroup path."

[[field]]
path = "/spec/facts/host/memory/cgroup_limits/[]/room_mib"
kind = "ref"
ref = "uint"
doc = "Room left under that cgroup's limit, MiB."

[[field]]
path = "/spec/facts/host/memory/pin_cap_mib"
kind = "ref"
ref = "uint"
nullable = true
doc = "amdgpu pinned-memory cap, MiB; null when the driver sets none."

[[field]]
path = "/spec/facts/host/memory/memlock_limit_mib"
kind = "ref"
ref = "uint"
nullable = true
doc = "RLIMIT_MEMLOCK, MiB; null when unlimited."

[[field]]
path = "/spec/facts/host/cpu"
kind = "object"
cpp = "HostCpu"
doc = "Host CPU facts."

[[field]]
path = "/spec/facts/host/cpu/count"
kind = "ref"
ref = "positive"
doc = "Online CPUs."

[[field]]
path = "/spec/facts/gpus"
kind = "array"
item_kind = "object"
min_items = 1
max_items = 32
doc = "Detected GPUs, in KFD order."

[[field]]
path = "/spec/facts/gpus/[]"
kind = "object"
cpp = "GpuFact"
doc = "One detected GPU."

[[field]]
path = "/spec/facts/gpus/[]/bdf"
kind = "ref"
ref = "bdf"
doc = "PCI address."

[[field]]
path = "/spec/facts/gpus/[]/arch"
kind = "string"
pattern = "^gfx[0-9a-f]+$"
max_length = 32
doc = "GPU architecture (gfx target)."

[[field]]
path = "/spec/facts/gpus/[]/hip_ordinal"
kind = "ref"
ref = "uint"
doc = "HIP device ordinal (KFD node order)."

[[field]]
path = "/spec/facts/gpus/[]/vram"
kind = "object"
cpp = "GpuVram"
doc = "VRAM facts."

[[field]]
path = "/spec/facts/gpus/[]/vram/total_mib"
kind = "ref"
ref = "positive"
doc = "VRAM size, MiB."

[[field]]
path = "/spec/facts/gpus/[]/vram/available_mib"
kind = "ref"
ref = "uint"
doc = "Unused VRAM at resolution, MiB."

[[field]]
path = "/spec/calibration"
error_class = "calibration_invalid"
kind = "array"
item_kind = "object"
min_items = 1
max_items = 64
doc = "Selected calibrated parameters, each with its evidence."

[[field]]
path = "/spec/calibration/[]"
kind = "object"
cpp = "CalibrationEntry"
doc = "One calibrated parameter."

[[field]]
path = "/spec/calibration/[]/key"
kind = "calibration_key"
doc = "Calibrated parameter; its value's type is fixed per key (contract `calibration_key` table)."

[[field]]
path = "/spec/calibration/[]/value"
kind = "calibration_value"
doc = "The parameter's value: an unsigned integer, a string or a boolean, as its key requires."

[[field]]
