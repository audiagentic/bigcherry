optional = true
kind = "object"
cpp = "ForcedChurn"
doc = "The forced placement schedule (RHP11 validation): one proposal per step, in order, the whole list `repeat` times. Required by mode `forced_churn`, forbidden by `observe`."

[[field]]
path = "/spec/experiment/placement/forced/repeat"
kind = "integer"
minimum = 1
maximum = 1000000
doc = "How many times the step list is issued."

[[field]]
path = "/spec/experiment/placement/forced/pace_requests"
optional = true
kind = "integer"
minimum = 1
maximum = 4294967295
doc = "Pacing: a proposal is issued only once the helpers' completed lane requests (the sum over lanes of `done_sequence`) have advanced by at least this many since the previous proposal was issued; the first waits for this many after the serving gate opens. Spreads the schedule across a run's work. Absent: no pacing, each proposal is issued as soon as the previous transaction finished."

[[field]]
path = "/spec/experiment/placement/forced/steps"
kind = "array"
item_kind = "object"
min_items = 1
max_items = 1024
doc = "Ordered placement steps."

[[field]]
path = "/spec/experiment/placement/forced/steps/[]"
kind = "object"
cpp = "ForcedStep"
doc = "One placement proposal."

[[field]]
path = "/spec/experiment/placement/forced/steps/[]/kind"
kind = "enum"
values = ["move", "swap", "auto_swap"]
cpp_type = "ForcedKind"
doc = "`move` one expert to `destination`; `swap` two named experts; `auto_swap` the first eligible distinct pair, excluding the previous transaction (`a_layer`, `a_expert` carry its x, y)."

[[field]]
path = "/spec/experiment/placement/forced/steps/[]/a_layer"
kind = "ref"
ref = "uint"
doc = "Layer of the first expert (for `auto_swap`, x)."

[[field]]
path = "/spec/experiment/placement/forced/steps/[]/a_expert"
kind = "ref"
ref = "uint"
doc = "First expert (for `auto_swap`, y)."

[[field]]
path = "/spec/experiment/placement/forced/steps/[]/destination"
optional = true
kind = "ref"
ref = "uint"
doc = "Destination helper index of a `move`."

[[field]]
path = "/spec/experiment/placement/forced/steps/[]/b_layer"
optional = true
kind = "ref"
ref = "uint"
doc = "Layer of the second expert of a `swap`."

[[field]]
path = "/spec/experiment/placement/forced/steps/[]/b_expert"
optional = true
kind = "ref"
ref = "uint"
doc = "Second expert of a `swap`."

[[field]]
path = "/spec/experiment/placement/epoch_cycle_s"
optional = true
kind = "ref"
ref = "positive"
doc = "Helper 0 runs a no-op placement epoch cycle (close, drain, recommit the same placement, reopen) every this many seconds of burst (RHP11 validation); absent: off."

[[field]]
path = "/spec/experiment/shape"
optional = true
kind = "object"
cpp = "ExperimentShape"
min_properties = 1
doc = "Lab overlay of helper settings, applied after the per-role patches."

[[field]]
path = "/spec/experiment/shape/helper_common"
optional = true
kind = "ref"
ref = "helperPatch"
doc = "Partial override for every helper."

[[field]]
path = "/spec/experiment/shape/helpers"
optional = true
kind = "array"
item_kind = "object"
min_items = 1
max_items = 4
doc = "Per-role partial overrides."

[[field]]
path = "/spec/experiment/shape/helpers/[]"
kind = "object"
cpp = "ShapePatch"
doc = "One role's lab override."

[[field]]
path = "/spec/experiment/shape/helpers/[]/role"
kind = "string"
pattern = "^helper(?:0|[1-9][0-9]*)$"
max_length = 32
doc = "Role the override applies to."

[[field]]
path = "/spec/experiment/shape/helpers/[]/settings"
kind = "ref"
ref = "helperPatch"
doc = "Partial helper settings for that role."

[[field]]
path = "/spec/experiment/diagnostics"
optional = true
kind = "object"
cpp = "Diagnostics"
min_properties = 1
doc = "Lab diagnostics by concern."

[[field]]
path = "/spec/experiment/diagnostics/gemv"
optional = true
kind = "object"
cpp = "GemvDiagnostics"
min_properties = 1
doc = "GEMV diagnostics."

[[field]]
path = "/spec/experiment/diagnostics/gemv/probe_mode"
optional = true
kind = "int_enum"
values = [0, 1, 2]
doc = "GEMV probe mode (0, 1 or 2)."

[[field]]
path = "/spec/experiment/diagnostics/gemv/refusal_trace"
optional = true
kind = "boolean"
doc = "Trace GEMV path refusals."

[[field]]
path = "/spec/experiment/diagnostics/lanes"
optional = true
kind = "object"
cpp = "LaneDiagnostics"
min_properties = 1
doc = "Lane diagnostics."

[[field]]
path = "/spec/experiment/diagnostics/lanes/capture_file"
optional = true
kind = "string"
min_length = 1
nullable = true
doc = "Lane capture file; null disables capture."

[[field]]
path = "/spec/experiment/diagnostics/lanes/capture_every"
optional = true
kind = "ref"
ref = "positive"
doc = "Capture every Nth request."

[[field]]
path = "/spec/experiment/diagnostics/lanes/capture_max"
optional = true
kind = "ref"
ref = "positive"
doc = "Most requests captured."

[[field]]
path = "/spec/experiment/diagnostics/lanes/trace_level"
optional = true
kind = "ref"
ref = "uint"
doc = "Lane trace verbosity."

[[field]]
path = "/spec/experiment/diagnostics/lanes/test_stop_at"
optional = true
kind = "string"
min_length = 1
nullable = true
doc = "Test hook stop point; null disables it."

[[field]]
path = "/spec/experiment/diagnostics/kernels"
optional = true
kind = "object"
cpp = "KernelDiagnostics"
min_properties = 1
doc = "Kernel diagnostics."

[[field]]
path = "/spec/experiment/diagnostics/kernels/plugin_override"
optional = true
kind = "string"
min_length = 1
nullable = true
doc = "Plugin library to load instead; null keeps the configured one."

[[field]]
path = "/spec/experiment/diagnostics/kernels/poison"
optional = true
kind = "enum"
values = ["off", "zero", "one"]
cpp_type = "Poison"
doc = "Fill pattern for uninitialized outputs."

[[field]]
path = "/spec/experiment/diagnostics/kernels/sweep_fast"
optional = true
kind = "boolean"
doc = "Shorten kernel sweeps."

[[field]]
path = "/spec/experiment/diagnostics/kernels/rows_kernel"
optional = true
kind = "boolean"
doc = "Replaces every helper's architecture rows_kernel capability for this run: false runs the grouped expert GEMM on the large lane also where the architecture takes the rows kernel (RAD49 tail probe); lanes.rows still asks for the rows kernel."


[[field]]
path = "/spec/experiment/engine"
optional = true
kind = "object"
cpp = "ExperimentEngine"
min_properties = 1
doc = "Lab-only engine diagnostics (amendment 11): flags the engine takes that are not serving configuration. Forbidden by the `production` profile with the rest of `spec.experiment`."

[[field]]
path = "/spec/experiment/engine/profile_ops"
optional = true
radiance_option = "--profile-ops"
radiance_config = "Config.profile_ops"
radiance_switch = true
kind = "enum"
values = ["on"]
cpp_type = "ProfileOps"
doc = "Present means per-op device timing (`--profile-ops`)."

[[field]]
path = "/spec/experiment/engine/debug_selection"
optional = true
radiance_option = "--debug-selection"
radiance_config = "Config.debug_selection"
radiance_switch = true
kind = "enum"
values = ["on"]
cpp_type = "DebugSelection"
doc = "Present means the engine prints its selection table (`--debug-selection`)."

[[field]]
path = "/spec/experiment/engine/deterministic"
optional = true
radiance_option = "--deterministic"
radiance_config = "Config.deterministic"
radiance_switch = true
kind = "enum"
values = ["on"]
cpp_type = "Deterministic"
doc = "Present pins placement to the plan the loader made (`--deterministic`)."

[[field]]
path = "/spec/experiment/engine/kv_resident"
optional = true
radiance_option = "--kv-resident"
radiance_config = "Config.kv_resident"
kind = "ref"
ref = "positive"
doc = "Stream the sparse attention group's KV from host memory, resident tokens (`--kv-resident`)."
[[field]]
path = "/spec/experiment/engine/mtp_full_head"
optional = true
kind = "boolean"
env_setting = "RAD_MTP_FULL_HEAD"
doc = "Draft through the trunk head instead of the 2-bit copy (`RAD_MTP_FULL_HEAD`, patch rad0003)."

[[field]]
path = "/spec/experiment/engine/hc_pf2_fp8_down"
optional = true
kind = "boolean"
env_setting = "RAD_HC_PF2_FP8_DOWN"
doc = "FP8 PF2 down-product (`RAD_HC_PF2_FP8_DOWN`, patch rad0007)."

[[field]]
path = "/spec/experiment/engine/routing_evidence"
optional = true
kind = "boolean"
env_setting = "RAD_ROUTING_EVIDENCE"
doc = "Record routing evidence (`RAD_ROUTING_EVIDENCE`, patch rad0010)."

[[field]]
path = "/spec/experiment/engine/freeze_promotion_after"
optional = true
kind = "integer"
minimum = 0
env_setting = "RAD_DIAG_FREEZE_PROMOTION_AFTER"
doc = "Stop heat promotion after this many calls (`RAD_DIAG_FREEZE_PROMOTION_AFTER`, patch rad0006, diagnostic build)."

[[field]]
path = "/spec/experiment/engine/shadow"
optional = true
kind = "boolean"
env_setting = "R3_MOE_WORKER_SHADOW"
doc = "Publish owned routes and compare the helper's rows against the engine's (`R3_MOE_WORKER_SHADOW`, diagnostic build, patches rad0002 and rad0004)."

[[field]]
path = "/spec/experiment/engine/mask_only"
optional = true
kind = "int_enum"
values = [0, 1, 2]
env_setting = "R3_MOE_WORKER_MASK_ONLY"
doc = "Mask and rescatter owned routes: 1 adds the engine's captured rows, 2 adds the helper's (`R3_MOE_WORKER_MASK_ONLY`, diagnostic build, patches rad0002 and rad0004)."

[[field]]
path = "/provenance"
error_class = "provenance_invalid"
kind = "map"
key_ref = "jsonPointer"
required_keys = [""]
min_properties = 1
doc = "Map from a JSON Pointer to the record of where that value (and its descendants) came from; the root \"\" record is required (spec §7)."

[[field]]
path = "/provenance/*"
kind = "object"
cpp = "ProvenanceRecord"
doc = "Provenance of the value at the key's JSON Pointer."

[[field]]
path = "/provenance/*/origin"
kind = "enum"
values = ["schema_default", "site", "profile", "cli", "detected", "derived", "calibrated", "experiment"]
cpp_type = "Origin"
doc = "Input layer that set the value."

[[field]]
path = "/provenance/*/source"
kind = "string"
min_length = 1
doc = "Human-readable source: file and key, detector or derivation."

[[field]]
path = "/provenance/*/class"
cpp_member = "value_class"
kind = "enum"
values = ["policy", "fact", "derived", "tuned", "diagnostic"]
cpp_type = "ValueClass"
doc = "Kind of value: operator policy, detected fact, derived, tuned (calibrated) or diagnostic."

[[field]]
path = "/provenance/*/lifecycle"
kind = "enum"
values = ["startup_only", "step_boundary", "live"]
cpp_type = "Lifecycle"
doc = "When the value may change: only at start-up, at a step boundary, or live."

[[field]]
path = "/provenance/*/confidence"
kind = "enum"
values = ["exact", "measured", "estimate"]
cpp_type = "Confidence"
doc = "Exact, measured or estimated."

[[field]]
path = "/provenance/*/inputs"
kind = "array"
item_kind = "ref"
item_ref = "jsonPointer"
min_items = 0
doc = "JSON Pointers of the values this one was derived from."
