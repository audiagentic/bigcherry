[[field]]
path = "$defs/enginePlan/checkpoints/floor_slots"
kind = "ref"
ref = "uint"
doc = "Slots the store must have."

[[field]]
path = "$defs/enginePlan/checkpoints/want_slots"
kind = "ref"
ref = "uint"
doc = "Slots the store would use."

[[field]]
path = "$defs/enginePlan/checkpoints/from"
kind = "string"
min_length = 1
doc = "Where the engine computes it."

[[field]]
path = "$defs/enginePlan/kv_one_session"
kind = "object"
cpp = "PlanKvOneSession"
doc = "KV of one full-length session."

[[field]]
path = "$defs/enginePlan/kv_one_session/bytes"
kind = "ref"
ref = "uint"
doc = "Bytes."

[[field]]
path = "$defs/enginePlan/kv_one_session/from"
kind = "string"
min_length = 1
doc = "Where the engine computes it."

[[field]]
path = "$defs/enginePlan/vram"
kind = "object"
cpp = "PlanVram"
doc = "The engine card's VRAM split (vram_budget_resolve)."

[[field]]
path = "$defs/enginePlan/vram/claimable"
kind = "ref"
ref = "uint"
doc = "VRAM claimable after fixed costs (live)."

[[field]]
path = "$defs/enginePlan/vram/statics"
kind = "ref"
ref = "uint"
doc = "Static weights (stable)."

[[field]]
path = "$defs/enginePlan/vram/elastic"
kind = "ref"
ref = "uint"
doc = "Claimable minus statics (live)."

[[field]]
path = "$defs/enginePlan/vram/experts"
kind = "ref"
ref = "uint"
doc = "Expert residency (live)."

[[field]]
path = "$defs/enginePlan/vram/kv"
kind = "ref"
ref = "uint"
doc = "KV share before MiB rounding (live; never an admission input)."

[[field]]
path = "$defs/enginePlan/vram/stage"
kind = "ref"
ref = "uint"
doc = "Prefill staging region (live)."

[[field]]
path = "$defs/enginePlan/vram/kv_resolved"
kind = "ref"
ref = "uint"
doc = "Common KV budget after the staging split and MiB rounding (live; spec §5.2)."

[[field]]
path = "$defs/enginePlan/vram/expert_floor"
kind = "ref"
ref = "uint"
doc = "Expert residency the host pool cannot hold (stable)."

[[field]]
path = "$defs/enginePlan/vram/kv_ceiling"
kind = "ref"
ref = "uint"
doc = "KV for every session at full length (stable)."

[[field]]
path = "$defs/enginePlan/vram/expert_ceiling"
kind = "ref"
ref = "uint"
doc = "Every expert resident (stable)."

[[field]]
path = "$defs/enginePlan/vram/from"
kind = "string"
min_length = 1
doc = "Where the engine computes it."

[[field]]
path = "$defs/enginePlan/vram/cards"
kind = "array"
item_kind = "object"
min_items = 1
doc = "Per-card facts, in rank order."

[[field]]
path = "$defs/enginePlan/vram/cards/[]"
kind = "object"
cpp = "PlanCard"
doc = "One card."

[[field]]
path = "$defs/enginePlan/vram/cards/[]/capacity"
kind = "ref"
ref = "uint"
doc = "Card VRAM (minimum bound)."

[[field]]
path = "$defs/enginePlan/vram/cards/[]/free"
kind = "ref"
ref = "uint"
doc = "Free VRAM at measurement (live)."

[[field]]
path = "$defs/enginePlan/vram/cards/[]/engine_expert_plane"
kind = "ref"
ref = "uint"
doc = "Engine expert plane bytes (stable)."

[[field]]
path = "$defs/enginePlan/vram/cards/[]/expert_unit_max"
kind = "ref"
ref = "uint"
doc = "Largest expert unit (stable)."

[[field]]
path = "$defs/enginePlan/host_pool_mib"
kind = "ref"
ref = "uint"
doc = "Receipt echo; equals `spec.resources.host.pool_mib`."

# ---- the document ----

[[field]]
path = ""
kind = "object"
cpp = "Manifest"
doc = "A serving manifest v1 document."

[[field]]
path = "/apiVersion"
mismatch = "unsupported_version"
cpp_member = "api_version"
kind = "string"
const = "bigcherry/v1"
doc = "Contract identity; exactly `bigcherry/v1`."

[[field]]
path = "/kind"
mismatch = "unsupported_version"
kind = "string"
const = "ServingManifest"
doc = "Document kind; exactly `ServingManifest`."

[[field]]
path = "/metadata"
kind = "object"
cpp = "Metadata"
doc = "Identity of this resolved serving instance and its producer."

[[field]]
path = "/metadata/instance_id"
kind = "string"
pattern = "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
max_length = 36
doc = "Canonical lowercase UUIDv4, created once per resolved serving instance; every process of one launch reads the same ID."

[[field]]
path = "/metadata/producer"
kind = "object"
cpp = "Producer"
doc = "The executable that resolved this manifest."

[[field]]
path = "/metadata/producer/name"
kind = "string"
const = "bc-serve"
doc = "Producer name; exactly `bc-serve`."

[[field]]
path = "/metadata/producer/build_sha256"
kind = "ref"
ref = "hex64"
doc = "SHA-256 of the installed bc-serve executable (64 lowercase hex)."

[[field]]
path = "/metadata/contract_version"
mismatch = "unsupported_version"
kind = "integer"
const = 1
doc = "Contract version; exactly 1, matching the apiVersion suffix."

[[field]]
path = "/metadata/content_digest"
kind = "ref"
ref = "digest"
doc = "`sha256:` + JCS SHA-256 of the manifest with this member removed (spec §8)."

[[field]]
path = "/spec"
kind = "object"
cpp = "Spec"
constraints = '''
[
  {"if": {"properties": {"intent": {"properties": {"service": {"properties": {"profile": {"const": "production"}}, "required": ["profile"]}}, "required": ["service"]}}, "required": ["intent"]}, "then": {"not": {"required": ["experiment"]}}},
  {"if": {"required": ["experiment"]}, "then": {"properties": {"intent": {"properties": {"service": {"properties": {"profile": {"const": "lab"}}}}}}}}
]'''
doc = "The resolved serving configuration. `experiment` is present only when the profile is `lab`."

[[field]]
path = "/spec/intent"
kind = "object"
cpp = "Intent"
doc = "What the operator asked for: model, layout and service policy."

[[field]]
path = "/spec/intent/model"
radiance_option = "--model"
radiance_config = "Config.model"
kind = "string"
min_length = 1
doc = "Model container path the engine loads (`--model`)."

[[field]]
path = "/spec/intent/layout"
kind = "string"
min_length = 1
doc = "Named GPU layout (engines/radiance/layouts.toml)."

[[field]]
path = "/spec/intent/service"
kind = "object"
cpp = "Service"
doc = "Service objective and policy."

[[field]]
path = "/spec/intent/service/profile"
kind = "enum"
values = ["production", "lab"]
cpp_type = "Profile"
doc = "`production`, or `lab`, which alone permits `spec.experiment`."

[[field]]
path = "/spec/intent/service/objective"
kind = "enum"
values = ["latency", "balanced", "throughput"]
cpp_type = "Objective"
doc = "Service objective that selects calibration and derivations."

[[field]]
path = "/spec/intent/service/max_sessions"
radiance_option = "--max-num-seqs"
radiance_config = "Config.max_seqs"
kind = "ref"
ref = "positive"
default = 256
default_source = "radiance:Config.max_seqs"
doc = "Concurrent sessions served (`--max-num-seqs`)."

[[field]]
path = "/spec/intent/service/max_context_tokens"
radiance_option = "--max-model-len"
radiance_config = "Config.max_ctx"
kind = "ref"
ref = "positive"
doc = "Longest session in tokens (`--max-model-len`)."

[[field]]
path = "/spec/intent/service/retention"
kind = "enum"
values = ["keep", "discard"]
cpp_type = "Retention"
doc = "Whether finished sessions' prefix state is kept for reuse."

[[field]]
path = "/spec/intent/service/quality"
kind = "enum"
values = ["baseline", "strict"]
cpp_type = "Quality"
doc = "Numerical quality policy: baseline, or strict reference-equivalent paths."

[[field]]
path = "/spec/facts"
kind = "object"
cpp = "Facts"
doc = "Detected host and GPU facts the resolution used."

[[field]]
path = "/spec/facts/source"
kind = "string"
min_length = 1
doc = "Detector that produced these facts."

[[field]]
path = "/spec/facts/host"
kind = "object"
cpp = "HostFacts"
doc = "Host facts."

[[field]]
path = "/spec/facts/host/memory"
kind = "object"
cpp = "HostMemory"
doc = "Host memory limits."

[[field]]
path = "/spec/facts/host/memory/total_mib"
kind = "ref"
ref = "positive"
doc = "MemTotal, MiB."

[[field]]
path = "/spec/facts/host/memory/available_mib"
kind = "ref"
ref = "uint"
doc = "MemAvailable at resolution, MiB."

[[field]]
path = "/spec/facts/host/memory/swap_total_mib"
kind = "ref"
ref = "uint"
doc = "SwapTotal, MiB."

[[field]]
path = "/spec/facts/host/memory/shm_available_mib"
kind = "ref"
ref = "uint"
doc = "Free space in /dev/shm, MiB."

[[field]]
path = "/spec/facts/host/memory/cgroup_limits"
kind = "array"
item_kind = "object"
min_items = 0
doc = "Memory limits of each enclosing cgroup, innermost first."

[[field]]
path = "/spec/facts/host/memory/cgroup_limits/[]"
kind = "object"
cpp = "CgroupLimit"
doc = "One cgroup's memory limit."

[[field]]
path = "/spec/facts/host/memory/cgroup_limits/[]/path"
kind = "string"
min_length = 1
doc = "cgroup path."

[[field]]
path = "/spec/facts/host/memory/cgroup_limits/[]/room_mib"
kind = "ref"
ref = "uint"
doc = "Room left under that cgroup's limit, MiB."

[[field]]
path = "/spec/facts/host/memory/pin_cap_mib"
kind = "ref"
ref = "uint"
nullable = true
doc = "amdgpu pinned-memory cap, MiB; null when the driver sets none."

[[field]]
path = "/spec/facts/host/memory/memlock_limit_mib"
kind = "ref"
ref = "uint"
nullable = true
doc = "RLIMIT_MEMLOCK, MiB; null when unlimited."

[[field]]
path = "/spec/facts/host/cpu"
kind = "object"
cpp = "HostCpu"
doc = "Host CPU facts."

[[field]]
path = "/spec/facts/host/cpu/count"
kind = "ref"
ref = "positive"
doc = "Online CPUs."

[[field]]
path = "/spec/facts/gpus"
kind = "array"
item_kind = "object"
min_items = 1
max_items = 32
doc = "Detected GPUs, in KFD order."

[[field]]
path = "/spec/facts/gpus/[]"
kind = "object"
cpp = "GpuFact"
doc = "One detected GPU."

[[field]]
path = "/spec/facts/gpus/[]/bdf"
kind = "ref"
ref = "bdf"
doc = "PCI address."

