doc = "Where the engine computes it."

[[field]]
path = "$defs/enginePlan/host/[]/remedy"
kind = "string"
doc = "What reduces it, or empty."

[[field]]
path = "$defs/enginePlan/checkpoints"
kind = "object"
cpp = "PlanCheckpoints"
doc = "Prefix checkpoint store."

[[field]]
path = "$defs/enginePlan/checkpoints/slot_bytes"
kind = "ref"
