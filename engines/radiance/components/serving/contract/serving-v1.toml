kind = "integer"
const = 1
doc = "Plan format; exactly 1."

[[field]]
path = "$defs/enginePlan/producer"
kind = "string"
const = "radiance --plan-memory (rad0011)"
doc = "Plan producer; exactly `radiance --plan-memory (rad0011)`."

[[field]]
path = "$defs/enginePlan/host"
kind = "array"
item_kind = "object"
min_items = 0
doc = "Pinned host consumers."

[[field]]
path = "$defs/enginePlan/host/[]"
kind = "object"
cpp = "PlanHostConsumer"
doc = "One host consumer."

[[field]]
path = "$defs/enginePlan/host/[]/name"
