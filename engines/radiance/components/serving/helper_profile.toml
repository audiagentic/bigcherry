# The helper_common values bc-serve writes into a v1 manifest (spec.processes.helper_common), one row per leaf: the
# R3_* setting the helper reads today, the value it runs with, and why that is the value (RSC08 S2a).
#
# This table is interim. Until S4 the helpers still read their R3_* environment, so the manifest's helper section
# describes what the launcher runs; at S4 the helpers read the manifest and this table is the one source the writer keeps
# (the launcher's exports go, nothing runs beside them). tools/tests/lab/test_helper_profile_parity.py diffs it both ways
# against the component settings, the launcher's exports and `bigcherry layout env`, and fails on any key missing on
# either side or any value that differs.
#
# from: an optional resolver key (`group.name`); the writer takes the resolved value for the leaf from it, so a layout, site
# file or --set is never overridden by this table. `value` is then the schema default, checked against the setting.
#
# basis:
#   component_default  the value is the setting's `default` in its component.toml (checked equal)
#   unset_means        the setting's component default is empty: unset is the helper's built-in off/empty/zero, which is
#                      the value written here (documented per row; the helper code is the authority)
#   layout             the value comes from the layout: `bigcherry layout env` exports the setting (checked equal)
#   resolved           the value is the resolver's (a layout, a site file or --set decides it): `value` is only the schema
#                      default, the writer takes the resolved value named by `from`; checked for every layout
#   launcher_literal   a hand-picked value the launcher sets itself; a tunable to derive or calibrate, not a final default
#                      (none in helper_common today; the five handoff literals are in the handoff section)

