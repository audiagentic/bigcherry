# libr3: BigCherry's gfx1100 (RX 7900 XTX) kernel plugin for radiance (RAD01 PR 5;
# docs/archive/radiance/PLATFORM_DESIGN.md decision 2). Built against the pinned radiance's libr4d sources
# (rewrites.txt + native/*.rw applied to a build-tree copy, never to vendor/radiance) and loaded through
# RADIANCE_HOME; it is BigCherry source, not a patch to the engine.
schema = 1
name = "libr3"
engine = "radiance"
targets = ["gfx1100"]
# radiance v1.14.0: rewrite rules target the pinned libr4d source and reject unmatched revisions.
built-against = "v1.17.0"
outputs = ["kernels/libr3.so"]

# How the build lane builds it: CMake against the engine installed from the lane's own build (CMAKE_PREFIX_PATH) and
# the lane's materialised source ({engine_source}); outputs are copied into the engine's runtime home.
# R3_NATIVE is ON: native/*.rw (against the pinned radiance source) replace the kernels' own lines with native gfx11 forms.
# A block that no longer matches libr4d fails configure by design; R3_NATIVE=OFF builds every kernel through r3_compat.h only.
[build]
configure = { RADIANCE_SRC = "{engine_source}", R3_TARGETS = "{targets}", R3_NATIVE = "ON" }

# Only variables still read directly by the component are catalogued below.
# Serving kernel switches (attention, MoE f16/ahalf, GEMV and DEC11) are typed
# spec.processes.engine.kernels / helper settings, never environment carriers.
#   status = production    on (or meaningful) in served configurations, with quality and speed evidence
#   status = experimental  measured, not adopted; may appear only in an experiment
#   status = evaluated     shelved with evidence (kept, default off); never in a profile
#   status = diagnostic    instrumentation or comparison; never in a production profile
#   status = tuning        a kernel geometry knob for the lab's sweeps
# Evidence: docs/archive/radiance/LAB_HISTORY.md (dated lab record), sections per setting.

[setting.R3_GDN_NATIVE]
default = "0"
status = "evaluated"
summary = "native delta-net chunk scan; wrong in serving (KLD 5.52) after three fixes, shelved; source kept in native-shelved/ and not built"

[setting.R3_AR_WIRE4]
default = "0"
status = "experimental"
summary = "4-bit cross-card wire at M >= 512; +5.6% 27B prefill at KLD 0.0044 -> 0.0126 (owner's call). Off by default pending current-pin qualification of the fused kernel"
activation = "R3_AR_WIRE4 active"
manifest = "/spec/processes/engine/kernels/all_reduce_wire4"

[setting.R3_AR_PIPE]
default = "0"
status = "evaluated"
summary = "sliced all-reduce in one kernel; byte-identical but 6% slower, shelved (its native form is kept in native-shelved/)"

[setting.R3_GDN_COMPARE]
default = "0"
status = "diagnostic"
summary = "run compatibility and native delta-net scan side by side and report the first mismatch"

[setting.R3_BT_ORACLE]
default = "0"
status = "diagnostic"
summary = "RR08 selftest oracle (R3_BT)"

[setting.R3_MOE_NATIVE]
default = "1"
status = "experimental"
summary = "native w4nl64 MoE inner loop; -6% call time, Flash-Next quality neutral (KLD unchanged). On by default in the r3_moe_worker processes (main() sets 1 unless the variable is set, 2bf231e3: prefill 2,518 -> 2,665 tok/s, decode 91.4/95.6 -> 108.2/108.8); the engine process (a gfx1100 TP rank) takes the same default when it is unset, and 0 turns it off everywhere"

[setting.R3_MOE_COMPARE]
default = "0"
status = "diagnostic"
summary = "selftest: compare compatibility and native MoE forms"

[test]
targets = ["r3_rewrite_check", "r3_helper_config_exports", "r3_moe_settings_test"]
