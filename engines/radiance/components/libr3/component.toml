# libr3: BigCherry's gfx1100 (RX 7900 XTX) kernel plugin for radiance (RAD01 PR 5;
# docs/reference/engines/radiance/PLATFORM_DESIGN.md decision 2). Built against the pinned radiance's libr4d sources
# (rewrites.txt + native/*.rw applied to a build-tree copy, never to vendor/radiance) and loaded through
# RADIANCE_HOME; it is BigCherry source, not a patch to the engine.
schema = 1
name = "libr3"
engine = "radiance"
targets = ["gfx1100"]
# radiance 1.7.0 (plugin ABI 17): the rewrite rules are written against this revision's libr4d and refuse any other.
built-against = "v1.7.0"
outputs = ["kernels/libr3.so", "kernels/libr3moe.so", "helpers/libr3_ngram_helper.so", "helpers/r3_moe_helper"]

# How the build lane builds it: CMake against the engine installed from the lane's own build (CMAKE_PREFIX_PATH) and
# the lane's materialised source ({engine_source}); outputs are copied into the engine's runtime home.
# R3_NATIVE is ON: native/*.rw (re-ported to radiance 1.7.0, MEN12) replace the kernels' own lines with native gfx11 forms.
# A block that no longer matches libr4d fails configure by design; R3_NATIVE=OFF builds every kernel through r3_compat.h only.
[build]
configure = { RADIANCE_SRC = "{engine_source}", R3_TARGETS = "{targets}", R3_NATIVE = "ON" }

# Offline tests the bump gate (bigcherry pin-bump) builds and runs with ctest in the component's build tree.
[test]
targets = ["r3_moe_shm_test"]

# Runtime settings: each environment variable the plugin reads, its default, and what it is.
#   status = production    on (or meaningful) in served configurations, with quality and speed evidence
#   status = experimental  measured, not adopted; may appear only in an experiment
#   status = evaluated     shelved with evidence (kept, default off); never in a profile
#   status = diagnostic    instrumentation or comparison; never in a production profile
#   status = tuning        a kernel geometry knob for the lab's sweeps
# Evidence: engines/radiance/README.md (the measurement log, moved from the feature branch), sections per entry.

[setting.R3_ATTN_NATIVE]
default = "1"
status = "production"
summary = "native gfx11 prefill attention; KLD 0.0035 / 96.8% top-1 vs the compatibility form's 0.0037, +5% prefill"

[setting.R3_GDN_NATIVE]
default = "0"
status = "evaluated"
summary = "native delta-net chunk scan; wrong in serving (KLD 5.52) after three fixes, shelved; source kept in native-shelved/ and not built"

[setting.R3_MOE_HELPER]
default = ""
status = "experimental"
summary = "enable patch rad0002 GPU mailbox ops; helper process must already own the configured POSIX shm segment"
activation = "r3_moe_helper: runtime map owns [0-9]+ experts, [0-9.]+ GiB"

[setting.R3_MOE_HELPER_DEVICES]
default = ""
status = "experimental"
summary = "harness-only: space-separated HIP device indices, one r3_moe_helper process each (e.g. \"0 1\"); the campaign adapter starts them before the server, sets R3_MOE_HELPER_INDEX and R3_MOE_HELPER_COUNT per helper, and stops them after it"

[setting.R3_MOE_HELPER_SHM]
default = "/r3-moe-helper"
status = "diagnostic"
summary = "POSIX shm segment mapped by libr3 GPU mailbox ops and r3_moe_helper"

[setting.R3_MOE_HELPER_CPU]
default = "0"
status = "diagnostic"
summary = "force the slice-2a fp32 host reference path instead of gfx1201 compute"

[setting.R3_MOE_HELPER_MIB]
default = "28672"
status = "experimental"
summary = "VRAM budget in MiB for cold full-expert units owned by the gfx1201 helper"

[setting.R3_MOE_HELPER_MAX_ROWS]
default = "64"
status = "experimental"
summary = "largest step (rows) handed to the helper (engine and helper both read it); larger steps keep the engine path. Steps above R3_MOE_HELPER_SMALL_ROWS take the large lane, launched sized to the request"

[setting.R3_MOE_HELPER_ENGINE_RANKS]
default = "2"
status = "experimental"
summary = "engine TP ranks the helper serves: 2 = two XTX ranks, each asking for its TP slice; 1 = one engine (the R9700, RAD02) asking for full expert width (the helper runs both slices and sums them)"

[setting.R3_MOE_HELPER_COUNT]
default = "1"
status = "experimental"
summary = "helpers sharing the segment: 2 = two XTX helpers behind a one-rank (R9700) engine, each owning half the candidates and serving its own rank slot"

[setting.R3_MOE_HELPER_HISTOGRAM]
default = ""
status = "diagnostic"
summary = "path prefix: the engine counts every routed (layer, expert) in VRAM and writes uint32[128][512] to <path>.rank<r> at shutdown"

[setting.R3_MOE_HELPER_HEAT]
default = ""
status = "experimental"
summary = "a R3_MOE_HELPER_HISTOGRAM file: the helper owns the coldest experts first, so the engine keeps the hot ones and decode hands off less"

[setting.R3_MOE_HELPER_GEMV]
default = "1"
status = "experimental"
summary = "decode MoE GEMV for the helper's small lane (RAD05): no WMMA, dot products straight off the packed w4nl64 nibbles. R9700 engine + two XTX helpers, Flash-Next: decode 69.6/69.7 -> 95.7/95.5 tok/s, prefill unchanged, KLD 0.0605 (noise floor 0.058-0.062). 0 turns it off; 2 compares it with the grouped GEMM (--compare)"

[setting.R3_MOE_HELPER_MOE_FORM]
default = "0"
status = "experimental"
summary = "pin the helper's grouped MoE GEMM form (RAD06): 0 libr4d's choice by row count, 1 the 32-row prefill form, 2 the 16-row decode form (a helper's prefill rows are ~4.5 an owned expert)"
activation = "r3_moe_helper: grouped MoE GEMM pinned to the"

[setting.R3_MOE_HELPER_MOE_DOWN_TILE]
default = ""
status = "experimental"
summary = "pin libr4d's down-projection tile in the helper (RAD06 gfx1100 sweep): 1 the 64/128-column tile, 2 the 256-column 16-wave tile; unset leaves libr4d's choice"
activation = "r3_moe_helper: R3_MOE_HELPER_MOE_DOWN_TILE="

[setting.R3_MOE_HELPER_MOE_LONG_ROWS]
default = ""
status = "experimental"
summary = "RAD06: runs of this many rows or more take 64-row slices and an MT=4 tile in the helper's grouped MoE GEMM (fewer weight-tile restages for long runs; bit-identical); unset or 0 keeps the single 32-row map"
activation = "r3_moe_helper: R3_MOE_HELPER_MOE_LONG_ROWS="

[setting.R3_MOE_FP16]
default = "1"
status = "experimental"
summary = "RAD06: with R3_MOE_NATIVE, the grouped MoE GEMM widens E4M3 operands to f16 and uses the f16 WMMA (a cheaper widening than bf16; the sums carry a 2^-16 scale removed before the scale fold, so output is bit-identical to the bf16 form). On by default in the r3_moe_helper processes (main() sets 1 unless the variable is set); prefill 2,130 -> 3,150 tok/s, decode unchanged, KLD unchanged; the engine process reads an unset variable as off, and 0 turns it off everywhere"
activation = "R3_MOE_FP16"

[setting.R3_MOE_AHALF]
default = "1"
status = "experimental"
summary = "RAD06: with R3_MOE_FP16, widen the grouped MoE GEMM's activation tile to half once at staging instead of in every wave that reads it (four wave columns share each A fragment); bit-identical, 7-8% off the grouped GEMM on four real captured requests, about 4 KB more LDS. On by default in the r3_moe_helper processes (main() sets 1 unless set); 0 turns it off"
activation = "R3_MOE_AHALF"

[setting.R3_MOE_HELPER_VECIO]
default = "1"
status = "experimental"
summary = "RAD06: the helper's activation copy (engine's mapped host memory into the lane) and result write (lane to mapped host memory) use 16-byte accesses instead of one byte and two bytes a thread; bit-identical, read per request; 0 keeps the scalar kernels"
activation = "R3_MOE_HELPER_VECIO"

[setting.R3_MOE_HELPER_BALANCE]
default = ""
status = "experimental"
summary = "RAD06/RHP: with R3_MOE_HELPER_HEAT and two helpers, split the jointly owned experts between the helpers per layer by predicted cost (a layer waits for the slower helper) instead of alternating down the global heat ranking; the owned set is unchanged, only who owns which; deterministic so both helper processes compute the same map; offline prediction 3.5-5.6% of helper time (tools/lab/radiance/heat-placement/balance_score.py)"
activation = "R3_MOE_HELPER_BALANCE: per-layer cost split"

[setting.R3_MOE_HELPER_BALANCE_SPEED]
default = ""
status = "experimental"
summary = "RAD06/RHP: with R3_MOE_HELPER_BALANCE, relative speeds of the two helpers as 's0,s1' (default 1,1); a helper's expert cost is divided by its speed, so a slower card takes less (helper 1 measured ~8-10% slower)"

[setting.R3_MOE_HELPER_TRACE]
default = ""
status = "diagnostic"
summary = "RAD06: every Nth finished request a helper lane prints its critical-path stamps as a TRACE line on stderr: the engine's local work between publish and wait (local_us), the engine's wait for this helper (wait_us) and the helper GPU's own request time (helper_gpu_us), each within one device's wall clock; the stamps are nine stores to the mapped request slot (five at publish, two in the engine's wait, two on the helper) and are always written, so this only enables the printing (compare an arm with R3_MOE_HELPER_TRACE=0 against the build without stamps for their cost); read with tools/lab/radiance/heat-placement/trace_report.py"
activation = "TRACE,lane"

[setting.R3_MOE_PROBE]
default = ""
status = "diagnostic"
summary = "RAD06 timing-only ablation of the f16 MoE GEMM (needs R3_MOE_FP16=1; OUTPUT IS INVALID): 1 no WMMA, 2 no E4M3 widening; never set in production"
activation = "R3_MOE_PROBE"

[setting.R3_MOE_HELPER_CAPTURE]
default = ""
status = "diagnostic"
summary = "directory: the helper writes real large-lane requests (layer slot map, routes, bf16 activations) there for `r3_moe_helper --replay MODEL FILE` (RAD06 kernel tuning on real request shapes)"

[setting.R3_MOE_HELPER_CAPTURE_EVERY]
default = "37"
status = "diagnostic"
summary = "with R3_MOE_HELPER_CAPTURE: capture every Nth large-lane request"

[setting.R3_MOE_HELPER_CAPTURE_MAX]
default = "16"
status = "diagnostic"
summary = "with R3_MOE_HELPER_CAPTURE: at most this many request files"

[setting.R3_MOE_HELPER_GEMV_LARGE_ROWS]
default = "0"
status = "experimental"
summary = "large-lane requests of at most this many rows take the decode GEMV (RAD06): replayed real requests show 9-row steps at ~0.5 ms a grouped-GEMM call for 25-51 routes; the large lane is sized per request, so the small lane is untouched"
activation = "r3_moe_helper: large-lane requests up to"

[setting.R3_MOE_HELPER_ROWS]
default = "0"
status = "experimental"
summary = "few-rows-a-expert MoE kernel for the helper's large (prefill) lane (RAD06): one block an (expert, 32 outputs), each decoded weight applied to up to 16 of the expert's rows. Shelved: correct but slower - 38% prefill (lab, 2026-10-15); harness A/B 2026-10-17: -76% pp4096, -40% tg512"
activation = "r3_moe_helper: few-rows prefill kernel on the large lane"

[setting.R3_MOE_HELPER_INDEX]
default = "0"
status = "experimental"
summary = "this helper's index under R3_MOE_HELPER_COUNT: 0 creates the segment, 1 attaches to it"

[setting.R3_MOE_HELPER_SMALL_ROWS]
default = "64"
status = "experimental"
summary = "helper small-lane size: steps up to this many rows run on GPU work the helper pre-queues at this fixed size (no host in the loop)"

[setting.R3_MOE_HELPER_POISON]
default = "0"
status = "diagnostic"
summary = "1 (any non-zero): every helper result value becomes 1e3 (proves the mailbox merge consumes helper rows); zero: results become 0 (same output as dropping remote routes)"
activation = "R3_MOE_HELPER poison"

[setting.R3_MOE_HELPER_SHADOW]
default = "0"
status = "diagnostic"
summary = "diagnostic build only (patch rad0004, BC_MOE_REMOTE_DIAG): publish owned routes without masking them and compare helper unweighted down rows against the engine rows; a production engine ignores it and computes locally"
activation = "R3_MOE_HELPER_SHADOW layer="

[setting.R3_MOE_HELPER_MASK_ONLY]
default = "0"
status = "diagnostic"
summary = "diagnostic build only (patch rad0004, BC_MOE_REMOTE_DIAG): 1: mask and rescatter after the local GEMMs, merge engine-captured rows; 2: same late publish, merge the helper's per-token rows; a production engine ignores it and computes locally"
activation = "R3_MOE_HELPER_MASK_ONLY enabled"

[setting.R3_MOE_HELPER_PLUGIN]
default = ""
status = "diagnostic"
summary = "override the kernel plugin the helper loads through the rad_plugin ABI (default: libr4d.so on gfx1201, libr3.so on gfx1100)"

[setting.R3_MOE_NATIVE]
default = "1"
status = "experimental"
summary = "native w4nl64 MoE inner loop; -6% call time, Flash-Next quality neutral (KLD unchanged). On by default in the r3_moe_helper processes (main() sets 1 unless the variable is set, 2bf231e3: prefill 2,518 -> 2,665 tok/s, decode 91.4/95.6 -> 108.2/108.8); the engine process reads an unset variable as off, so an arm or profile that wants the engine's own MoE GEMM native sets it explicitly, and 0 turns it off everywhere"

[setting.R3_HC_NATIVE]
default = "0"
status = "experimental"
summary = "native E4M3 decode for hc_read; 58 -> 51 us a call"

[setting.R3_AR_WIRE4]
default = "0"
status = "experimental"
summary = "4-bit cross-card wire at M >= 512; +5.6% 27B prefill at KLD 0.0044 -> 0.0126 (owner's call)"
activation = "R3_AR_WIRE4 active"

[setting.R3_AR_PIPE]
default = "0"
status = "evaluated"
summary = "sliced all-reduce in one kernel; byte-identical but 6% slower, shelved"

[setting.R3_AR_TIMING]
default = "0"
status = "diagnostic"
summary = "wall-clock all-reduce timing between stream synchronisations"
activation = "^R3_AR_TIMING "

[setting.R3_NGRAM_DEV]
default = ""
status = "evaluated"
summary = "n-gram rows gathered on a non-rank card; exact, but the R9700 belongs to compute (owner, 2026-10-13)"
activation = "libr3: R3_NGRAM_DEV rows="

[setting.R3_NGRAM_HELPER_SO]
default = ""
status = "evaluated"
summary = "path of the n-gram helper library (R3_NGRAM_DEV)"

[setting.R3_NGRAM_AVX]
default = ""
status = "evaluated"
summary = "path of libavx for the n-gram host-copy gather (R3_NGRAM_DEV)"

[setting.R3_NGRAM_RAM]
default = "1"
status = "evaluated"
summary = "rows the n-gram device does not hold go to a host copy (R3_NGRAM_DEV)"

[setting.R3_NGRAM_MIB]
default = ""
status = "evaluated"
summary = "cap on the device share of the n-gram table (R3_NGRAM_DEV)"

[setting.R3_NGRAM_RESERVE_MIB]
default = "2048"
status = "evaluated"
summary = "device memory the n-gram helper leaves free (R3_NGRAM_DEV)"

[setting.R3_NGRAM_MAX_M]
default = "32768"
status = "evaluated"
summary = "largest n-gram gather the helper sizes for (R3_NGRAM_DEV)"

[setting.R3_GDN_COMPARE]
default = "0"
status = "diagnostic"
summary = "run compatibility and native delta-net scan side by side and report the first mismatch"

[setting.R3_HC_COMPARE]
default = "0"
status = "diagnostic"
summary = "selftest: compare compatibility and native hc_read byte for byte"

[setting.R3_MOE_COMPARE]
default = "0"
status = "diagnostic"
summary = "selftest: compare compatibility and native MoE forms"

[setting.R3_BT]
default = "0"
status = "evaluated"
summary = "RR08 bf16-tile MXFP4 GEMM forms 1 and 2; slower at M=512, shelved"

[setting.R3_BT_B]
