# libr3: BigCherry's gfx1100 (RX 7900 XTX) kernel plugin for radiance (RAD01 PR 5;
# docs/reference/engines/radiance/PLATFORM_DESIGN.md decision 2). Built against the pinned radiance's libr4d sources
# (rewrites.txt + native/*.rw applied to a build-tree copy, never to vendor/radiance) and loaded through
# RADIANCE_HOME; it is BigCherry source, not a patch to the engine.
schema = 1
name = "libr3"
engine = "radiance"
targets = ["gfx1100"]
# radiance 1.13.0 (plugin ABI 31): the rewrite rules are written against this revision's libr4d and refuse any other.
built-against = "v1.14.0"
outputs = ["kernels/libr3.so"]

# How the build lane builds it: CMake against the engine installed from the lane's own build (CMAKE_PREFIX_PATH) and
# the lane's materialised source ({engine_source}); outputs are copied into the engine's runtime home.
# R3_NATIVE is ON: native/*.rw (re-ported to radiance 1.7.0, MEN12) replace the kernels' own lines with native gfx11 forms.
# A block that no longer matches libr4d fails configure by design; R3_NATIVE=OFF builds every kernel through r3_compat.h only.
[build]
configure = { RADIANCE_SRC = "{engine_source}", R3_TARGETS = "{targets}", R3_NATIVE = "ON" }

# Runtime settings: each environment variable the plugin reads, its default, and what it is.
#   status = production    on (or meaningful) in served configurations, with quality and speed evidence
#   status = experimental  measured, not adopted; may appear only in an experiment
#   status = evaluated     shelved with evidence (kept, default off); never in a profile
#   status = diagnostic    instrumentation or comparison; never in a production profile
#   status = tuning        a kernel geometry knob for the lab's sweeps
# Evidence: engines/radiance/README.md (the measurement log, moved from the feature branch), sections per entry.

[setting.R3_ATTN_NATIVE]
default = "1"
status = "production"
summary = "native gfx11 prefill attention; KLD 0.0035 / 96.8% top-1 vs the compatibility form's 0.0037, +5% prefill"

[setting.R3_GDN_NATIVE]
default = "0"
status = "evaluated"
summary = "native delta-net chunk scan; wrong in serving (KLD 5.52) after three fixes, shelved; source kept in native-shelved/ and not built"

[setting.R3_AR_WIRE4]
default = "0"
status = "experimental"
summary = "4-bit cross-card wire at M >= 512; +5.6% 27B prefill at KLD 0.0044 -> 0.0126 (owner's call). Off on radiance 1.13.0 until the fused kernel's native form is re-ported (RAD32)"
activation = "R3_AR_WIRE4 active"

[setting.R3_AR_PIPE]
default = "0"
status = "evaluated"
summary = "sliced all-reduce in one kernel; byte-identical but 6% slower, shelved (its native form is under native-shelved/ for 1.13.0)"

[setting.R3_AR_TIMING]
default = "0"
status = "diagnostic"
summary = "wall-clock all-reduce timing between stream synchronisations"
activation = "^R3_AR_TIMING "

[setting.R3_GDN_COMPARE]
default = "0"
status = "diagnostic"
summary = "run compatibility and native delta-net scan side by side and report the first mismatch"

[setting.R3_BT]
default = "0"
status = "evaluated"
summary = "RR08 bf16-tile MXFP4 GEMM forms 1 and 2; slower at M=512, shelved"

[setting.R3_BT_B]
default = ""
status = "tuning"
summary = "RR08 tile geometry (R3_BT)"

[setting.R3_BT_NT]
default = ""
status = "tuning"
summary = "RR08 tile geometry (R3_BT)"

[setting.R3_BT_ABL]
default = "0"
status = "diagnostic"
summary = "RR08 ablation masks (R3_BT)"

[setting.R3_BT_ORACLE]
default = "0"
status = "diagnostic"
summary = "RR08 selftest oracle (R3_BT)"

[setting.R3_DEC11]
default = "0"
status = "experimental"
summary = "gfx11 MXFP4 decode GEMV form"

[setting.R3_D11_MODE]
default = ""
status = "tuning"
summary = "decode GEMV variant (R3_DEC11)"

[setting.R3_GEMV]
default = ""
status = "tuning"
summary = "decode GEMV selection"

[setting.R3_MXD_BK]
default = ""
status = "tuning"
summary = "MXFP4 decode geometry"

[setting.R3_MXD_KS]
default = ""
status = "tuning"
summary = "MXFP4 decode geometry"

[setting.R3_MXD_NT]
default = ""
status = "tuning"
summary = "MXFP4 decode geometry"

[setting.R3_MOE_NATIVE]
default = "1"
status = "experimental"
summary = "native w4nl64 MoE inner loop; -6% call time, Flash-Next quality neutral (KLD unchanged). On by default in the r3_moe_worker processes (main() sets 1 unless the variable is set, 2bf231e3: prefill 2,518 -> 2,665 tok/s, decode 91.4/95.6 -> 108.2/108.8); the engine process reads an unset variable as off, so an arm or profile that wants the engine's own MoE GEMM native sets it explicitly, and 0 turns it off everywhere"

[setting.R3_MOE_FP16]
default = "1"
status = "validated"
summary = "RAD06: with R3_MOE_NATIVE, the grouped MoE GEMM widens E4M3 operands to f16 and uses the f16 WMMA (a cheaper widening than bf16; the sums carry a 2^-16 scale removed before the scale fold, so output is bit-identical to the bf16 form). On by default in the r3_moe_worker processes (main() sets 1 unless the variable is set); prefill 2,130 -> 3,150 tok/s, decode unchanged, KLD unchanged; the engine process reads an unset variable as off, and 0 turns it off everywhere"
activation = "r3_moe_worker: R3_MOE_FP16 on"
evidence = ["docs/evidence/RAD06/R3_MOE_FP16.run.json"]

[setting.R3_MOE_PROBE]
default = ""
status = "diagnostic"
summary = "RAD06 timing-only ablation of the f16 MoE GEMM (needs R3_MOE_FP16=1; OUTPUT IS INVALID): 1 no WMMA, 2 no E4M3 widening; never set in production"
activation = "R3_MOE_PROBE"

[setting.R3_MOE_AHALF]
default = "1"
status = "validated"
summary = "RAD06: with R3_MOE_FP16, widen the grouped MoE GEMM's activation tile to half once at staging instead of in every wave that reads it (four wave columns share each A fragment); bit-identical, 7-8% off the grouped GEMM on four real captured requests, about 4 KB more LDS. On by default in the r3_moe_worker processes (main() sets 1 unless set); 0 turns it off"
activation = "r3_moe_worker: R3_MOE_AHALF on"
evidence = ["docs/evidence/RAD06/R3_MOE_AHALF.run.json"]

[setting.R3_MOE_COMPARE]
default = "0"
status = "diagnostic"
summary = "selftest: compare compatibility and native MoE forms"
