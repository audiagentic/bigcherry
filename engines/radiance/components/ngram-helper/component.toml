# ngram-helper: the opt-in n-gram embedding gather on a spare GPU (once R3_NGRAM_DEV; the environment is no longer read), split out of libr3 (RCS06). Shelved:
# status evaluated, default off; the owner's call (2026-10-13) is that lookup work belongs on host RAM/CPU and the R9700 is
# compute. It is off until a manifest field selects a card (see README.md).
schema = 1
name = "ngram-helper"
engine = "radiance"
# The engine is configured for the union of every component's targets, so only the cards the engine itself serves are
# listed; the helper's code object also carries gfx1030 (R3NGRAM_TARGETS in CMakeLists.txt), as it did inside libr3.
targets = ["gfx1100", "gfx1201"]
built-against = "v1.17.0"
outputs = ["kernels/libr3ngram.so", "helpers/libr3_ngram_helper.so"]

[build]
configure = { RADIANCE_SRC = "{engine_source}" }

# Runtime settings: see libr3/component.toml for the status vocabulary. Names are runtime identifiers and did not change.

