# The upstream units this component owns (whole-unit strategy: a three-way merge of upstream changes into the owned copy).
# `bigcherry pin-triage` reads this file and reports, per unit, what upstream did to the origin path between the last
# integrated commit and the target ref. After integrating (or deciding to skip) upstream's change, set last-integrated.

[[unit]]
name = "r4d_iqr_embed"
