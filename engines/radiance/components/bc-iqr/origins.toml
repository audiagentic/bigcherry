last-integrated = "b6b8751cccb0e834a13ae9e5afca824ee9a487aa"
strategy = "whole-unit"
base-rows = ["embed_lookup_iqr"]
overlay-rows = ["bc_embed_lookup_iqr"]
architectures = ["gfx1100", "gfx1201"]
absorbed-rewrites = ["engines/radiance/components/libr3/native-shelved/r4d_iqr_embed.hip.rw"]

