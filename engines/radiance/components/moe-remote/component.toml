# moe-remote: the remote-MoE hand-off (RAD02, RCS04). The helper process r3_moe_worker computes routed experts for an engine
# on another card family; libr3moe is the engine-side mailbox plugin (engine patch rad0002 declares the ops it fills). The
# lane kernels the helper runs are gfx1100 today and move behind moe_backend.h in RCS05. Split from libr3, which keeps the
# engine kernel overrides. Setting names are runtime identifiers and did not change in the move.
schema = 1
name = "moe-remote"
engine = "radiance"
targets = ["gfx1100", "gfx1201"]
built-against = "v1.9.0"
outputs = ["kernels/libr3moe.so", "helpers/r3_moe_worker"]

[build]
configure = { RADIANCE_SRC = "{engine_source}", R3MOE_TARGETS = "gfx1100;gfx1201" }

# Offline tests the bump gate builds and runs with ctest in the component's build tree.
[test]
targets = ["r3_moe_shm_test", "r3_moe_backend_test", "r3_moe_fp8_ref_test"]

# Runtime settings: see libr3/component.toml for the status vocabulary.

[setting.R3_MOE_WORKER]
default = ""
status = "experimental"
summary = "enable patch rad0002 GPU mailbox ops; helper process must already own the configured POSIX shm segment"
activation = "r3_moe_worker: runtime map owns [0-9]+ experts, [0-9.]+ GiB"

[setting.R3_MOE_WORKER_DEVICES]
default = ""
status = "experimental"
summary = "harness-only: space-separated HIP device indices, one r3_moe_worker process each (e.g. \"0 1\"); the campaign adapter starts them before the server, sets R3_MOE_WORKER_INDEX and R3_MOE_WORKER_COUNT per helper, and stops them after it"

[setting.R3_MOE_WORKER_SHM]
default = "/r3-moe-helper"
status = "diagnostic"
summary = "POSIX shm segment mapped by libr3 GPU mailbox ops and r3_moe_worker"

[setting.R3_MOE_WORKER_CPU]
default = "0"
status = "diagnostic"
summary = "force the slice-2a fp32 host reference path instead of gfx1201 compute"

[setting.R3_MOE_WORKER_MIB]
default = "28672"
status = "experimental"
summary = "VRAM budget in MiB for cold full-expert units owned by the gfx1201 helper"

[setting.R3_MOE_WORKER_MAX_ROWS]
default = "64"
status = "experimental"
summary = "largest step (rows) handed to the helper (engine and helper both read it); larger steps keep the engine path. Steps above R3_MOE_WORKER_SMALL_ROWS take the large lane, launched sized to the request"

[setting.R3_MOE_WORKER_ENGINE_RANKS]
default = "2"
status = "experimental"
summary = "engine TP ranks the helper serves: 2 = two XTX ranks, each asking for its TP slice; 1 = one engine (the R9700, RAD02) asking for full expert width (the helper runs both slices and sums them)"

[setting.R3_MOE_WORKER_COUNT]
default = "1"
status = "experimental"
summary = "helpers sharing the segment: 2 = two XTX helpers behind a one-rank (R9700) engine, each owning half the candidates and serving its own rank slot"

[setting.R3_MOE_WORKER_HISTOGRAM]
default = ""
status = "diagnostic"
summary = "path prefix: the engine counts every routed (layer, expert) in VRAM and writes uint32[128][512] to <path>.rank<r> at shutdown"

[setting.R3_MOE_WORKER_HEAT]
default = ""
status = "experimental"
summary = "a R3_MOE_WORKER_HISTOGRAM file: the helper owns the coldest experts first, so the engine keeps the hot ones and decode hands off less"

[setting.R3_MOE_WORKER_GEMV]
default = "1"
status = "experimental"
summary = "decode MoE GEMV for the helper's small lane (RAD05): no WMMA, dot products straight off the packed w4nl64 nibbles. R9700 engine + two XTX helpers, Flash-Next: decode 69.6/69.7 -> 95.7/95.5 tok/s, prefill unchanged, KLD 0.0605 (noise floor 0.058-0.062). 0 turns it off; 2 compares it with the grouped GEMM (--compare)"

[setting.R3_MOE_WORKER_GEMV_WIDE]
default = "1"
status = "experimental"
summary = "RAD14: on by default for FP8 experts (0 is the off switch). The FP8 decode GEMV with sixteen-byte weight loads (four in flight a lane) and a branch-free E4M3 decode. On real 35B decode captures, per 16-row request on one XTX: gate/up 301 -> 109 us, down 150 -> 82 us (about 2.4x less kernel time); output within f32 rounding of the default kernel (a different K-sum order)."
activation = "r3_moe_worker: R3_MOE_WORKER_GEMV_WIDE on"

[setting.R3_MOE_WORKER_GEMV_H2]
default = "2"
status = "experimental"
summary = "RAD14: the FP8 decode GEMV on packed f16 dot products (v_dot2_f32_f16, f32 accumulate); the value is the rows a block handles (1, 2 or 4), 0 falls back to the wide kernel (R3_MOE_WORKER_GEMV_WIDE). On by default for FP8 experts with two rows a block. E4M3 codes and their products are exact in f16 and the activation and weight scales are applied to each sixteen-element partial sum, so only the f32 accumulation order differs from the default. Per 16-row 35B decode request on one XTX: gate/up 106 -> 85 us, down 72 -> 56 us against the wide kernel; engine decode +17-20% at 1 stream, within noise at 4 and 6."
activation = "r3_moe_worker: R3_MOE_WORKER_GEMV_H2 on"

[setting.R3_MOE_WORKER_GEMV_W4H2]
default = "0"
status = "evaluated"
summary = "RAD14: the W4 (w4nl64) decode GEMV rebuilt like the FP8 one (sixteen-byte loads, byte-permute level lookup, v_dot2_f32_f16). Kernel time on real 4-row Flash-Next decode requests on one XTX 101 -> 77 us, output within rounding of the default kernel; but the Flash-Next stream A/B (R9700 engine + two XTX workers, MTP 3, two pairs) showed no end-to-end decode change at 2/4/6 streams and +5% at 1 stream confounded by different draft acceptance (0.68 vs 0.64). Kept off; the worker GEMV is not on Flash-Next's decode critical path."
activation = "r3_moe_worker: R3_MOE_WORKER_GEMV_W4H2 on"

[setting.R3_MOE_WORKER_GEMV_MR]
default = "0"
status = "evaluated"
summary = "RAD14: the wide FP8 GEMV with an expert's rows batched four at a time (weights decoded once a pass). Slower than the single-row wide kernel on real 35B decode requests (gate/up 148 vs 109 us, down 95 vs 82 us): about twelve experts a request is too little parallelism and each block restages its activation rows. Kept for other shapes."
activation = "r3_moe_worker: R3_MOE_WORKER_GEMV_MR on"

[setting.R3_MOE_WORKER_MOE_FORM]
default = "0"
status = "experimental"
summary = "pin the helper's grouped MoE GEMM form (RAD06): 0 libr4d's choice by row count, 1 the 32-row prefill form, 2 the 16-row decode form (a helper's prefill rows are ~4.5 an owned expert)"
activation = "r3_moe_worker: grouped MoE GEMM pinned to the"

[setting.R3_MOE_WORKER_MOE_DOWN_TILE]
default = ""
status = "experimental"
summary = "pin libr4d's down-projection tile in the helper (RAD06 gfx1100 sweep): 1 the 64/128-column tile, 2 the 256-column 16-wave tile; unset leaves libr4d's choice"
activation = "r3_moe_worker: R3_MOE_WORKER_MOE_DOWN_TILE="

[setting.R3_MOE_WORKER_MOE_LONG_ROWS]
default = ""
status = "evaluated"
summary = "RAD06: runs of this many rows or more take 64-row slices and an MT=4 tile in the helper's grouped MoE GEMM (fewer weight-tile restages for long runs; bit-identical); unset or 0 keeps the single 32-row map"
activation = "r3_moe_worker: R3_MOE_WORKER_MOE_LONG_ROWS="

[setting.R3_MOE_WORKER_VECIO]
default = "1"
status = "validated"
summary = "RAD06: the helper's activation copy (engine's mapped host memory into the lane) and result write (lane to mapped host memory) use 16-byte accesses instead of one byte and two bytes a thread; bit-identical, read per request; 0 keeps the scalar kernels"
activation = "r3_moe_worker: R3_MOE_WORKER_VECIO on"
evidence = ["docs/evidence/RAD06/R3_MOE_WORKER_VECIO.run.json"]

[setting.R3_MOE_WORKER_COMBINE]
default = ""
status = "experimental"
summary = "RAD18: two helpers behind a one-rank engine; on the large lane (steps of R3_MOE_WORKER_COMBINE_MIN_ROWS+ rows, default 256) helper 0 adds both helpers' bf16 rows on the CPU (R3_MOE_WORKER_COMBINE_THREADS, default 8) so the engine reads one row a token over its link instead of two; helper 0 combines on its large-lane thread after its stream sync and futex-waits on helper 1, no CPU polling; not bit-identical (one more bf16 rounding); set in both the engine and the helpers' environment; protocol v15"
activation = "libr3moe: R3_MOE_WORKER_COMBINE on"

[setting.R3_MOE_WORKER_COMBINE_MIN_ROWS]
default = "256"
status = "experimental"
summary = "RAD18: with R3_MOE_WORKER_COMBINE, the smallest large-lane step (rows) the helpers' rows are combined for; smaller steps keep the two-row merge"

[setting.R3_MOE_WORKER_COMBINE_THREADS]
default = "8"
status = "experimental"
summary = "RAD18: with R3_MOE_WORKER_COMBINE, CPU threads in helper 0's combine pool (persistent, sleeping on futex words between steps; the calling thread is one of them)"

[setting.R3_MOE_WORKER_BALANCE]
default = ""
status = "evaluated"
summary = "RAD06/RHP: with R3_MOE_WORKER_HEAT and two helpers, split the jointly owned experts between the helpers per layer by predicted cost (a layer waits for the slower helper) instead of alternating down the global heat ranking; the owned set is unchanged, only who owns which; deterministic so both helper processes compute the same map; offline prediction 3.5-5.6% of helper time (tools/lab/radiance/heat-placement/balance_score.py)"
activation = "R3_MOE_WORKER_BALANCE: per-layer cost split"

[setting.R3_MOE_WORKER_BALANCE_SPEED]
default = ""
status = "evaluated"
summary = "RAD06/RHP: with R3_MOE_WORKER_BALANCE, relative speeds of the two helpers as 's0,s1' (default 1,1); a helper's expert cost is divided by its speed, so a slower card takes less (helper 1 measured ~8-10% slower)"

[setting.R3_MOE_WORKER_FUSEROUTE]
default = "1"
status = "validated"
summary = "RAD06: the small (decode) lane's routing prologue (four memsets and the route count / prefix / scatter / inverse kernels) runs as one block, lane_route_small; same result, fewer launches and gaps in the request the engine waits for; read per request; 0 keeps the separate kernels"
activation = "r3_moe_worker: R3_MOE_WORKER_FUSEROUTE on"
evidence = ["docs/evidence/RAD06/R3_MOE_WORKER_FUSEROUTE.run.json"]

[setting.R3_MOE_WORKER_ROWS_SMALL]
default = ""
status = "evaluated"
summary = "RAD06: the few-rows-a-expert kernel (R3_MOE_WORKER_ROWS's) on the small (decode) lane: weights read once an expert for all its rows instead of once a route, since a decode request sends ~2.4 routes to each distinct expert; read per request, not bit-exact (different accumulation order)"
activation = "R3_MOE_WORKER_ROWS_SMALL"

[setting.R3_MOE_WORKER_FUSESTAGE]
default = "1"
status = "validated"
summary = "RAD06: the engine's activation staging for a step of at most 16 rows (decode) is done by the publish kernel instead of a separate staging kernel in front of it: a launch and its gap off the path before every helper request; same data, same fence; read per launch in the engine process; 0 keeps the separate kernel"
activation = "r3_moe: R3_MOE_WORKER_FUSESTAGE on"
evidence = ["docs/evidence/RAD06/R3_MOE_WORKER_FUSESTAGE.run.json"]

[setting.R3_MOE_WORKER_TRACE]
default = ""
status = "diagnostic"
summary = "RAD06: every Nth finished request a helper lane prints its critical-path stamps as a TRACE line on stderr: the engine's local work between publish and wait (local_us), the engine's wait for this helper (wait_us) and the helper GPU's own request time (helper_gpu_us), each within one device's wall clock; the stamps are nine stores to the mapped request slot (five at publish, two in the engine's wait, two on the helper) and are always written, so this only enables the printing (compare an arm with R3_MOE_WORKER_TRACE=0 against the build without stamps for their cost); read with tools/lab/radiance/heat-placement/trace_report.py"
activation = "TRACE,lane"

[setting.R3_MOE_WORKER_BURST_TRACE]
default = ""
status = "diagnostic"
summary = "RAD20: the engine-side plugin (libr3moe) logs each inference-burst transition the engine reports through rad0002's burst callback (begin when the engine loop gets a step after being idle, end when it finds none) with a monotonic timestamp; read by tools/lab/radiance/burst-trace.sh, which checks begin/end pairing across single, concurrent, back-to-back and prefill requests"
activation = "burst,begin"

[setting.R3_MOE_WORKER_POWER_SAVE]
default = "1"
status = "experimental"
summary = "RAD20: helper GPU power save between inference bursts (default on). On: each small lane releases and drains its pre-queued GPU waits when a burst ends and the helper opens hardware queues only for the lanes it serves, so the helper GPU idles (~10 W on an XTX instead of ~95 W). 0: waits stay armed between bursts and a queue is opened for every protocol lane, keeping MES and the command processor awake for ~0.3% faster decode dispatch at ~85 W more per helper GPU at idle. Lane threads sleep on the burst futex either way"
activation = "r3_moe_worker: R3_MOE_WORKER_POWER_SAVE"

[setting.R3_MOE_WORKER_QUEUE_WARM]
default = ""
status = "evaluated"
summary = "RAD20, with power save on: during an inference burst the helper activates just enough idle placeholder queues to oversubscribe its GPU's compute slots (KFD num_cp_queues minus the queues it owns, plus one), meant to keep gfx11 MES busy and recover main's dispatch latency; between bursts it parks them (AMDKFD_IOC_UPDATE_QUEUE 0%). SHELVED, default off: in the Flash-Next layout (run rad20-burst-profile-10262303) switching the placeholders during a live burst gave a CPF page fault (permission, read) on both XTX within the first request, MES then failed REMOVE_QUEUE and both GPUs mode-1 reset; the standalone harness (rad20-queue-warm.cpp), which never switches while other queues run kernels, did not show it. 1 turns it on for investigation only"
activation = "r3_moe_worker: queue warm-up"

[setting.R3_MOE_SWEEP_FAST]
default = ""
status = "diagnostic"
summary = "RAD06 replay-sweep harness only: compare each variant bitwise against the first and print a sum_abs checksum instead of running the CPU reference (r3_moe_worker --replay-sweep); never set while serving"
activation = "R3_MOE_SWEEP_FAST"

[setting.R3_MOE_WORKER_LAYERS]
default = ""
status = "diagnostic"
summary = "RAD13 bisection aid: MIN-MAX, the engine hands only layers in the range to the workers and runs every other layer itself (its map is published all-local); never set in production"
activation = "libr3: R3_MOE_WORKER_LAYERS on"

[setting.R3_MOE_WORKER_CAPTURE]
default = ""
status = "diagnostic"
summary = "directory: the helper writes real large-lane requests (layer slot map, routes, bf16 activations) there for `r3_moe_worker --replay MODEL FILE` (RAD06 kernel tuning on real request shapes)"

[setting.R3_MOE_WORKER_CAPTURE_EVERY]
default = "37"
status = "diagnostic"
summary = "with R3_MOE_WORKER_CAPTURE: capture every Nth large-lane request"

[setting.R3_MOE_WORKER_CAPTURE_MAX]
default = "16"
status = "diagnostic"
summary = "with R3_MOE_WORKER_CAPTURE: at most this many request files"

[setting.R3_MOE_WORKER_GEMV_LARGE_ROWS]
default = "0"
status = "evaluated"
summary = "large-lane requests of at most this many rows take the decode GEMV (RAD06): replayed real requests show 9-row steps at ~0.5 ms a grouped-GEMM call for 25-51 routes; the large lane is sized per request, so the small lane is untouched"
activation = "r3_moe_worker: large-lane requests up to"

[setting.R3_MOE_WORKER_ROWS]
default = "0"
status = "experimental"
summary = "few-rows-a-expert MoE kernel for the helper's large (prefill) lane (RAD06): one block an (expert, 32 outputs), each decoded weight applied to up to 16 of the expert's rows. Shelved: correct but slower - 38% prefill (lab, 2026-10-15); harness A/B 2026-10-17: -76% pp4096, -40% tg512"
activation = "r3_moe_worker: few-rows prefill kernel on the large lane"

[setting.R3_MOE_WORKER_INDEX]
default = "0"
status = "experimental"
summary = "this helper's index under R3_MOE_WORKER_COUNT: 0 creates the segment, 1 attaches to it"

[setting.R3_MOE_WORKER_SMALL_ROWS]
default = "64"
status = "experimental"
summary = "helper small-lane size: steps up to this many rows run on GPU work the helper pre-queues at this fixed size (no host in the loop)"

[setting.R3_MOE_WORKER_SMALL_LANES]
default = ""
status = "experimental"
summary = "RAD12: up to four ascending pre-queued small-lane sizes, e.g. 4,8,16,24; a step takes the first lane that fits its rows, else the large lane. Replaces the single R3_MOE_WORKER_SMALL_ROWS size when set. At three and four concurrent streams (12 and 16 rows with MTP) the 8-row lane sends the step to the large lane; a lane padded to 24 costs a 4-row step about 25%; the classes avoid both"
activation = "r3_moe_worker: R3_MOE_WORKER_SMALL_LANES on"

[setting.R3_MOE_WORKER_POISON]
default = "0"
status = "diagnostic"
summary = "1 (any non-zero): every helper result value becomes 1e3 (proves the mailbox merge consumes helper rows); zero: results become 0 (same output as dropping remote routes)"
activation = "R3_MOE_WORKER poison"

[setting.R3_MOE_WORKER_SHADOW]
default = "0"
status = "diagnostic"
summary = "diagnostic build only (patch rad0004, BC_MOE_REMOTE_DIAG): publish owned routes without masking them and compare helper unweighted down rows against the engine rows; a production engine ignores it and computes locally"
activation = "R3_MOE_WORKER_SHADOW layer="

[setting.R3_MOE_WORKER_MASK_ONLY]
default = "0"
status = "diagnostic"
summary = "diagnostic build only (patch rad0004, BC_MOE_REMOTE_DIAG): 1: mask and rescatter after the local GEMMs, merge engine-captured rows; 2: same late publish, merge the helper's per-token rows; a production engine ignores it and computes locally"
activation = "R3_MOE_WORKER_MASK_ONLY enabled"

[setting.R3_MOE_WORKER_PLUGIN]
default = ""
status = "diagnostic"
summary = "override the kernel plugin the helper loads through the rad_plugin ABI (default: libr4d.so on gfx1201, libr3.so on gfx1100)"

[setting.R3_MOE_WORKER_TEST_STOP_AT]
default = ""
status = "diagnostic"
summary = "Test only (RAD24 kill test): <point>:<helper index> makes that helper stop itself with SIGSTOP at <point> so a test can SIGKILL it there. Points: park_drain (a small lane has flagged kParkDraining, before re-checking the burst). Never set in a real run"
activation = "r3_moe_worker: test stop at"

[setting.R3_MOE_WORKER_CPU_SET]
default = "auto"
status = "production"
summary = "PWR03: auto pins the helper's small-lane threads (they wait on the GPU through every decode step) to the CPU's efficiency cores when the kernel reports them (cpu_capacity asymmetry, else the hybrid PMU's list) and changes nothing on a CPU without them; the large lane and the CPU combine pool stay on every core (pinning the whole process slowed prefill ~9% with combine on). all leaves every thread on every CPU. On the bench host (4 E-cores) CPU package power fell 77 -> 42 W in decode and 83 -> 52 W in prefill with unchanged speed (pwr03-ecore-ab.sh)"
activation = "r3_moe_worker: R3_MOE_WORKER_CPU_SET auto - small lanes"
