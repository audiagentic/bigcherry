# Engine pillar: llama.cpp (run-multi-engine MEN08).
# Patch packages and overlay files live under this directory. The vendor checkout is an untracked clone in the
# primary checkout and keeps its location.
schema = 1
name = "llamacpp"
upstream = "https://github.com/ggml-org/llama.cpp"

[layout]
# Every patch ID starts with this before its order digits, so IDs never collide across engines.
patch-id-prefix = ""
patches = "engines/llamacpp/patches"
overlay = "engines/llamacpp/overlay"
vendor = "vendor/llama.cpp"
recipes = "config/recipes.toml"
# Forks and upstream PRs the patches are ported from, and what they are tracked against.
external-sources = "config/external-sources.toml"

# How the server is run (run-multi-engine MEN03). The /shutdown route is BigCherry's (patch 0800) and is only
# registered when LLAMA_SERVER_ENABLE_SHUTDOWN is set; a stock upstream build is stopped with SIGINT instead, which
# the caller selects per run.
# How a build names its GPU targets (CMake cache variable).
[build]
targets-option = "AMDGPU_TARGETS"
# llama-bench, because the runtime-smoke stage is llama-bench shaped; a serving build asks for bin/llama-server.
binary = "bin/llama-bench"

# How this engine's release versions are numbered (docs/reference/build/RELEASES.md): the pin is an upstream build tag
# (b11474) and its number is the major of <major>.<minor>.<patch>.
# Where `bigcherry patch-promote` puts a validated patch (MEN25): the production patch set it joins, and the production
# source its promotion gates and rebase checks compose it over.
[promotion]
patch-set = "validated-enhancements"
source = "bigcherry"

[release]
version-source = "build-tag"

[serve]
binary = "bin/llama-server"
model-flag = "-m"
host-flag = "--host"
port-flag = "--port"
health = "/health"
shutdown = "http:/shutdown"

[serve.env]
LLAMA_SERVER_ENABLE_SHUTDOWN = "1"

[serve.draft-stats]
source = "log"
pattern = 'draft acceptance = [0-9.]+ \(\s*(?P<accepted>\d+) accepted /\s*(?P<drafted>\d+) generated\)'

# RAM-only smoke test (MEN15): `bigcherry --engine llamacpp smoke-cpu --build <dir>` serves this tiny model with no GPU
# visible (HIP/ROCR/CUDA device variables empty, -ngl 0, --device none). The model is declared here, not hard-coded:
# `model` is relative to the model root (--model-root, BC_MODEL_ROOT or the host's model-root) and `sha256` is the
# digest of that exact file. The digest below is a PLACEHOLDER: the runner refuses it until the owner pins a real tiny
# GGUF (about 15 to 150M parameters, e.g. a stories15M-class llama; docs/reference/build/RELEASES.md "CPU smoke").
[smoke.cpu]
model = "smoke/tiny-llama.gguf"
sha256 = "61b50d457809a5194818fd22e6724b456cd7bb9a6264c52c8110684c53f3704a"
args = ["-c", "512", "--threads", "4", "--no-webui"]
