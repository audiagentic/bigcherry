schema = 1

# NRO07: own test-backend-ops pair (TOP_K correctness + route markers) and the
# standard scaffold llama-bench pair (MoE tg128 positive, dense tg128 control).
# Run with a ROCm >= 10.x prefix (HIP >= 7.15) so the small-row route exists.
[producer.nro07]
entrypoint = "producer.py"
callable = "run"
trace_probe = "skip"
standard_campaign = "run"
correctness_evidence_cli = "forbid"
performance_benchmark_cli = "forbid"
artifacts = [
  "nro07-correctness.json",
  "nro07-performance.json",
  "nro07-subject-trace.log",
  "nro07-control-trace.log",
]

[producer.nro07.input.control_model]
type = "path"
required = true
