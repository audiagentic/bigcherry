schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# PNRO10-SPEC-CTX-OTHER-DEVICES currently checks greedy parity only.
# This is NOT proof of activation: 1261 emits BIGCHERRY_PATCH_HIT under
# BIGCHERRY_PATCH_TRACE only if a missing ctx_other device is appended.
# Same-device tensor-split MTP is a negative control, not a positive lane.
# See PNRO10/TESTING.md; patch placement is currently BLOCKED_SOURCE.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
