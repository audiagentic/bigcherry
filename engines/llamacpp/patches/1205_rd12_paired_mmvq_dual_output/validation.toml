schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# Satisfied by a real `--validation-producer 1205_rd12_paired_mmvq_dual_output/rd12`
# run: the patch-local producer runs the paired probe under
# BIGCHERRY_PATCH_TRACE=1 and writes one raw per-arm log; the shared
# binder injects this check's marker-regex, and the validator re-reads
# both logs and re-verifies the marker itself. Stays BLOCKED without a
# real run.
[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1205_rd12 path=dual_output_mmvq_fusion"

# PA38: RD12-PAIRED-MMVQ-DUAL's correctness obligation is bit_identical,
# not backend_reference -- correctness-summary is mechanism-agnostic (it
# only consumes a bound patch-level correctness.json's disposition field)
# and is the right shape for the patch-local producer's real
# bit-identical measurement. Satisfied by a real
# `--validation-producer 1205_rd12_paired_mmvq_dual_output/rd12` run, which
# binds that canonical correctness.json via the shared binder (PA39);
# without one this check stays BLOCKED.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# expected_effect = "both" in config/experiment-contracts.toml requires
# both performance and controls capability producers (bind_contract()'s
# derivation rule) in addition to the activation this patch already had.
[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
