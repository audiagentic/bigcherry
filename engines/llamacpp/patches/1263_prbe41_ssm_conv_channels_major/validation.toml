schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# Subject llama-server log shows the channels-major SSM_CONV input.
[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1263_prbe41 path=ssm_conv_channels_major"

# backend_reference: full-vocabulary logprobs within 5e-4, baseline vs +1263.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# pp512 prefill of the hybrid GDN model (owner policy, 4 sessions).
[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

# tg128 decode on gpt-oss-20B (no SSM; max 1% regression).
[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
