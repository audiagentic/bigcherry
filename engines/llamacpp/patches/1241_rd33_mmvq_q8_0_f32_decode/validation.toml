schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# Subject test-backend-ops Q8_0 MUL_MAT must hit only ncols_dst=1; ncols 2..8 must not hit.
[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1241_rd33 path=q8_0_f32_decode"

# backend_reference: Q8_0 MUL_MAT test-backend-ops within tolerance, both arms; width-1 is the target path.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# Positive: tierL Qwen27B Q8_0 plain decode, paired llama-bench; no speculative/MTP arguments.
[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

# Contract control: tierA Q6_K plain decode. Separately retain MTP as a documented
# no-regression check: verify widths must not activate RD33 and draft acceptance/output
# must remain control-parity; it is not the positive performance lane.
[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
