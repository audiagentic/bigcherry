schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1206_rd13 path=mul_mat_add_view_fusion_(?:f|q)"

# RD13-MUL-MAT-ADD-VIEW-FUSION requires correctness.backend_reference.
# The 1206 patch-local producer (validation/producer.py, reachable via
# --validation-producer 1206_rd13_mul_mat_add_view_fusion/rd13) is the
# real whole-model full-vocabulary logprob backend_reference producer --
# this project's only real whole-model correctness signal, the same
# reasoning RD04's producer uses. correctness-summary is mechanism-
# agnostic and consumes the disposition the producer binds.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# expected_effect = "both" requires performance+activation capability
# producers (bind_contract()'s derivation rule) in addition to the
# trace-marker activation check this patch already had.
[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
