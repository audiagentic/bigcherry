# BigCherry runtime profiles (QFP23): model- and scope-specific runtime settings live in these files, not in patch
# code. They ship next to the binaries in profile/ and are loaded at startup by 0910_feature_sets (override the folder
# or a single file with BIGCHERRY_PROFILES). Select with BIGCHERRY_FEATURES=<profile>[,<profile>...]. Validated by
# `bigcherry patch-lint` (tools/bigcherry/patch/runtime_profiles.py) and again by the loader.
#
# Grammar (one item per line, '#' comments):
#   [profile-name]           lowercase letters, digits, '-'; unique across all files
#   description = <text>     required, one line
#   arch = <gguf arch>       optional, repeatable: the model architectures this profile is tuned for
#   @other-profile           include another profile (any file)
#   NAME = VALUE             a runtime flag documented by some patch's ENV_DOCS; explicit env vars still win
#
# Tuned values carry the evidence run in a comment on the line above.

# Generic profiles, named by what they act on. A profile holds only the flags it switches: anything that helps every
# model is on by default in the build and is not listed in any profile.

[sched-async]
description = scheduler stages small host inputs asynchronously (multi-backend / tensor-split runs); opt-in until the input-lifetime rework (RV4218)
BIGCHERRY_SCHED_ASYNC_INPUTS = 1
