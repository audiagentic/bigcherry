schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# Subject llama-server log shows the top-k weight fold.
[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1207_rd17 path=moe_topk_down_fold"

# backend_reference: full-vocabulary logprobs within 5e-4, baseline vs +1207.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# tg128 MoE decode (target_kernel_gain_pct 0.5, ci95 bound, 10 rounds).
[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

# tg128 on dense tierA-qwen4b-q6k (max 1% regression).
[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
