schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# Subject test-backend-ops GATED_DELTA_NET logs the BF16 chunked route.
[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1253_nro04 path=gdn_chunked_bf16"

# backend_reference: GATED_DELTA_NET within CPU-reference tolerance, both arms.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# pp512 prefill of the hybrid GDN model (4 sessions).
[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

# tg128 decode (never chunked; max 1% regression).
[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
