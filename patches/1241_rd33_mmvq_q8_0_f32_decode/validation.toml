schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# Subject test-backend-ops Q8_0 MUL_MAT must hit only ncols_dst=1; ncols 2..8 must not hit.
[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1241_rd33 path=q8_0_f32_decode"

# backend_reference: Q8_0 MUL_MAT test-backend-ops within tolerance, both arms; width-1 is the target path.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# Positive performance is plain non-MTP Q8_0 decode; MTP verify is a non-activation/control lane.
[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

# Non-target/control lanes must not regress; MTP verification must not activate RD33.
[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
