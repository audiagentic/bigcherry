schema = 1

# PRBE26: own test-backend-ops pair for correctness/activation; standard
# scaffold server/bench pair for the MTP positive lane (dual gfx1100) and the
# dense Q6_K control lane.
[producer.rd33]
entrypoint = "producer.py"
callable = "run"
trace_probe = "skip"
