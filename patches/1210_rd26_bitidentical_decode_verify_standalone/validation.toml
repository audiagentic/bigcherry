schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# RD26-DECODE-VERIFY-BIT-IDENTITY requires correctness.bit_identical only
# (expected_effect = "correctness", no performance claim -- EC02 Appendix-B
# rule). The 1210 patch-local producer (validation/producer.py, reachable
# via --validation-producer
# 1210_rd26_bitidentical_decode_verify_standalone/rd26) is the real
# within-build decode-vs-verify bit-identity oracle; correctness-summary
# consumes its bound disposition.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# The contract declares a real controls lane (decode, as the control
# workload against mtp_verify's positive) -- bind_contract()'s rule adds
# the controls capability whenever contract.controls is non-empty,
# independent of whether a performance claim exists.
[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
