schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true

[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true

# RD73's real bit_identical evidence is produced by
# validation_campaign.evaluate_rd73_mtp_correctness() (VA06), driven by
# --run-rd73-contract -- but that producer is not wired into this
# generic backend-ops check (ctx.correctness_evidence stays unbound for
# it). Declared honestly against a real validator shape, never faked via
# autotune-campaign as a placeholder. Stays BLOCKED here until the
# generic adapter is rebound; see README.md's "Known gap"/"Known
# limitations".
[[check]]
id = "correctness"
capability = "correctness"
validator = "backend-ops"
required = true
ops = ["RD73_MTP_BIT_IDENTICAL"]

# RD73's patch source now carries a real BIGCHERRY_PATCH_TRACE-gated
# marker, and validation_campaign.run_rd73_activation_evidence() (VA06)
# produces a real subject-hit/control-miss result -- but that producer
# is not wired into this generic trace-marker check
# (ctx.trace_evidence stays unbound for it). The generic tune-binary/
# GGML_CUDA_DISABLE_FUSION negative control is still NOT valid for this
# patch (RD73 is graph-cache keying, not a fusion path) and must never
# be substituted here. Stays BLOCKED here until the generic adapter is
# rebound; see README.md's "Known gap"/"Known limitations".
[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1233_rd73 path=stable_graph_cache_key"
