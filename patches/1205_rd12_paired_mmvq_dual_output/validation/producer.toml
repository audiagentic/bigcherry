schema = 1

# PA36 sub-slice 2 (dev-gpt-agent req_2ecda033763949a9, T6): 1205's
# (RD12-PAIRED-MMVQ-DUAL) patch-local producer. Mechanically migrated off
# validation_campaign.py's run_rd12_correctness_check() /
# _run_rd12_contract() / --run-rd12-contract (all deleted from shared code
# in the same change -- no compatibility layer, per the project's
# migrate-up doctrine).
#
# standard_campaign = "run": RD12's tracked record requires the generic
# five-build standard campaign (the {tune,replay,stock} campaign identity
# domain plus the validation-domain control/subject build identities) --
# the generic dispatcher runs the shared scaffold and binds this
# producer's semantic evidence into the persisted record.
#
# trace_probe = "skip": the producer itself runs the paired probe under
# BIGCHERRY_PATCH_TRACE=1 and returns the raw per-arm trace artifacts --
# the plan-declared trace-marker check (its marker-regex is owned by
# validation.toml, injected by the shared binder) re-reads both logs and
# re-verifies the marker itself.
#
# One contract architecture per run (the historical RD12 rule): the
# operator names it via --amdgpu-targets; the artifact allowlist is the
# static union over all three contract architectures -- each run emits
# exactly one rd12-correctness-<arch>.json plus the two per-arm
# activation logs for that architecture (old basenames, under artifacts/).
[producer.rd12]
entrypoint = "producer.py"
callable = "run"
trace_probe = "skip"
standard_campaign = "run"
correctness_evidence_cli = "forbid"
performance_benchmark_cli = "forbid"
artifacts = [
  "rd12-performance.json",
  "rd12-correctness-gfx1100.json",
  "rd12-correctness-gfx1201.json",
  "rd12-correctness-gfx1030.json",
  "activation-rd12-gfx1100-subject.log",
  "activation-rd12-gfx1100-control.log",
  "activation-rd12-gfx1201-subject.log",
  "activation-rd12-gfx1201-control.log",
  "activation-rd12-gfx1030-subject.log",
  "activation-rd12-gfx1030-control.log",
]
