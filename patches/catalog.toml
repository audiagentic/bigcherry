# BigCherry patch catalog (RE30 phase 1: declarative patch-stream metadata).
#
# This is orthogonal metadata layered ON TOP of each patch module's existing
# GROUP/STATE Python constants -- it does not replace them yet (GROUP/STATE
# remain authoritative for tools/bigcherry/patchset.py's resolver, recipes.toml
# patch-set membership, and every existing identity hash). `kind`/`origin`/
# `backend` answer questions GROUP/STATE cannot: GROUP="core" conflates
# BigCherry's own dispatch-engine instrumentation with nothing external,
# while GROUP="upstream-fixes" conflates an OPEN unmerged PR (1002) with
# already-merged upstream commits (1003/1004/1005) -- none of that is
# recoverable from GROUP/STATE alone. `state` here mirrors each module's
# real STATE constant (validated/rejected/untested) so the two can be
# cross-checked one-to-one; see tools/tests/test_patch_catalog.py.
#
# Known mismatch this catalog documents (RE30's own investigation finding):
# 1000_rdna4_mmq_q2k_q6k_fix declares GROUP="upstream-fixes" in its Python
# module -- a real backport of an unmerged upstream PR (#25940) -- yet is
# also compiled into the standard `framework` patch-set in recipes.toml
# (group="core" territory). kind=upstream-backport here records what it
# actually IS regardless of which recipe currently pulls it in; the
# recipe-membership question is a separate, not-yet-resolved cleanup.
#
# backend: hip | vulkan | agnostic -- every module today is hip or agnostic;
# no vulkan patches exist yet (RE30 phases 2+ need real Vulkan hardware
# evidence before any vulkan-backend patch is written).
# kind: framework | upstream-backport | enhancement
# origin: local | upstream-commit | upstream-pr | external-fork

version = 1

