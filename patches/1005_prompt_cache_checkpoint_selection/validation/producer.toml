# 1005's (PROMPT-CACHE-CHECKPOINT-SELECTION) patch-local producer.
#
# correctness (greedy_parity): formalizes the exact regression sequence
# already manually validated (README.md, 2026-09-12/13): turn A primes a
# checkpoint at a full-prompt position under --cache-ram 512, turn C sends
# a request sharing only a SHORTER common prefix (the exact scenario
# hybrid/recurrent memory's exact-position-only validity requires this
# patch to handle correctly). Turn C's cache-assisted completion must
# exactly equal a cold (--cache-ram 0, fresh process) reference completion
# of the identical turn C prompt.
#
# No activation check: the fix has no opt-in marker/env toggle -- it
# changes always-active checkpoint-selection logic.
[producer.prompt-cache-checkpoint-selection]
entrypoint = "producer.py"
callable = "run"
trace_probe = "skip"
standard_campaign = "run"
correctness_evidence_cli = "forbid"
performance_benchmark_cli = "forbid"
artifacts = [
  "pccs-correctness.json",
  "pccs-performance.json",
]
