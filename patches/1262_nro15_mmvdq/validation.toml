schema = 1

[[check]]
id = "apply"
capability = "apply"
validator = "apply"
required = true

[[check]]
id = "build"
capability = "build"
validator = "build"
required = true

# Subject test-backend-ops K-quant MUL_MAT (mmvdq enabled) logs the mmvdq route.
[[check]]
id = "activation"
capability = "activation"
validator = "trace-marker"
required = true
marker-regex = "BIGCHERRY_PATCH_HIT patch=1262_nro15 path=mmvdq"

# backend_reference: K-quant MUL_MAT within CPU-reference tolerance, both arms.
[[check]]
id = "correctness"
capability = "correctness"
validator = "correctness-summary"
required = true

# tg128 decode, Q6_K model, mmvdq enabled on both arms (4 sessions).
[[check]]
id = "performance"
capability = "performance"
validator = "benchmark"
required = true
benchmark-executor = "paired-llama-bench-v1"

# pp512 prefill on the same model (never takes mmvdq; max 1% regression).
[[check]]
id = "controls"
capability = "controls"
validator = "benchmark"
required = true
