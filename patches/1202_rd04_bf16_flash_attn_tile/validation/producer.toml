schema = 1

# PA36 migration #2 (dev-gpt-agent req_69d011a2acf44acc): 1202's
# (RD04-BF16-FLASH-ATTN-TILE) patch-local producer. ONE combined producer
# per the design ruling: RD04 has one bound contract, so the PPL
# correctness pair and the paired benchmark belong to a single evidence
# workflow. Mechanically migrated off validation_campaign.py's
# run_rd04_contract_correctness() / run_rd04_benchmark_evidence() and the
# --run-rd04-contract / --run-rd04-benchmark CLI paths (all deleted from
# shared code in the same change -- no compatibility layer, per the
# project's migrate-up doctrine).
#
# standard_campaign = "run": the RD04 tracked record requires the generic
# five-build standard campaign (the {tune,replay,stock} campaign identity
# domain plus the validation-domain control/subject build identities).
# The benchmark REUSES the scaffold parity llama-bench pair via
# ProducerContext.validation_binaries -- it never builds a second pair.
#
# trace_probe = "skip": 1202 contains NO valid RD04 trace marker (see
# validation.toml's activation check comment), so there is no
# subject-hit/control-miss probe to run and the declared trace-marker
# check remains BLOCKED, exactly as the historical records show.
# Activation stays unsatisfied -- deliberately.
#
# The PPL correctness pair is producer-built: build_pair() with
# primary_target="llama-perplexity" (that target is NOT one of the
# scaffold's five builds). llama-perplexity is built once as the fat
# multi-arch set; the run architecture is selected at run time.
#
# One contract architecture per run (the historical RD04 rule): the
# operator names it via --amdgpu-targets; the artifact allowlist is the
# static union over all three contract architectures -- each run emits
# exactly one rd04-correctness-<arch>.json plus one
# rd04-performance-<arch>.json (old basenames, under artifacts/).
[producer.rd04]
entrypoint = "producer.py"
callable = "run"
trace_probe = "skip"
standard_campaign = "run"
correctness_evidence_cli = "forbid"
performance_benchmark_cli = "forbid"
artifacts = [
  "rd04-correctness-gfx1100.json",
  "rd04-correctness-gfx1201.json",
  "rd04-correctness-gfx1030.json",
  "rd04-performance-gfx1100.json",
  "rd04-performance-gfx1201.json",
  "rd04-performance-gfx1030.json",
]
