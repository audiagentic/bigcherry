name: Radiance build

# Builds the pinned radiance engine and its libr3 component for gfx1100/gfx1201 in the ROCm 7.2.4 image on a hosted runner and runs the
# card-free component tests. No GPU is needed to compile; acceptance and benchmarks stay on the lab host. Packaging into a release
# artifact is a later step (MEN13/MEN14).

on:
  pull_request:
    branches: [main]
    paths:
      - 'engines/radiance/**'
      - '.github/workflows/radiance-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radiance-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # The bare upstream clone is pure network/disk I/O with no computation (MEN24): cache it across runs and
      # fetch incrementally instead of cloning radiance's whole history from scratch every time. Restores on any
      # prior cache (restore-keys) since a slightly stale clone still makes the fetch below cheap; always re-saves
      # (even on build failure) so the cache stays current.
      - name: Cache the upstream radiance clone
        uses: actions/cache@v4
        with:
          path: work/upstream
          key: radiance-upstream-${{ github.run_id }}
          restore-keys: |
            radiance-upstream-

      - name: Build in the ROCm image
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src rocm/dev-ubuntu-24.04:7.2.4 bash -euxo pipefail -c '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git cmake ninja-build python3 python3-pip g++-14 gcc-14 ca-certificates
            git config --global --add safe.directory /src
            git config --global --add safe.directory /src/work/upstream/radiance.git
            export RADIANCE_HOST_CC=gcc-14 RADIANCE_HOST_CXX=g++-14 ROCM_PATH=/opt/rocm PYTHONPATH=tools
            mkdir -p work/upstream
            if [ -d work/upstream/radiance.git ]; then
              git -C work/upstream/radiance.git fetch --prune origin "+refs/*:refs/*"
            else
              git clone --bare https://codeberg.org/StillDeadcode/radiance.git work/upstream/radiance.git
            fi
            python3 -m bigcherry build --lane radiance-lab:stock:linux-radiance
          '
