name: Radiance build

# Builds the pinned radiance engine and its libr3 component for gfx1100/gfx1201 in the prebuilt ROCm 7.2.4 build image (.github/docker/radiance-build) on a hosted runner and runs the
# card-free component tests. No GPU is needed to compile; acceptance and benchmarks stay on the lab host. Packaging into a release
# artifact is a later step (MEN13/MEN14).

on:
  # Pull requests run this through .github/workflows/pr-ci.yml (one required gate: ci-pass).
  workflow_call:
  # GitHub Actions scopes caches per branch (current branch, PR base branch, then the repo's default
  # branch) -- without this, every PR branch's upstream-clone and ccache caches start cold every time,
  # since this workflow never otherwise runs ON main itself to populate a cache later PR branches can
  # restore from. Running on push to main after each merge is what makes `restore-keys` actually find
  # something for the NEXT PR, not just across pushes to the same branch.
  push:
    branches: [main]
    paths:
      - 'engines/radiance/**'
      - '!engines/radiance/**/*.md'
      - '!engines/radiance/**/*.mdx'
      - '!engines/radiance/**/docs/**'
      - 'tools/bigcherry/campaign/**'
      - 'tools/bigcherry/core/**'
      - 'tools/bigcherry/build/**'
      - 'config/environment.example.toml'
      - 'tools/bigcherry/engine_adapters/radiance*.py'
      - 'tools/bigcherry/cli/component_tests.py'
      - 'tools/bigcherry/cli/main.py'
      - 'tools/bigcherry/cli/engine_scope.py'
      - '.github/workflows/radiance-build.yml'
      - '.github/scripts/ci_sdk_identity.py'
      - '.github/workflows/radiance-build-image.yml'
      - '.github/docker/radiance-build/**'
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: Ninja compiler concurrency for cold-build comparison
        type: choice
        options:
          - default
          - "2"
          - "6"
        default: default
      cold:
        description: Disable ccache to benchmark an identical cold source build
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  # called from pr-ci.yml for pull requests: that caller already serializes per PR, so key on the caller run
  group: radiance-build-${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: true

# Host settings are untracked; CI uses the tracked example host (it declares the rocm-sdks the recipes name).
env:
  BIGCHERRY_ENVIRONMENT: config/environment.example.toml

jobs:
  image:
    uses: ./.github/workflows/radiance-build-image.yml

  build:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull the build image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull '${{ needs.image.outputs.image }}'
          df -h /

      # The bare upstream clone is pure network/disk I/O with no computation (MEN24): cache it across runs and
      # fetch incrementally instead of cloning radiance's whole history from scratch every time. Restores on any
      # prior cache (restore-keys) since a slightly stale clone still makes the fetch below cheap; main re-saves it
      # (even on build failure) so the cache stays current.
      - name: Restore the upstream radiance clone
        uses: actions/cache/restore@v4
        with:
          path: work/upstream
          key: radiance-upstream-${{ github.run_id }}
          restore-keys: |
            radiance-upstream-

      # Without this the actual compile (not the clone above) runs from scratch every time regardless of how
      # small the diff is -- recipes.toml wires every compiler CMake invokes here (host C/C++ and the HIP
      # device-code compiler) through ccache, so this is what makes that actually pay off across CI runs.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: work/.ccache
          key: radiance-ccache-${{ github.run_id }}
          restore-keys: |
            radiance-ccache-

      - name: Build in the ROCm image
        env:
          CI_COMPILE_JOBS: ${{ inputs.compile_jobs || 'default' }}
          CI_FORCE_COLD: ${{ inputs.cold || 'false' }}
        run: |
          docker run --rm --shm-size=1g -e BIGCHERRY_ENVIRONMENT -e CI_COMPILE_JOBS -e CI_FORCE_COLD -e BC_WORK_ROOT=/src/work -v "$GITHUB_WORKSPACE:/src" -w /src '${{ needs.image.outputs.image }}' bash -euxo pipefail -c '
            git config --global --add safe.directory /src
            git config --global --add safe.directory /src/work/upstream/radiance.git
            export RADIANCE_HOST_CC=gcc-14 RADIANCE_HOST_CXX=g++-14 PYTHONPATH=tools
            # Leave the hosted runner default untouched for normal PR builds.
            # Explicit manual 2/6-job cold trials set CMake parallelism; an
            # experimental cap must not reach main before it is measured.
            case "$CI_COMPILE_JOBS" in
              default) unset CMAKE_BUILD_PARALLEL_LEVEL ;;
              2|6) export CMAKE_BUILD_PARALLEL_LEVEL="$CI_COMPILE_JOBS" ;;
              *) echo "Invalid CI build concurrency" >&2; exit 2 ;;
            esac
            if [ "$CI_FORCE_COLD" = "true" ]; then
              export CCACHE_DISABLE=1
            fi
            echo "CI build concurrency: $CI_COMPILE_JOBS; cold trial: $CI_FORCE_COLD"
            export CCACHE_DIR=/src/work/.ccache
            # Absolute paths (include dirs, generated libr3 unit wrappers) are rewritten relative to /src so a
            # build-tree path that differs between runs cannot turn an unchanged unit into a miss.
            export CCACHE_BASEDIR=/src CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content
            mkdir -p work/upstream work/.ccache
            ccache -z
            trap "ccache -s" EXIT
            if [ -d work/upstream/radiance.git ]; then
              git -C work/upstream/radiance.git worktree prune
              git -C work/upstream/radiance.git fetch --prune origin "+refs/*:refs/*"
            else
              git clone --bare https://codeberg.org/StillDeadcode/radiance.git work/upstream/radiance.git
            fi
            python3 -m bigcherry build --lane radiance:stock:linux-radiance | tee work/lane-build.log
            plan=$(grep -oE "ok build_plan_id=[0-9a-f]+" work/lane-build.log | tail -1 | cut -d= -f2)
            test -n "$plan"
            # The card-free component tests, exactly as the pin-bump gate runs them (runtime_bundle.run_component_tests):
            # each declared [test] target of every component, one ctest log per component, named on failure.
            builds=(work/builds/*/"$plan")
            if [ "${#builds[@]}" -ne 1 ] || [ ! -d "${builds[0]}" ]; then
              echo "component-tests: want exactly one build directory for plan $plan, found: ${builds[*]}" >&2
              exit 1
            fi
            python3 -m bigcherry --engine radiance component-tests --build "${builds[0]}"
            # Fingerprint the successful build inside the CI compiler image.
            python3 tools/lab/radiance/ci_ccache.py fingerprint --output work/ci-ccache-artifact/compiler.json
          '

      # Only main writes the shared caches (one entry per main build, found by the restore-keys prefix above); a PR
      # run restores them and never adds its own copy, which is what filled the repository's cache budget.
      - name: Save ccache (main only)
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          key: radiance-ccache-${{ github.run_id }}

      - name: Save the upstream radiance clone (main only)
        if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: work/upstream
          key: radiance-upstream-${{ github.run_id }}

      - name: Report HIP compilation timings
        if: always()
        continue-on-error: true
        run: python3 .github/scripts/ci_build_profile.py work/builds

      # Only main is a trusted seed: never publish a PR's compiler objects.
      - name: Package ccache for the lab
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        # fingerprint/compiler.json is written by root in Docker; packing on
        # the host user failed with PermissionError on every main build.
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src '${{ needs.image.outputs.image }}' python3 tools/lab/radiance/ci_ccache.py pack --cache work/.ccache --out work/ci-ccache-artifact

      - name: Publish verified main ccache
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: radiance-ccache-main
          path: work/ci-ccache-artifact/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Component test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: component-test-logs
          path: work/builds/*/*/components/*/ctest-component-tests.log
          if-no-files-found: ignore
