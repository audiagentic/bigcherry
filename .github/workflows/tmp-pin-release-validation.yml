name: Temporary pin-release validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release unit tests
        run: python -m unittest discover -s tools/tests/release -t .
      - name: Completed-pin dry run
        run: python -m bigcherry pin-release b11552 --dry-run
