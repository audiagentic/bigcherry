# One BigCherry release per llama.cpp pin bump.
#
# release-please needs semver, so the release version is <llama build number>.<minor>.<patch>: llama.cpp b11402 is
# version 11402.0.0 and release-please tags it bc-11402.0.0. This workflow then adds the tag the project uses,
# bc-b11402, on the same commit, names the GitHub release after it and replaces the release text with the generated
# notes (docs/releases/notes/bc-b11402.md, written by `bigcherry release-notes b11402`).
#
# A bump is released by a commit on main carrying the footer `Release-As: 11402.0.0` (the notes commit). Commit
# messages here are not conventional commits, so without that footer release-please proposes nothing.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag bc-b<build> and publish the generated notes
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          RP_TAG: ${{ steps.release.outputs.tag_name }}
          RP_SHA: ${{ steps.release.outputs.sha }}
          LLAMA_BUILD: ${{ steps.release.outputs.major }}
        run: |
          set -euo pipefail
          bc_tag="bc-b${LLAMA_BUILD}"
          notes="docs/releases/notes/${bc_tag}.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/${bc_tag}" >/dev/null; then
            git tag -a "${bc_tag}" "${RP_SHA}" -m "BigCherry on llama.cpp b${LLAMA_BUILD} (release ${RP_TAG})"
            git push origin "${bc_tag}"
          fi
          if [ -f "${notes}" ]; then
            gh release edit "${RP_TAG}" --title "${bc_tag}" --notes-file "${notes}"
          else
            gh release edit "${RP_TAG}" --title "${bc_tag}"
            echo "::warning::${notes} not found - release text left as generated by release-please"
          fi
