# BigCherry releases, versioned by release-please.
#
# The version is <llama build number>.<minor>.<patch> and release-please's tag bc-<version> is the tag of record:
#   - a llama.cpp pin bump is released as <build>.0.0 (b11474 -> bc-11474.0.0). This workflow also points the short tag
#     bc-b<build> at that commit;
#   - while the pin stays, further BigCherry releases raise minor (features) or patch (fixes): bc-11474.1.0, ...
# Every release is titled with its tag and gets the generated notes docs/releases/notes/bc-<version>.md (written by
# `bigcherry release-notes`, committed by `bigcherry pin-release`).
#
# A release is started by a commit on main with a conventional-commit subject and the footer `Release-As: <version>`
# (the notes commit, "chore: release notes bc-<version>"); `bigcherry pin-release <llama tag>` makes that commit,
# fast-forwards main, merges the release PR this workflow opens and waits for the tag. Most commit messages here are
# not conventional commits and release-please ignores them, footer included.
#
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be on for release-please to
# open the release PR; with it off the action pushes the release branch and fails, and the PR has to be opened by
# hand from that branch with the label "autorelease: pending".
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the generated notes (and tag bc-b<build> on a pin's first release)
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          RP_TAG: ${{ steps.release.outputs.tag_name }}
          RP_SHA: ${{ steps.release.outputs.sha }}
          LLAMA_BUILD: ${{ steps.release.outputs.major }}
        run: |
          set -euo pipefail
          notes="docs/releases/notes/${RP_TAG}.md"
          title="${RP_TAG}"
          if [ "${RP_TAG}" = "bc-${LLAMA_BUILD}.0.0" ]; then
            bc_tag="bc-b${LLAMA_BUILD}"
            title="${RP_TAG} (${bc_tag})"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse -q --verify "refs/tags/${bc_tag}" >/dev/null; then
              git tag -a "${bc_tag}" "${RP_SHA}" -m "BigCherry on llama.cpp b${LLAMA_BUILD} (release ${RP_TAG})"
              git push origin "${bc_tag}"
            fi
          fi
          if [ -f "${notes}" ]; then
            gh release edit "${RP_TAG}" --title "${title}" --notes-file "${notes}"
          else
            gh release edit "${RP_TAG}" --title "${title}"
            echo "::warning::${notes} not found - release text left as generated by release-please"
          fi
