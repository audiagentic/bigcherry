# BigCherry releases, versioned by release-please. One release line per engine plus one for the shared platform
# (run-multi-engine MEN09); each line has its own release PR, changelog, version and tags.
#
#   bc-llamacpp   path engines/llamacpp. Version <llama build number>.<minor>.<patch>; release-please's tag
#                 bc-llamacpp-<version> is the tag of record:
#                   - a llama.cpp pin bump is released as <build>.0.0 (b11474 -> bc-llamacpp-11474.0.0);
#                   - while the pin stays, further releases raise minor (features) or patch (fixes).
#                 This workflow also adds the readable tag bc-llamacpp-b<build>-r<N> to the same commit, N counting
#                 the releases at that build from 0, and titles the release with it. Each release gets the generated
#                 notes docs/releases/notes/bc-llamacpp-<version>.md (written by `bigcherry release-notes`, committed
#                 by `bigcherry pin-release`).
#   bc-platform   everything outside engines/. Plain semantic version, tag bc-platform-<version>.
#
# Releases made before the split are tagged bc-<version> on the single line of that time; bc-llamacpp-<version> tags
# were added to the same commits for the builds still in use so the line continues from them.
#
# A llama.cpp release is started by a commit on main with a conventional-commit subject and the footer
# `Release-As: <version>` (the notes commit, "chore: release notes bc-llamacpp-<version>");
# `bigcherry pin-release <llama tag>` makes that commit, fast-forwards main, merges the release PR this workflow opens
# and waits for the tag. Commit messages that are not conventional commits are ignored by release-please.
#
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be on for release-please to
# open the release PR; with it off the action pushes the release branch and fails, and the PR has to be opened by
# hand from that branch with the label "autorelease: pending".
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: llama.cpp line - readable tag and generated notes
        if: ${{ steps.release.outputs['engines/llamacpp--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RP_TAG: ${{ steps.release.outputs['engines/llamacpp--tag_name'] }}
          RP_SHA: ${{ steps.release.outputs['engines/llamacpp--sha'] }}
          LLAMA_BUILD: ${{ steps.release.outputs['engines/llamacpp--major'] }}
        run: |
          set -euo pipefail
          git fetch -q --tags origin
          # N = releases at this build before this one (the tag of record for this release already exists)
          count=$(git tag --list "bc-llamacpp-${LLAMA_BUILD}.*" | wc -l)
          readable="bc-llamacpp-b${LLAMA_BUILD}-r$((count - 1))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/${readable}" >/dev/null; then
            git tag -a "${readable}" "${RP_SHA}" -m "BigCherry on llama.cpp b${LLAMA_BUILD}, release ${count} at this build (${RP_TAG})"
            git push origin "${readable}"
          fi
          notes="docs/releases/notes/${RP_TAG}.md"
          if [ -f "${notes}" ]; then
            gh release edit "${RP_TAG}" --title "${readable}" --notes-file "${notes}"
          else
            gh release edit "${RP_TAG}" --title "${readable}"
            echo "::warning::${notes} not found - release text left as generated by release-please"
          fi

      - name: platform line - title
        if: ${{ steps.release.outputs['.--release_created'] == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RP_TAG: ${{ steps.release.outputs['.--tag_name'] }}
        run: gh release edit "${RP_TAG}" --title "${RP_TAG}"
