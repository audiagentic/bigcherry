name: Patch offline validation

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'tools/tests/patch/**'
      - 'tools/tests/cli/test_slice_lab.py'
      - 'tools/bigcherry/cli/slice_lab.py'
      - 'tools/lab/plan-qualification/**'
      - 'tools/lab/flash-next/queue-meta-mem.sh'
      - 'tools/lab/flash-next/queue-env-ab.sh'
      - 'tools/tests/cli/test_slice_prune.py'
      - 'tools/tests/cli/test_slice_commands.py'
      - 'tools/tests/core/test_primary_root.py'
      - 'tools/tests/core/test_context.py'
      - 'tools/tests/cli/test_slice_prune.py'
      - 'tools/tests/cli/test_slice_commands.py'
      - 'tools/bigcherry/patch/**'
      - 'tools/bigcherry/pin_transition.py'
      - 'tools/bigcherry/campaign/resolution.py'
      - 'tools/bigcherry/core/config.py'
      - 'tools/bigcherry/core/paths.py'
      - 'tools/bigcherry/cli/main.py'
      - 'tools/bigcherry/cli/patch.py'
      - 'tools/bigcherry/cli/source.py'
      - 'tools/bigcherry/cli/slice.py'
      - 'tools/bigcherry/release/records.py'
      - 'tools/bigcherry/source/upstream.py'
      - 'tools/bigcherry/source/workspace.py'
      - 'dispositions/**'
      - 'config/recipes.toml'
      - '.github/workflows/patch-offline-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'patches/**'
      - 'tools/tests/patch/**'
      - 'tools/tests/cli/test_slice_lab.py'
      - 'tools/bigcherry/cli/slice_lab.py'
      - 'tools/lab/plan-qualification/**'
      - 'tools/lab/flash-next/queue-meta-mem.sh'
      - 'tools/lab/flash-next/queue-env-ab.sh'
      - 'tools/bigcherry/patch/**'
      - 'tools/bigcherry/pin_transition.py'
      - 'tools/bigcherry/campaign/resolution.py'
      - 'tools/bigcherry/core/config.py'
      - 'tools/bigcherry/core/paths.py'
      - 'tools/bigcherry/cli/main.py'
      - 'tools/bigcherry/cli/patch.py'
      - 'tools/bigcherry/cli/source.py'
      - 'tools/bigcherry/cli/slice.py'
      - 'tools/bigcherry/release/records.py'
      - 'tools/bigcherry/source/upstream.py'
      - 'tools/bigcherry/source/workspace.py'
      - 'dispositions/**'
      - 'config/recipes.toml'
      - '.github/workflows/patch-offline-validation.yml'
  workflow_dispatch:
    inputs:
      base:
        description: 'Base git ref for changed-patch detection (default: merge base with HEAD^)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: patch-offline-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # a full 77-selection audit takes 25 to 40 minutes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile validation harness
        run: python -m py_compile tools/bigcherry/patch/offline_check.py

      - name: Run primary-root worktree tests
        env:
          PYTHONPATH: tools
        run: python -m unittest tools.tests.core.test_primary_root tools.tests.core.test_context -v

      - name: Test slice lab command construction
        env:
          PYTHONPATH: tools
        run: python -m unittest tools.tests.cli.test_slice_lab -v

      - name: Run patch lint
        shell: bash
        env:
          PYTHONPATH: tools
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_json="$RUNNER_TEMP/patch-lint-head.json"
          set +e
          python -m bigcherry patch-lint --json > "$head_json"
          head_rc=$?
          set -e
          cat "$head_json"

          base="${PR_BASE_SHA:-${EVENT_BEFORE:-}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            exit "$head_rc"
          fi

          base_dir="$RUNNER_TEMP/patch-lint-base"
          base_json="$RUNNER_TEMP/patch-lint-base.json"
          git worktree add --detach "$base_dir" "$base" >/dev/null
          set +e
          (
            cd "$base_dir"
            PYTHONPATH=tools python -m bigcherry patch-lint --json
          ) > "$base_json"
          set -e

          python - "$base_json" "$head_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              base = json.load(fh)
          with open(sys.argv[2], encoding="utf-8") as fh:
              head = json.load(fh)

          base_problems = set(base.get("problems", ()))
          head_problems = set(head.get("problems", ()))
          new = sorted(head_problems - base_problems)
          retained = sorted(head_problems & base_problems)

          if retained:
              print("patch-lint: pre-existing base problems retained:")
              for item in retained:
                  print(f"  - {item}")
          if new:
              print("patch-lint: new problems introduced by this change:")
              for item in new:
                  print(f"  - {item}")
              raise SystemExit(1)
          print("patch-lint: no new problems relative to base")
          PY

      - name: Prepare pinned llama.cpp source
        env:
          PYTHONPATH: tools
        run: python -m bigcherry pull --source bigcherry

      - name: Run slice branch safety tests
        env:
          PYTHONPATH: tools
        run: python -m unittest tools.tests.cli.test_slice_prune tools.tests.cli.test_slice_commands -v

      - name: Run changed-patch offline checks
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_BASE: ${{ inputs.base }}
          PYTHONPATH: tools
        run: |
          set -euo pipefail
          base="${INPUT_BASE:-${PR_BASE_SHA:-${EVENT_BEFORE:-}}}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="HEAD^"
          fi
          base="$(git merge-base "$base" "$GITHUB_SHA")"

          audit_args=(--audit-experiments)
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            audit_args+=(--audit-all-experiments)
          fi

          python -m bigcherry.patch.offline_check \
            --base "$base" \
            --head "$GITHUB_SHA" \
            --source bigcherry \
            --experiment-workers 6 \
            --check-timeout 600 \
            "${audit_args[@]}" \
            --json artifacts/patch-offline-check.json

      - name: Preserve validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-offline-check-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/patch-offline-check.json
