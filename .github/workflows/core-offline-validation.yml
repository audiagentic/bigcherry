name: Core offline validation

# The control-plane, radiance and bench unit suites need no GPU, no network and no vendor checkout. They were not run by any
# workflow, so a pin bump or a component edit could break them unseen (radiance 1.8.0 did, twice).

on:
  push:
    branches: [main]
    paths:
      - 'tools/bigcherry/**'
      - 'tools/tests/core/**'
      - 'tools/tests/radiance/**'
      - 'tools/tests/bench/**'
      - 'tools/lab/radiance/**'
      - 'engines/**'
      - 'config/**'
      - 'docs/reference/**'
      - '.github/workflows/core-offline-validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Host settings are untracked; CI uses the tracked example host (it declares the rocm-sdks the recipes name).
env:
  BIGCHERRY_ENVIRONMENT: config/environment.example.toml

concurrency:
  group: core-offline-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Path filtering lives here, not on the pull_request trigger: every job below is then always created and a
    # job skipped by its `if:` still reports, which a required status check accepts (.github/scripts/changed_paths.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: match
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          tools/bigcherry/**
          tools/tests/core/**
          tools/tests/radiance/**
          tools/tests/bench/**
          tools/lab/radiance/**
          engines/**
          config/**
          docs/reference/**
          .github/workflows/core-offline-validation.yml
          PATTERNS

  core-offline:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependencies
        run: python -m pip install --quiet pytest
      - name: Core, radiance and bench unit suites
        env:
          PYTHONPATH: tools
        run: |
          python -m unittest discover -s tools/tests/core -p 'test_*.py'
          python -m unittest discover -s tools/tests/radiance -p 'test_*.py'
          python -m unittest discover -s tools/tests/bench -p 'test_*.py'
