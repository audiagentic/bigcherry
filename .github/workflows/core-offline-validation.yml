name: Core offline validation

# The control-plane, radiance and bench unit suites need no GPU, no network and no vendor checkout. They were not run by any
# workflow, so a pin bump or a component edit could break them unseen (radiance 1.8.0 did, twice).

on:
  # Pull requests run this through .github/workflows/pr-ci.yml (one required gate: ci-pass).
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'tools/bigcherry/**'
      - 'tools/tests/core/**'
      - 'tools/tests/radiance/**'
      - 'tools/tests/bench/**'
      - 'tools/tests/lab/**'
      - 'tools/tests/build/**'
      - 'tools/lab/radiance/**'
      - 'engines/**'
      - 'config/**'
      - 'docs/reference/**'
      - 'docs/design/serving-manifest-v1/**'
      - 'README.md'
      - 'tools/docs/**'
      - 'tools/tests/test_docs_catalog.py'
      - '.github/workflows/core-offline-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

# Host settings are untracked; CI uses the tracked example host (it declares the rocm-sdks the recipes name).
env:
  BIGCHERRY_ENVIRONMENT: config/environment.example.toml

concurrency:
  # called from pr-ci.yml for pull requests: that caller already serializes per PR, so key on the caller run
  group: core-offline-validation-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  core-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dependencies
        # jsonschema validates the serving manifest v1 contract's schema and examples (tools/tests/core/
        # test_serving_manifest_v1_contract.py); pinned so CI never picks up a new release unseen.
        run: python -m pip install --quiet pytest jsonschema==4.26.0 pyyaml==6.0.3
      - name: Core, radiance and bench unit suites
        env:
          PYTHONPATH: tools
        run: |
          python -m unittest discover -s tools/tests/core -p 'test_*.py'
          python -m unittest discover -s tools/tests/radiance -p 'test_*.py'
          python -m unittest discover -s tools/tests/bench -p 'test_*.py'
      - name: Independent GPU AI screen (card-free)
        env:
          PYTHONPATH: tools
        run: python -m pytest -q -p no:cacheprovider tools/tests/hardware/test_ai_probe.py
      - name: ROCm SDK suite
        # The SDK tests keep every build bound to a named ROCm stack. The launcher's cleanup and plan-check tests
        # went with the launcher (S16); the native owner's own tests cover those behaviours.
        env:
          PYTHONPATH: tools
        run: |
          python -m pytest -q -p no:cacheprovider tools/tests/build/test_rocm_sdk_explicit.py
      - name: Docs catalog and pin consistency
        # A bump left the generated enhancement catalog and the README pins stale on main for hours because no workflow
        # ran these tests. They compare the docs with the recipes, the patch registry and the patch evidence records.
        env:
          PYTHONPATH: tools
        run: |
          python -m pytest -q -p no:cacheprovider tools/tests/test_docs_catalog.py
