name: Patch compile validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'engines/llamacpp/patches/**'
      - 'engines/llamacpp/overlay/**'
      - 'engines/llamacpp/engine.toml'
      - 'config/recipes.toml'
      - 'tools/bigcherry/build/source_compile_check.py'
      - 'tools/tests/build/test_source_compile_check.py'
      - '.github/workflows/patch-compile-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-compile-validation-${{ github.ref }}
  cancel-in-progress: true

# Host settings are untracked; CI uses the tracked example host (it declares the rocm-sdks the recipes name).
env:
  BIGCHERRY_ENVIRONMENT: config/environment.example.toml

jobs:
  changes:
    # Path filtering lives here, not on the pull_request trigger: every job below is then always created and a
    # job skipped by its `if:` still reports, which a required status check accepts (.github/scripts/changed_paths.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: match
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          engines/llamacpp/patches/**
          engines/llamacpp/overlay/**
          engines/llamacpp/engine.toml
          config/recipes.toml
          tools/bigcherry/build/source_compile_check.py
          tools/tests/build/test_source_compile_check.py
          .github/workflows/patch-compile-validation.yml
          PATTERNS

  compile-only:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regression tests
        env:
          PYTHONPATH: tools
        run: python -m unittest tools.tests.build.test_source_compile_check -v

      - name: Prepare pinned llama.cpp source
        env:
          PYTHONPATH: tools
        run: python -m bigcherry --engine llamacpp pull --source bigcherry

      - name: Compose production source
        env:
          PYTHONPATH: tools
        run: python -m bigcherry apply --source bigcherry --force --allow-stale-validation-evidence

      - name: Type-check CUDA helper contracts
        env:
          PYTHONPATH: tools
        run: |
          python -m bigcherry.build.source_compile_check \
            --source-root vendor/llama.cpp \
            --workdir work/source-compile-check \
            --clangxx clang++

      - name: Configure CPU-only server
        run: |
          cmake -S vendor/llama.cpp -B work/server-compile -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=OFF \
            -DGGML_HIP=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=OFF

      - name: Compile server translation units
        run: cmake --build work/server-compile --target llama-server -j2
