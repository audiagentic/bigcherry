name: RCD Slurm validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rcd-slurm-validation.yml'
      - 'tools/lab/run-campaign-durability/**'
      - 'tools/bigcherry/jobs/**'
      - 'tools/bigcherry/hardware/**'
      - 'tools/bigcherry/cli/jobs.py'
      - 'tools/bigcherry/cli/hardware.py'
      - 'tools/bigcherry/__main__.py'
      - 'tools/bigcherry/core/host_lock.py'
      - 'tools/bigcherry/core/tree_activity.py'
      - 'tools/bigcherry/experiment/bundle.py'
      - 'tools/bigcherry/tuning/journal.py'
      - 'tools/bigcherry/telemetry.py'
      - 'tools/bigcherry/patch/validation_campaign.py'
      - 'tools/bigcherry/patch/campaign/producer.py'
      - 'config/jobs/**'
      - 'config/slurm/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rcd-slurm-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Path filtering lives here, not on the pull_request trigger: every job below is then always created and a
    # job skipped by its `if:` still reports, which a required status check accepts (.github/scripts/changed_paths.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: match
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          .github/workflows/rcd-slurm-validation.yml
          tools/lab/run-campaign-durability/**
          tools/bigcherry/jobs/**
          tools/bigcherry/hardware/**
          tools/bigcherry/cli/jobs.py
          tools/bigcherry/cli/hardware.py
          tools/bigcherry/__main__.py
          tools/bigcherry/core/host_lock.py
          tools/bigcherry/core/tree_activity.py
          tools/bigcherry/experiment/bundle.py
          tools/bigcherry/tuning/journal.py
          tools/bigcherry/telemetry.py
          tools/bigcherry/patch/validation_campaign.py
          tools/bigcherry/patch/campaign/producer.py
          config/jobs/**
          config/slurm/**
          PATTERNS

  bigcherry-process:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    name: Real BigCherry process semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile RCD validation tools
        run: python -m compileall -q tools/lab/run-campaign-durability
      - name: Planning falsifier
        env:
          PYTHONPATH: tools
        run: python tools/lab/run-campaign-durability/mock_pipeline.py --self-test
      - name: Real BigCherry modules, CLI and child processes
        env:
          PYTHONPATH: tools
        run: python tools/lab/run-campaign-durability/real_bigcherry_process_smoke.py
      - name: Real managed-process failure injection
        env:
          PYTHONPATH: tools
        run: python tools/lab/run-campaign-durability/real_bundle_failure_smoke.py
      - name: Real HI151 and git commit-pinning/recovery semantics
        env:
          PYTHONPATH: tools
        run: python tools/lab/run-campaign-durability/real_recovery_smoke.py
      - name: Concurrent HI151 admission race
        env:
          PYTHONPATH: tools
        run: python tools/lab/run-campaign-durability/tree_activity_race_smoke.py
      - name: Durable submission and event recovery falsifier
        env:
          PYTHONPATH: tools
        run: python tools/lab/run-campaign-durability/service_recovery_smoke.py

  slurm-service:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    name: Real Noble Slurm service semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install and exercise Slurm/MUNGE + BigCherry integration
        run: bash tools/lab/run-campaign-durability/slurm_noble_v3_smoke.sh
      - name: Collect privileged Slurm diagnostics
        if: always()
        shell: bash
        run: |
          set -eu
          out="${RUNNER_TEMP}/rcd-slurm-diagnostics"
          mkdir -p "$out"
          for path in \
            /tmp/bc-slurmctld.log /tmp/bc-slurmd.log \
            /tmp/bc-slurmctld.stdout /tmp/bc-slurmd.stdout \
            /tmp/bc-slurm-jobcomp.log /tmp/bc-squeue.json /tmp/bc-scontrol-config.txt \
            /tmp/bc-licenses.txt /tmp/bc-order /tmp/bc-restarts /tmp/bc-bigcherry-slurm.json \
            /tmp/bc-cgroup-membership; do
            if sudo test -e "$path"; then
              sudo cp "$path" "$out/$(basename "$path")"
            fi
          done
          sudo chown -R "$(id -u):$(id -g)" "$out"
      - name: Preserve Slurm diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcd-slurm-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/rcd-slurm-diagnostics
