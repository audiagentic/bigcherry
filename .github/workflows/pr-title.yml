name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A squash merge puts the title and description on main as the commit message; runs on every edit.
      - name: No machine names or host-specific values in the title and description
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          if [ -z "$FORBIDDEN_TERMS" ]; then
            echo "::error::repository secret FORBIDDEN_TERMS is not set; the scan cannot run" >&2
            exit 1
          fi
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request.txt"
          BIGCHERRY_FORBIDDEN_TERMS="$FORBIDDEN_TERMS" PYTHONPATH=tools \
            python3 -m bigcherry.forbidden_terms --text "$RUNNER_TEMP/pull-request.txt"

      - name: Validate conventional commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]
          pattern = re.compile(
              r"^(feat|fix|perf|chore|docs|test|refactor|ci|build|bump)"
              r"(\([a-z0-9][a-z0-9._/-]*\))?!?: .+"
          )
          # release-please's own pull requests are titled "release: <component> <version>" (release-please-config.json,
          # pull-request-title-pattern); accepted only from its release branches. This check is required on main, so
          # without this a release pull request could never be merged.
          head = os.environ.get("PR_HEAD", "")
          release = re.compile(r"^release: +[a-z0-9-]+ [0-9]+[.][0-9]+[.][0-9]+$")
          if head.startswith("release-please--branches--") and release.fullmatch(title):
              raise SystemExit(0)
          if not pattern.fullmatch(title):
              print(
                  "PR title must be a conventional commit: "
                  "<type>(<scope>): <description>; allowed types: "
                  "feat, fix, perf, chore, docs, test, refactor, ci, build, bump",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
