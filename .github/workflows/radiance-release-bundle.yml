name: Radiance release bundle

# Makes a bc-radiance-* GitHub release runnable: builds the tagged source in the ROCm 7.2.4 image, runs the card-free component
# tests, packs the runtime (bin, radiance_home, runtime-prefix) into a verified bundle and attaches the archive, its checksum and
# its receipt to the release. `bigcherry release-install <tag>` installs it on a lab host with the same ROCm version.
#
# Most radiance releases change only documentation or tooling, so the runtime is keyed on the git trees of engines/radiance and
# config plus the image's ROCm version (tools/bigcherry/release/ci_bundle.py). A release whose key equals an earlier release's
# key gets that bundle attached again instead of a build (about 30-55 minutes).
#
# Runs when a bc-radiance-* release is published (release-please makes them with its personal token, so the event fires), and by hand
# with workflow_dispatch and a tag (a release that has no bundle yet, or a re-run after a failure). A lab install of the first CI
# bundle (bc-radiance-1170.11.0) launched flashnext-4gpu, the 4-GPU layout with the gfx1030 tail on libr2, before this trigger was on.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: bc-radiance-* release tag to attach a bundle to
        type: string
        required: true

# the build workflow it calls pushes its image to ghcr, so the caller must allow packages: write
permissions:
  contents: read
  packages: write

concurrency:
  group: radiance-release-bundle-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  plan:
    # Other releases (bc-platform-*, llama.cpp) are not radiance runtimes.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'bc-radiance-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^bc-radiance-[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::not a bc-radiance release tag: $TAG" >&2; exit 1; }
      # The source being bundled is the tag; the tooling that decides reuse is this workflow's own commit (an older tag does
      # not have the release-bundle command).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          path: src
      - uses: actions/checkout@v4
        with:
          path: tooling
      - name: Is the runtime already bundled?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PYTHONPATH: tooling/tools
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -q '\.receipt\.json$'; then
            echo "::error::$TAG already has a runtime bundle" >&2; exit 1
          fi
          found=$(python3 -m bigcherry --engine radiance release-bundle "$TAG" --root src --find-reusable)
          echo "$found"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "reuse=$(printf '%s' "$found" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reuse"] or "")')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.reuse == ''
    uses: ./.github/workflows/radiance-build.yml
    with:
      source_ref: ${{ needs.plan.outputs.tag }}
      bundle_tag: ${{ needs.plan.outputs.tag }}

  attach-built:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: radiance-release-bundle
          path: bundle
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -eu
          cd bundle
          sha256sum -c bigcherryrad-*.tar.gz.sha256
          gh release upload "$TAG" bigcherryrad-*.tar.gz bigcherryrad-*.tar.gz.sha256 bigcherryrad-*.receipt.json --repo "$GITHUB_REPOSITORY"

  attach-reused:
    needs: plan
    if: needs.plan.outputs.reuse != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Attach the earlier bundle of the same runtime
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          FROM: ${{ needs.plan.outputs.reuse }}
        run: |
          set -eu
          mkdir bundle && cd bundle
          gh release download "$FROM" --repo "$GITHUB_REPOSITORY" -p 'bigcherryrad-*.tar.gz' -p 'bigcherryrad-*.sha256' -p 'bigcherryrad-*.receipt.json'
          sha256sum -c bigcherryrad-*.tar.gz.sha256
          python3 - "$TAG" "$FROM" <<'PY'
          import glob, json, sys
          tag, source = sys.argv[1:3]
          path = glob.glob("bigcherryrad-*.receipt.json")[0]
          receipt = json.load(open(path))
          receipt["release_tag"] = tag             # the release this copy is attached to ...
          receipt["reused_from"] = source          # ... and the release whose archive it is (bundle.json names that one)
          json.dump(receipt, open(path, "w"), sort_keys=True, indent=1)
          PY
          gh release upload "$TAG" bigcherryrad-*.tar.gz bigcherryrad-*.tar.gz.sha256 bigcherryrad-*.receipt.json --repo "$GITHUB_REPOSITORY"
