name: PR CI

# The one workflow pull requests run. Each area's checks live in their own reusable workflow (which also keeps its
# push-to-main and manual triggers); a `changes` job decides which areas a PR touches, and `ci-pass` is the single
# required gate: it fails when any job failed or was cancelled, and passes when every job succeeded or was skipped
# because its area was not touched. Required checks on main: `conventional-title` (pr-title.yml) and `ci-pass`.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.core.outputs.run }}
      patch: ${{ steps.patch.outputs.run }}
      compile: ${{ steps.compile.outputs.run }}
      jobsvc: ${{ steps.jobsvc.outputs.run }}
      rcd: ${{ steps.rcd.outputs.run }}
      radiance: ${{ steps.radiance.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: core
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          tools/bigcherry/**
          tools/tests/core/**
          tools/tests/radiance/**
          tools/tests/bench/**
          tools/lab/radiance/**
          engines/**
          config/**
          docs/reference/**
          .github/workflows/core-offline-validation.yml
          .github/workflows/pr-ci.yml
          .github/scripts/changed_paths.py
          PATTERNS
      - id: patch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          engines/llamacpp/patches/**
          engines/radiance/patches/**
          engines/radiance/tests/**
          engines/*/engine.toml
          tools/tests/patch/**
          tools/tests/cli/test_slice_lab.py
          tools/bigcherry/cli/slice_lab.py
          tools/lab/plan-qualification/**
          tools/lab/flash-next/queue-meta-mem.sh
          tools/lab/flash-next/queue-env-ab.sh
          tools/bigcherry/patch/**
          tools/bigcherry/pin_transition.py
          tools/bigcherry/campaign/resolution.py
          tools/bigcherry/core/config.py
          tools/bigcherry/core/paths.py
          tools/bigcherry/cli/main.py
          tools/bigcherry/cli/patch.py
          tools/bigcherry/cli/source.py
          tools/bigcherry/cli/slice.py
          tools/bigcherry/release/records.py
          tools/bigcherry/release/**
          tools/tests/release/**
          tools/bigcherry/build/source_compile_check.py
          tools/tests/build/test_source_compile_check.py
          tools/bigcherry/source/upstream.py
          tools/bigcherry/source/workspace.py
          dispositions/**
          config/recipes.toml
          .github/workflows/patch-offline-validation.yml
          .github/workflows/pr-ci.yml
          .github/scripts/changed_paths.py
          PATTERNS
      - id: compile
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          engines/llamacpp/patches/**
          engines/llamacpp/overlay/**
          engines/llamacpp/engine.toml
          config/recipes.toml
          tools/bigcherry/build/source_compile_check.py
          tools/tests/build/test_source_compile_check.py
          .github/workflows/patch-compile-validation.yml
          .github/workflows/pr-ci.yml
          .github/scripts/changed_paths.py
          PATTERNS
      - id: jobsvc
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          tools/bigcherry/jobs/**
          tools/bigcherry/hardware/**
          tools/bigcherry/core/host_lock.py
          tools/bigcherry/experiment/bundle.py
          tools/bigcherry/patch/campaign/profile.py
          tools/bigcherry/cli/jobs.py
          tools/bigcherry/cli/hardware.py
          tools/bigcherry/__main__.py
          tools/lab/plan-qualification/**
          tools/admin/**
          tools/tests/jobs/**
          config/jobs/**
          config/slurm/**
          .github/workflows/jobs-service-validation.yml
          .github/workflows/pr-ci.yml
          .github/scripts/changed_paths.py
          PATTERNS
      - id: rcd
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          .github/workflows/rcd-slurm-validation.yml
          tools/lab/run-campaign-durability/**
          tools/bigcherry/jobs/**
          tools/bigcherry/hardware/**
          tools/bigcherry/cli/jobs.py
          tools/bigcherry/cli/hardware.py
          tools/bigcherry/__main__.py
          tools/bigcherry/core/host_lock.py
          tools/bigcherry/core/tree_activity.py
          tools/bigcherry/experiment/bundle.py
          tools/bigcherry/tuning/journal.py
          tools/bigcherry/telemetry.py
          tools/bigcherry/patch/validation_campaign.py
          tools/bigcherry/patch/campaign/producer.py
          config/jobs/**
          config/slurm/**
          .github/workflows/pr-ci.yml
          .github/scripts/changed_paths.py
          PATTERNS
      - id: radiance
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/changed_paths.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT" <<'PATTERNS'
          engines/radiance/**
          tools/bigcherry/campaign/**
          tools/bigcherry/core/**
          tools/bigcherry/build/**
          config/environment.example.toml
          tools/bigcherry/engine_adapters/radiance*.py
          .github/workflows/radiance-build.yml
          .github/workflows/radiance-build-image.yml
          .github/docker/radiance-build/**
          .github/workflows/pr-ci.yml
          .github/scripts/changed_paths.py
          PATTERNS

  # Always: repository hygiene scans.
  index-line-endings:
    uses: ./.github/workflows/line-endings.yml

  scan-changed-files:
    uses: ./.github/workflows/forbidden-terms.yml
    secrets: inherit   # FORBIDDEN_TERMS: a called workflow sees no repository secret unless passed

  # Per area: run only when the PR touches its paths (changed_paths.py fails safe to "run").
  core-offline:
    needs: changes
    if: ${{ needs.changes.outputs.core != 'false' }}
    uses: ./.github/workflows/core-offline-validation.yml

  offline-patch:
    needs: changes
    if: ${{ needs.changes.outputs.patch != 'false' }}
    uses: ./.github/workflows/patch-offline-validation.yml

  compile-only:
    needs: changes
    if: ${{ needs.changes.outputs.compile != 'false' }}
    uses: ./.github/workflows/patch-compile-validation.yml

  offline-control-plane:
    needs: changes
    if: ${{ needs.changes.outputs.jobsvc != 'false' }}
    uses: ./.github/workflows/jobs-service-validation.yml

  control-plane-real:
    needs: changes
    if: ${{ needs.changes.outputs.rcd != 'false' }}
    uses: ./.github/workflows/rcd-slurm-validation.yml

  radiance:
    needs: changes
    if: ${{ needs.changes.outputs.radiance != 'false' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/radiance-build.yml

  ci-pass:
    # The single required gate. Skipped jobs (area not touched) count as passing; failed or cancelled do not.
    if: always()
    needs: [changes, index-line-endings, scan-changed-files, core-offline, offline-patch, compile-only, offline-control-plane, control-plane-real, radiance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          bad = {name: job["result"] for name, job in needs.items() if job["result"] not in ("success", "skipped")}
          for name, job in sorted(needs.items()):
              print(f"{name}: {job['result']}")
          if bad:
              print(f"ci-pass: failed: {bad}")
              sys.exit(1)
          print("ci-pass: every job succeeded or was skipped")
          PY
