name: Radiance build image

# Builds .github/docker/radiance-build/Dockerfile and pushes it to GHCR, tagged by a hash of the Dockerfile, only when
# that tag is not there yet. Called by radiance-build.yml before every build (so a PR that changes the Dockerfile
# builds and uses its own image), and run on its own on push to main or by hand.

on:
  workflow_call:
    outputs:
      image:
        description: the image reference for this Dockerfile
        value: ${{ jobs.image.outputs.image }}
  push:
    branches: [main]
    paths:
      - '.github/docker/radiance-build/**'
      - '.github/workflows/radiance-build-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag from the Dockerfile
        id: tag
        run: |
          hash=$(sha256sum .github/docker/radiance-build/Dockerfile | cut -c1-16)
          echo "image=ghcr.io/audiagentic/bigcherry-radiance-build:${hash}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push if missing
        run: |
          image='${{ steps.tag.outputs.image }}'
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "present: $image"
            exit 0
          fi
          docker build -t "$image" .github/docker/radiance-build
          docker image ls "$image"
          docker push "$image"
