name: Agent allreduce final CI

on:
  push:
    branches: [agent-allreduce-final-ci]

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: |
          python -m py_compile \
            patches/0830_split_reduce_telemetry/patch.py \
            patches/0840_hybrid_allreduce_dispatch/patch.py \
            patches/0860_allreduce_provider_cli/patch.py
      - name: Patch lint
        shell: bash
        run: |
          set +e
          PYTHONPATH=tools python -m bigcherry patch-lint 2>&1 | tee patch-lint.log
          echo "${PIPESTATUS[0]}" > patch-lint.rc
          exit 0
      - name: Focused patch tests
        shell: bash
        run: |
          set +e
          PYTHONPATH=tools python -m unittest \
            tools.tests.patch.test_0840_adaptive_provider \
            tools.tests.patch.test_0860_allreduce_provider_cli 2>&1 | tee focused-tests.log
          echo "${PIPESTATUS[0]}" > focused-tests.rc
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanics-diagnostics
          path: |
            patch-lint.log
            patch-lint.rc
            focused-tests.log
            focused-tests.rc
      - name: Enforce gates
        shell: bash
        run: |
          test "$(cat patch-lint.rc)" = "0"
          test "$(cat focused-tests.rc)" = "0"
