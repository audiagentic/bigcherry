# BigCherry Experiment Contracts (EC01/EC02). One [contract.<id>] table per
# contract, loaded by tools/bigcherry/experiment_contract.py:load_contracts().
# Schema, field semantics, and rationale: docs/reference/BigCherry_Experiment_Contract_Implementation_Guide.md
# and docs/planning/active/ec-contracts/EC01.md.
#
# EC02 backfill (2026-08-20): of the 15 materialized 1200-1221 RD-prefixed
# transforms, only the 5 below have a hypothesis.family that fits the CLOSED
# five-value matmul-dispatch-family enum (autotune_schema.FAMILIES --
# mmvq/mmq/mmvf/mmf/blas, "a major algorithmic [matmul] path", per this
# guide's own non-negotiable "never redefined here" rule). The other 10
# materialized patches (RD19/RD20/RD04/RD05/RD06/RD13/RD22/RD26/RD39-42/RD43/
# RD44/RD50) are genuinely NOT matmul-family-dispatch optimizations -- they
# touch graph fusion detection, flash-attention (its own algorithmic path,
# outside the 5-value enum), tensor-parallel topology, device-graph
# scheduling, or SSM/GDN kernels. Forcing one of the 5 family values onto
# them would misrepresent what they actually are. See EC02's plan-item notes
# for the full per-patch accounting and the schema-scope finding this
# produced (a real gap for a future EC/RE item, not an oversight here).

[contract.RD08-Q6K-MMVQ-VDR2]
title = "RD08: Q6_K mmvq VDR=2 decode kernel (amortized dp4a loads)"

[contract.RD08-Q6K-MMVQ-VDR2.source]
source_id = "stew675-rdna-boosts"
commits = ["4591cc9806d24c5151a35007d24b69550df93e32"]
atomic_part = "1204_rd08_q6k_mmvq_vdr2"

[contract.RD08-Q6K-MMVQ-VDR2.hypothesis]
family = "mmvq"
expected_effect = "both"
rationale = "Processes both 8-element chunks of a Q6_K vec_dot per call (4 dp4a ops instead of 2, half the loop iterations for the same row) -- fork claims bit-identical output to the VDR=1 kernel with modest decode gains since decode is DRAM-bound, not compute-bound."

[contract.RD08-Q6K-MMVQ-VDR2.scope]
backend = "hip"
architectures = ["gfx1100", "gfx1201", "gfx1030"]
weight_types = ["q6_k"]

[contract.RD08-Q6K-MMVQ-VDR2.positive]
models = ["tierM-gptoss20b-q6k"]
workloads = ["decode"]

[contract.RD08-Q6K-MMVQ-VDR2.controls]
models = ["tierM-gptoss20b-q6k"]
workloads = ["prefill"]

[contract.RD08-Q6K-MMVQ-VDR2.correctness]
bit_identical = "required"

[contract.RD08-Q6K-MMVQ-VDR2.acceptance]
target_kernel_gain_pct = 0.3
max_control_regression_pct = 1

[contract.RD12-PAIRED-MMVQ-DUAL]
title = "RD12: fuse paired mmvq matmuls (K/V projections) over a shared activation"

[contract.RD12-PAIRED-MMVQ-DUAL.source]
source_id = "stew675-rdna-boosts"
commits = ["44b51c66a210053b12bdfcf1183a6b175878b9c8"]
atomic_part = "1205_rd12_paired_mmvq_dual_output"

[contract.RD12-PAIRED-MMVQ-DUAL.hypothesis]
family = "mmvq"
expected_effect = "both"
rationale = "K and V projections in an attention layer run two mmvq matmuls over the same activation with the same output shape; fusing them into one launch (second weight as a fusion 'gate' writing a separate dst_gate output) amortizes the shared-activation load. Fork claims bit-identical vs unfused, small positive tg64 numbers."

[contract.RD12-PAIRED-MMVQ-DUAL.scope]
backend = "hip"
architectures = ["gfx1100", "gfx1201", "gfx1030"]

[contract.RD12-PAIRED-MMVQ-DUAL.positive]
models = ["tierA-qwen4b-q6k"]
workloads = ["decode"]

[contract.RD12-PAIRED-MMVQ-DUAL.controls]
models = ["tierA-qwen4b-q6k"]
workloads = ["prefill"]

[contract.RD12-PAIRED-MMVQ-DUAL.correctness]
bit_identical = "required"

[contract.RD12-PAIRED-MMVQ-DUAL.acceptance]
target_kernel_gain_pct = 0.3
max_control_regression_pct = 1

