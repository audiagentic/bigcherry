rationale = "Folds the MoE top-k routing-weight MUL into the down-projection MMVQ epilogue, removing a separate elementwise kernel per expert per token. KNOWN COMPOSITION CONFLICT: this patch (1207) and RD12 (1205) share a struct anchor in ggml-cuda.cu's fusion-detection block (documented PIN_REBASE_REVIEW_B10502.md section 2.2) -- selecting both experiments together fails to apply, by design (exp-vs-exp composition deferred, not silently merged)."

