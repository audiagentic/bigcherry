# BigCherry Experiment Contracts (EC01/EC02). One [contract.<id>] table per
# contract, loaded by tools/bigcherry/experiment_contract.py:load_contracts().
# Schema and current field semantics: docs/reference/experiments/EXPERIMENT_CONTRACT.md
# and docs/planning/active/ec-contracts/EC01.md.
#
# EC02 backfill (2026-08-20): of the 15 materialized 1200-1221 RD-prefixed
# transforms, only the 5 below have a hypothesis.family that fits the CLOSED
# five-value matmul-dispatch-family enum (autotune_schema.FAMILIES --
# mmvq/mmq/mmvf/mmf/blas, "a major algorithmic [matmul] path", per this
# guide's own non-negotiable "never redefined here" rule). The other 10
# materialized patches (RD19/RD20/RD04/RD05/RD06/RD13/RD22/RD26/RD39-42/RD43/
# RD44/RD50) are genuinely NOT matmul-family-dispatch optimizations -- they
# touch graph fusion detection, flash-attention (its own algorithmic path,
# outside the 5-value enum), tensor-parallel topology, device-graph
# scheduling, or SSM/GDN kernels. Forcing one of the 5 family values onto
# them would misrepresent what they actually are. See EC02's plan-item notes
# for the full per-patch accounting and the schema-scope finding this
# produced (a real gap for a future EC/RE item, not an oversight here).

[contract.RD08-Q6K-MMVQ-VDR2]
title = "RD08: Q6_K mmvq VDR=2 decode kernel (amortized dp4a loads)"

[contract.RD08-Q6K-MMVQ-VDR2.source]
source_id = "stew675-rdna-boosts"
commits = ["4591cc9806d24c5151a35007d24b69550df93e32"]
atomic_part = "1204_rd08_q6k_mmvq_vdr2"

[contract.RD08-Q6K-MMVQ-VDR2.hypothesis]
family = "mmvq"
expected_effect = "both"
rationale = "Processes both 8-element chunks of a Q6_K vec_dot per call (4 dp4a ops instead of 2, half the loop iterations for the same row) -- fork claims bit-identical output to the VDR=1 kernel with modest decode gains since decode is DRAM-bound, not compute-bound."

[contract.RD08-Q6K-MMVQ-VDR2.scope]
backend = "hip"
architectures = ["gfx1100", "gfx1201", "gfx1030"]
weight_types = ["q6_k"]

[contract.RD08-Q6K-MMVQ-VDR2.positive]
# VA21 REVERTED (2026-09-01): briefly changed to tierA-qwen4b-q6k based
# on VA15's real-hardware subject_hit=false finding against
# tierM-gptoss20b-q6k, hypothesized as an MoE-vs-dense dispatch-routing
# gap. That hypothesis was WRONG -- root-caused via bounded temporary
# trace instrumentation to a pure logging-observability bug: RD08's
# activation marker used GGML_LOG_INFO, and llama-bench.cpp gates
# ggml's log level on its own --verbose flag (ERROR by default,
# filtering both INFO and WARN). Fixed at the source
# (GGML_LOG_INFO->GGML_LOG_WARN in patch.py, commit 991e761; --verbose
# added to the shared trace-probe primitive, commit 222f162). Re-tested
# clean on gfx1201 against BOTH models: subject_hit=true/control_hit=false
# for tierM-gptoss20b-q6k AND tierA-qwen4b-q6k -- RD08's dispatch fires
# correctly for both. Reverted to the original tierM-gptoss20b-q6k
# binding since the change was never actually justified.
models = ["tierM-gptoss20b-q6k"]
workloads = ["decode"]

[contract.RD08-Q6K-MMVQ-VDR2.controls]
models = ["tierM-gptoss20b-q6k"]
workloads = ["prefill"]

[contract.RD08-Q6K-MMVQ-VDR2.correctness]
# PRBE104 decision (2026-09-13, GPT req_8163325eb9c545ea): revised from
# bit_identical to backend_reference. PRBE103 confirmed the VDR1-vs-VDR2
# digest divergence is real and deterministic, not GPU/process noise --
# but RD08 deliberately changes Q6_K accumulation grouping/lane structure
# (VDR=2 processes both 8-element chunks per call instead of one), and
# floating-point addition is non-associative, so exact output bytes are
# not a scientifically invariant correctness property for this class of
# kernel. bit_identical tested the fork's own (now-disproven) stronger
# implementation claim, not the appropriate correctness boundary.
# backend_reference (NMSE within test-backend-ops' existing 0.0005
# threshold) is the right bar: RD08's real measured divergence
# (~2.354e-5, ~21x below 0.0005) independently satisfies it. The
# bit_identical digest-equality result is preserved as a non-gating
# diagnostic fact (fork's bit-identical claim disproved deterministically
# by PRBE103) but is no longer the promotion gate.
backend_reference = "required"

[contract.RD08-Q6K-MMVQ-VDR2.acceptance]
target_kernel_gain_pct = 0.3
max_control_regression_pct = 1
# VA24 migration (2026-09-13): the correctness-check edit above already
# changed this contract's hash, voiding config/experiment-contract-legacy.toml's
# RD08-Q6K-MMVQ-VDR2 point-estimate waiver (an edit never grandfathers a new
# hash into the old weak policy). Migrated to the interval-bound policy in
# the same change, per the RD21/RD39-42/RD73 precedent -- never leave a
# contract pointing at a waiver its own edit just invalidated.
effect_evidence_policy = "ci95_threshold_bound_v1"
min_paired_rounds = 10

