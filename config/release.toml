# BigCherry release configuration (read by `bigcherry release-notes`).
#
# This file configures the engines' release lines (run-multi-engine MEN09; llama.cpp today): tags bc-llamacpp-<build>.<minor>.<patch>,
# each with a readable alias bc-llamacpp-b<build>-r<N> added by the release workflow. release-please on GitHub owns
# the release PR, tag and GitHub release (release-please-config.json, .github/workflows/release-please.yml); this file
# configures the release text it publishes. The notes are generated from: the change ledger (events since the previous release), the patch registry
# (patches added, promoted, changed or retired since the previous release, and build-membership changes) and the
# bump's release record (smoke numbers, regressions found and their disposition).
version = 2

notes-dir = "docs/releases/notes"
ledger = "docs/releases/CURRENT_RELEASE_LEDGER.ndjson"
release-records = "releases"

# One table per engine that has a release line: its tag prefix (the component of its release-please package, plus a
# hyphen), the patch sets whose membership is "in the production build", and an older tag family that may mark the
# previous release when no tag with the prefix exists yet. The engine's recipes file and patch tree come from its
# engine.toml; an engine with no table here has no releases configured and release-notes / pin-release refuse it.
[engine.llamacpp]
tag-prefix = "bc-llamacpp-"
build-patch-sets = ["upstream-fixes", "validated-enhancements"]
previous-tag-fallback-prefixes = ["supports/"]

# ledger change-class -> section heading, in output order; classes not listed are omitted from the notes
[[ledger-section]]
class = "feature"
heading = "New and changed"

[[ledger-section]]
class = "code-fix"
heading = "Fixes"

[[ledger-section]]
class = "audit"
heading = "Findings and measurements"

[[ledger-section]]
class = "refactor"
heading = "Internal changes"

[[ledger-section]]
class = "workflow"
heading = "Tooling and workflow"

[[ledger-section]]
class = "config"
heading = "Configuration"
