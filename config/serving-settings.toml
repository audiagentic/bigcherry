# Reference registry (RSC01): the audited inventory of every serving setting, with its owner, class
# (policy, discovered, derived, tuned, experiment, retire), lifecycle and derivation inputs. The C++
# serving schema (engines/radiance/components/serving) is built from it. Operators do not edit it, and
# nothing reads it at run time. Class reflects the intended ownership, not what is dynamic today.
schema = 1

[[setting]]
key = "engine.--model"
type = "str"
class = "discovered"
owner = "radiance/core/config.cpp"
source = "radiance CLI option; runtime default when omitted"
lifecycle = "startup-only"

