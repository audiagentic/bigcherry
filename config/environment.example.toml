# Host environment TEMPLATE: every machine-specific fact in one place.
#
# This tracked file holds placeholders only. Host-specific values (addresses,
# absolute paths, device inventory) are never committed. To configure a
# machine, copy this file to config/environment.local.toml (gitignored) and
# fill in real values, or point BIGCHERRY_ENVIRONMENT at a file elsewhere.
# Any scalar key of the default host can also be overridden per shell with
# BC_<KEY> (upper-case, '-' -> '_'), e.g. BC_MODEL_ROOT.
#
# Docs name a ROLE ("the build server") and resolve the specifics from the
# configured file. This is deliberately NOT config/recipes.toml's [[trees]]:
# those model repo CHECKOUTS, this models the HOST (address, model root,
# toolchain, device inventory).
schema_version = 1

# The role docs refer to.
default-host = "dev"

[host.dev]
description = """
Multi-GPU AMD build and campaign host. Owns every real GPU measurement in
this project: builds, tune campaigns, profiling and end-to-end benchmarks.
"""
# `hostname` is the ssh alias and the name to prefer in prose and commands.
# `address` exists so a reader can fix their own ssh config; commands should
# use the alias, never the literal address.
hostname = "dev"

# Filesystem layout.
# The live git checkout. A REAL local clone -- git over a network share is
# too slow and unreliable, so builds come from here.
repo-root = "${HOME}/bigcherry"
model-root = "/srv/example-models"
# The single root of BigCherry's working storage. Builds (content-addressed, identity-bound: never run a manual
# cmake build inside it, never hand-edit a generated input there), runs, worktrees, toolchains, remote-runs and
# the upstream mirror are fixed subfolders of it; nothing else configures them.
work-root = "${HOME}/bigcherry/work"
tmp-root = "/srv/example/tmp"
dev-root = "/srv/example/dev"
# Optional mounted volumes and the llama.cpp tree docs and scripts refer to as
# ${BC_DATA_ROOT}, ${BC_VAULT_ROOT} and ${BC_LLAMACPP_ROOT}.
# data-root = "/srv/example/data"
# vault-root = "/srv/example/vault"
# llamacpp-root = "/srv/example-share/llamacpp"
# The documented server-bench harness. Not llama-bench: it cannot observe MTP
# speculative decode at all.
bench-harness = "/srv/example-share/llamacpp/bench"

# Toolchain. rocm-root is the default ROCm install. Named SDKs for recipe stacks
# are declared in the rocm-sdks table below; a relative root is repo-relative.
rocm-root = "/opt/rocm"

# Ports. The production port belongs to the production inference service; a
# benchmark that binds it takes production down. Tests, benchmarks and ad-hoc
# servers use test-port, which the tools refuse to set equal to production-port.
production-port = 8080
test-port = 18400

# `bigcherry remote run` (docs/reference/tooling/REMOTE_RUNS.md): exact process names (comm) that mean the GPUs are in
# use, and the host-local environment file a remote run exports as BIGCHERRY_ENVIRONMENT (default: the tree's
# config/environment.local.toml). A run is refused while a listed process runs, or when this list is empty.
busy-processes = ["llama-server", "ninja"]
# environment-file = "${BC_REPO_ROOT}/config/environment.local.toml"

# Device inventory. Index is the HIP/ROCR visible-devices ordinal, which is
# what --devices and *_VISIBLE_DEVICES take.
# locator: the real PCI BDF (bus:device.function) from `rocm-smi --showbus`
# on the real host -- required by
# bigcherry.experiment.attestation.parse_llama_server_attestation() to
# positively confirm which physical device ran a measurement. Never invent
# this value; omit it until verified.
[[host.dev.devices]]
index = 0
arch = "gfx1100"
model = "example gfx1100 card"
vram-mib = 24560
locator = "0000:01:00.0"
# PWR04 (optional): power settings calibrated for this physical card, applied by the power helper and restored to the
# driver defaults when it stops. Each card is calibrated on its own -- two cards of the same model can need different
# values. evidence names the run that validated them (speed, watts, output identity, stability soak). Omit the table
# to keep the driver defaults.
#   vddgfx-offset-mv: OverDrive graphics voltage offset, -500..0 (negative undervolts)
#   sclk-max-mhz:     OverDrive maximum shader clock, 500..5000
#   power-cap-w:      board power cap, watts
[host.dev.devices.power]
vddgfx-offset-mv = -75
evidence = "example only: replace with the validating run"

[[host.dev.devices]]
index = 1
arch = "gfx1201"
model = "example gfx1201 card"
vram-mib = 32624
locator = "0000:02:00.0"

# Named ROCm SDKs for recipe stacks (stack.sdk = "<version>"). A relative root is
# repo-relative.
[host.dev.rocm-sdks]
"7.2" = "/opt/rocm-7.2"
"7.14" = "/opt/rocm-7.14"
"10.1" = "vendor/rocm/10.1.0rc2"

# Values for ${VAR} references in tracked config (config/recipes.toml), e.g.
# the remote campaign checkout and optional ROCm stack roots. A variable set
# in the process environment takes precedence over this table.
[env]
# ROCM_PATH = "/opt/rocm"            # usually set by tools/env/rocm-env.sh

# PA47 slice lab uses the normal [host.*] schema above. When --host is omitted
# it resolves `default-host`; the current dev local config therefore remains:
#
# default-host = "dev"
# [host.dev]
# hostname = "ssh-user@lab-host"
# repo-root = "/srv/example/bigcherry/workspaces/main"
# work-root = "/srv/example/bigcherry-work"
#
# Those three keys are the fields slice lab itself requires. Other host fields
# may remain in the same table for other commands. To invoke `--host dev`
# instead, define [host.dev] with the same hostname/repo-root/work-root keys.
# Runs go to work-root/runs and detached worktrees to work-root/worktrees.

# Machine names that must never appear in tracked files (checked by the pre-commit hook).
# Put the real names in config/environment.local.toml, not here.
# [forbidden]
# terms = ["<machine-name>"]
