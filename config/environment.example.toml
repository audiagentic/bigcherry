# Host environment TEMPLATE: every machine-specific fact in one place.
#
# This tracked file holds placeholders only. Host-specific values (addresses,
# absolute paths, device inventory) are never committed. To configure a
# machine, copy this file to config/environment.local.toml (gitignored) and
# fill in real values, or point BIGCHERRY_ENVIRONMENT at a file elsewhere.
# Any scalar key of the default host can also be overridden per shell with
# BIGCHERRY_HOST_<KEY> (upper-case, '-' -> '_'), e.g. BIGCHERRY_HOST_MODEL_ROOT.
#
# Docs name a ROLE ("the build server") and resolve the specifics from the
# configured file. This is deliberately NOT config/recipes.toml's [[trees]]:
# those model repo CHECKOUTS, this models the HOST (address, model root,
# toolchain, device inventory).
schema_version = 1

# The role docs refer to.
default-host = "build-server"

[host.build-server]
description = """
Multi-GPU AMD build and campaign host. Owns every real GPU measurement in
this project: builds, tune campaigns, profiling and end-to-end benchmarks.
"""
# `hostname` is the ssh alias and the name to prefer in prose and commands.
# `address` exists so a reader can fix their own ssh config; commands should
# use the alias, never the literal address.
hostname = "build-server"
address = "192.0.2.10"

# Filesystem layout.
home = "/home/example"
# The live git checkout. A REAL local clone -- git over a network share is
# too slow and unreliable, so builds come from here.
repo = "/home/example/bigcherry"
# Content-addressed build/campaign cache. Identity-bound: never run a manual
# cmake build inside it, and never hand-edit a generated input there.
cache-root = "/home/example/bigcherry/work"
# File transfer only -- never git, never a build target.
share = "/srv/example-share"
model-root = "/srv/example-models"
# The documented server-bench harness. Not llama-bench: it cannot observe MTP
# speculative decode at all.
bench-harness = "/srv/example-share/llamacpp/bench"

# Toolchain. `rocm-shim` is a symlink tree that exposes bin/clang and
# bin/clang++, which /opt/rocm does not (it ships amdclang/amdclang++ and
# hides real clang under llvm/bin). Campaigns build compiler paths as
# <hip-path>/bin/clang, so they need the shim rather than the ROCm root.
rocm = "/opt/rocm"
rocm-shim = "/home/example/rocm-shim"

# Ports. The production port belongs to the production inference service; a
# benchmark that binds it takes production down. Ad-hoc work takes a free port.
production-port = 8080
bench-port = 18400

# Device inventory. Index is the HIP/ROCR visible-devices ordinal, which is
# what --devices and *_VISIBLE_DEVICES take.
# locator: the real PCI BDF (bus:device.function) from `rocm-smi --showbus`
# on the real host -- required by
# bigcherry.experiment.attestation.parse_llama_server_attestation() to
# positively confirm which physical device ran a measurement. Never invent
# this value; omit it until verified.
[[host.build-server.devices]]
index = 0
arch = "gfx1100"
model = "example gfx1100 card"
vram-mib = 24560
locator = "0000:01:00.0"

[[host.build-server.devices]]
index = 1
arch = "gfx1201"
model = "example gfx1201 card"
vram-mib = 32624
locator = "0000:02:00.0"

# Values for ${VAR} references in tracked config (config/recipes.toml), e.g.
# the remote campaign checkout and optional ROCm stack roots. A variable set
# in the process environment takes precedence over this table.
[env]
BIGCHERRY_BRUTUS_TREE = "/srv/example/bigcherry/workspaces/main"
# ROCM_PATH = "/opt/rocm"            # usually set by tools/env/rocm-env.sh
# BIGCHERRY_ROCM_7_2_ROOT = "/opt/rocm-7.2"
