# BigCherry execution targets. Scientific series bind to one target/inventory
# before submission; adding a remote target does not mix its evidence with Brutus.

[executor.brutus]
kind = "slurm"
host_id = "brutus"
platform_family = "linux-rocm"
default = true
build_partition = "bc-build"
measure_partition = "bc-measure"

