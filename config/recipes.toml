# BigCherry campaign configuration v2.
# Legacy pull/audit/build commands use only the explicit compat.recipe aliases
# below; campaign code consumes source/build/patch-set objects directly.
version = 2
pinned = "b10705"

[patch-set.framework]
patches = [
  "0100_cmake_options",
  "0200_dispatch_hook",
  "0300_mmq_forced_j",
  "0400_mmvf_forced_block",
  "0500_mmf_forced_nwarps",
  "0600_mmvq_geometry",
  "0650_mmvq_native_variant",
  "0700_coverage_counters",
  "0800_server_shutdown_endpoint",
  "0810_replay_hit_diagnostics",
  "0820_measurement_signature_shapes",
  "0830_split_reduce_telemetry",
  "0900_pool_workspace_metrics",
  "1000_rdna4_mmq_q2k_q6k_fix",
  "1100_hi70_direct_op_evidence",
]
required-state = "validated"

[patch-set.validated-enhancements]
patches = []
required-state = "validated"

# RD-prefixed experimental patches (rdna-boost-experiments plan): each gets
# its own [experiment.<name>] entry so `bigcherry build --experiment <name>`
# adds those patches on top of a source's normal framework patch-set
# (resolve_lane's experiment= is additive, not a replacement -- see
# campaign_resolution.py) -- the isolated single-patch(-chain)-vs-native
# bench unit. Most entries below are still exactly one patch, so benching
# two independent patches together stays an explicit choice (a second
# --experiment name), never an accident of a shared group; a REQUIRES
# dependency chain (e.g. rd44-only below, which pulls in its two
# prerequisites) is not "two patches together" in that sense -- it is one
# patch's own declared closure, expanded by expand_composition().
[experiment.rd19-only]
patches = ["1200_rd19_single_gpu_meta_bypass"]

[experiment.rd20-only]
patches = ["1201_rd20_attn_gate_tp_split"]

[experiment.rd04-only]
patches = ["1202_rd04_bf16_flash_attn_tile"]

[experiment.rd05-07-only]
patches = ["1203_rd050607_rdna4_wmma_fa_q6k_mmq"]

[experiment.rd08-only]
patches = ["1204_rd08_q6k_mmvq_vdr2"]

[experiment.rd12-only]
patches = ["1205_rd12_paired_mmvq_dual_output"]

[experiment.rd13-only]
patches = ["1206_rd13_mul_mat_add_view_fusion"]

[experiment.rd17-only]
patches = ["1207_rd17_moe_topk_down_fold"]

[experiment.rd21-only]
patches = ["1208_rd21_gfx1151_mmvq_nwarps_table"]

[experiment.rd22-only]
patches = ["1209_rd22_integrated_gpu_host_buffer_backout"]

[experiment.rd26a-only]
patches = ["1210_rd26_bitidentical_decode_verify_standalone"]

[experiment.rd39-42-only]
patches = ["1215_rd394041_amd_stream_moe_overlap"]

[experiment.rd43-only]
patches = [
  "1215_rd394041_amd_stream_moe_overlap",
  "1216_rd43_concurrent_join_fusion_guard",
]

[experiment.rd44-only]
patches = [
  "1215_rd394041_amd_stream_moe_overlap",
  "1216_rd43_concurrent_join_fusion_guard",
  "1217_rd44_graph_opt_default_rdna35",
]

[experiment.rd50-only]
patches = ["1221_rd50_gdn_chunked_recurrence"]

[experiment.rd73-only]
patches = ["1233_rd73_stable_graph_cache_key"]

[experiment.rd58-only]
patches = ["1234_rd58_pin_state_buffer_multigpu_restore"]

[experiment.rd09-only]
patches = ["1235_rd09_q81_activation_cache_foundation"]

[experiment.rd30-only]
patches = ["1237_rd30_moe_mmq_compact_grid"]

[experiment.rd33-only]
patches = ["1241_rd33_mmvq_q8_0_f32_decode"]

[experiment.hi18-reduce-probe]
patches = ["1224_hi18_reduce_correctness_probe"]

[experiment.hi134-meta-stage-trace]
# 0830 (validated, always in the default control build) satisfies 1242's
# REQUIRES via resolve_exact's context_ids param -- see patchset.py.
patches = ["1242_hi134_meta_stage_trace"]

# HI105: the CPU-reference correctness-evidence patch chain (deterministic
# test-backend-ops init + machine-readable metrics + MUL_MAT_ID's own
# deterministic/full-range ids fix). Not itself a performance patch --
# these only affect tests/test-backend-ops.cpp, gated behind
# BIGCHERRY_TEST_DETERMINISTIC_SEED, so a normal (unset) run is unaffected.
# HI119 extends this chain to init_mul_mat_id_tensors() -- the initializer
# shared by every REGISTERED MUL_MAT_ID-family test_case (test_mul_mat_id,
# test_mul_mat_vec_fusion, HI119's own new fused-GLU class), distinct from
# 1236's test_generic_op-only fix.
[experiment.hi105-correctness]
patches = [
  "1222_hi67_deterministic_test_backend_ops_seed",
  "1223_hi67_machine_readable_correctness_metrics",
  "1236_hi105_deterministic_mul_mat_id_ids",
  "1238_hi119_deterministic_init_mul_mat_id_tensors",
  "1239_hi119_fused_moe_glu_test_case",
  "1240_hi119_moe_glu_file_cli",
]

[source.llama-native]
ref = "pinned"
overlay = false
patch-sets = []

# RE30 phase 3: Vulkan IS wired end-to-end now -- source.backend threads
# through campaign_lane.py -> campaign_workers.make_build_worker ->
# campaign_build.cmake_configure_args(backend=...), so a lane naming this
# source configures GGML_VULKAN=ON for real via the standard `build`/
# `campaign-build` CLI entrypoints, not just a manual cmake invocation.
# patch-sets stays empty -- no Vulkan patch exists yet. NOT wired into
# [campaign.standard] (that profile is HIP's canonical production set);
# select this source explicitly via `--lane vulkan-stock:vulkan-stock:
# vulkan-linux` (or `campaign-build --source vulkan-stock --build
# vulkan-stock --platform vulkan-linux`) until a real Vulkan campaign
# profile is defined.
[source.vulkan-stock]
ref = "pinned"
overlay = false
patch-sets = []
backend = "vulkan"

[source.bigcherry-native]
ref = "pinned"
overlay = true
patch-sets = ["framework"]

[source.bigcherry]
ref = "pinned"
overlay = true
patch-sets = ["framework", "validated-enhancements"]

[build.stock]
description = "Unpatched-behaviour baseline: no dispatch layer at all."
options = {}
needs = []

[build.control]
description = "Dispatch layer compiled in, native candidates only."
options = { GGML_HIP_AUTOTUNE = "ON" }
variant-set = "inventory"
needs = []

[build.record]
description = "Discovers which signatures a workload actually issues."
options = { GGML_HIP_AUTOTUNE = "ON", GGML_HIP_AUTOTUNE_RECORD = "ON" }
variant-set = "inventory"
needs = []

[build.tune]
description = "Measures candidates and writes results. The tuning workhorse."
options = { GGML_HIP_AUTOTUNE = "ON", GGML_HIP_WORKSPACE_METRICS = "ON" }
variant-set = "workload-max"
needs = ["inventory"]

[build.replay]
description = "Applies stored winners without measuring. What ships."
options = { GGML_HIP_DISPATCH_REPLAY = "ON" }
variant-set = "replay-full"
needs = ["inventory", "promoted-winners"]

# HI130: a real per-dispatch attribution build -- GGML_HIP_REPLAY_DIAGNOSTICS
# compiles in hit tracking (ggml_hip_replay_record_hit()), which
# GGML_HIP_DISPATCH_HIT_LOG=<path> flushes as JSONL at clean shutdown:
# {"dispatch":...,"signature":...,"candidate":...,"calls":N} -- literally
# which candidate served every dispatch digest, and how many times. Kept
# as a SEPARATE build from [build.replay] deliberately: production replay
# builds stay free of hit-tracking overhead (see docs/reference/testing/TEST.md's
# "Replay diagnostics" section) -- this is a validation-only build, never
# what ships.
[build.replay-diagnostic]
description = "Replay with per-dispatch hit-log attribution -- validation only, not what ships."
options = { GGML_HIP_DISPATCH_REPLAY = "ON", GGML_HIP_REPLAY_DIAGNOSTICS = "ON" }
variant-set = "replay-full"
needs = ["inventory", "promoted-winners"]

[build.audit]
description = "Compile-audit only: every candidate, ignoring the workload."
options = { GGML_HIP_AUTOTUNE = "ON" }
variant-set = "full-max"
needs = []

[build.vulkan-stock]
description = "Vulkan backend, no patches, no tuning (RE30 phase 1 stub)."
options = { GGML_VULKAN = "ON" }
needs = []

[platform.linux-multi]
description = "brutus, all GPUs. RCCL on -- required for anything multi-GPU."
targets = ["gfx1100", "gfx1201", "gfx1030"]
options = { GGML_HIP = "ON", GGML_HIP_RCCL = "ON", LLAMA_BUILD_TESTS = "ON" }
c-compiler = "/opt/rocm/llvm/bin/clang"
cxx-compiler = "/opt/rocm/llvm/bin/clang++"

[platform.windows-gfx1100]
description = "Local workstation, single card."
targets = ["gfx1100"]
options = { GGML_HIP = "ON", LLAMA_BUILD_TESTS = "ON" }
c-compiler = "C:/Program Files/AMD/ROCm/7.1/bin/clang.exe"
cxx-compiler = "C:/Program Files/AMD/ROCm/7.1/bin/clang++.exe"

[platform.vulkan-linux]
description = "Vulkan-capable Linux platform (RE30 phase 1 stub -- real device/ICD identity TBD, needs real Vulkan hardware evidence)."
# "targets" is a HIP/AMDGPU_TARGETS concept and does not apply to Vulkan;
# the legacy recipes.py loader requires a non-empty list for every platform
# regardless of backend, so this is a placeholder, not a real GPU target --
# cmake_configure_args(backend="vulkan") ignores platform.targets entirely
# (see campaign_build._backend_configure_options). Replace with real
# device/ICD identity in a later RE30 phase.
targets = ["vulkan-stub"]
options = { LLAMA_BUILD_TESTS = "ON" }

# Backend software-stack profiles are request identities, separate from
# machine/platform identities. Paths are deployment-specific and may be
# overridden by callers.
[stack.rocm-system]
backend = "hip"
required-providers = ["hip", "rocblas"]

[stack.rocm-7-2]
backend = "hip"
sdk-root = "/opt/rocm-7.2"
required-providers = ["hip", "rocblas"]

[stack.rocm-7-14]
backend = "hip"
sdk-root = "/opt/rocm-7.14"
required-providers = ["hip", "rocblas"]

[stack.rocm-10]
backend = "hip"
sdk-root = "/opt/rocm-10"
required-providers = ["hip", "rocblas"]

[stack.vulkan-radv]
backend = "vulkan"

[stack.vulkan-amdvlk]
backend = "vulkan"

# RE14/RE19: the canonical replacement for legacy `build --all`, expressed
# directly in v2 source/build/platform identities -- NOT derived from
# compat.recipe.* below, which are legacy-only labels with their own
# separate groups/states selection philosophy (compat.recipe.bigcherry-native
# even aliases the legacy-only build name "native" to this file's real v2
# "control" build; see recipes.py's _load_v2_compat). This profile's lane
# set was confirmed to match today's actual default=true recipe/build
# coverage (upstream/stock, bigcherry-native/native->control,
# bigcherry/{record,tune,replay}) before being written down here, so
# `build --all` under the new campaign engine means the same production
# build roles it always has, not a silently narrower set.
[campaign.standard]
lanes = [
  { source = "llama-native", build = "stock", platform = "linux-multi" },
  { source = "bigcherry-native", build = "control", platform = "linux-multi" },
  { source = "bigcherry", build = "record", platform = "linux-multi" },
  { source = "bigcherry", build = "tune", platform = "linux-multi" },
  { source = "bigcherry", build = "replay", platform = "linux-multi" },
]

# HI130: named server-args + tuner-context bundles for `bigcherry
# tune-campaign --runtime-profile <name>`, so a real production launch
# profile (matching the dual-xtx-27b bench-harness baseline) is
# reproducible from one flag instead of hand-assembling matching launch
# flags each time. tune-context is deliberately separate from and smaller
# than production-context -- the tuner's per-candidate timing workspace
# needs VRAM headroom beyond weights+KV-cache (a real single-GPU R9700 27B
# tune run OOM'd at the model's own max context; -c 4096 fixed it).
[runtime-profile.production-dual-xtx]
server-args = [
  "-sm", "tensor", "--flash-attn", "on",
  "--ubatch-size", "512", "--batch-size", "2048",
  "--threads", "8", "--parallel", "1",
  "--spec-type", "draft-mtp", "--spec-draft-n-max", "4",
  "-ctkd", "q8_0", "-ctvd", "q8_0",
]
tune-context = 4096
production-context = 64000
min-free-vram-bytes-per-device = 2147483648  # 2GiB headroom
# HTR03 (2026-08-30): explicit workload-class declaration, replacing the
# previous implicit "'--spec-type' in server_args" inference in
# workflow.py's behavioral gate. See tools/bigcherry/tuning/behavioral_corpus.py
# for the class registry this is validated against.
behavioral-classes = ["mtp-speculative"]
# GPT review round 2 (2026-08-30): an explicit config reference to WHICH
# corpus edition this profile validates against -- publishing a new
# edition (a new fixtures/corpus-<edition>.toml file) never requires a
# code change, only bumping this string.
behavioral-corpus-edition = "qwen38-production-v1"

[runtime-profile.hi134-layer-split-control]
# HI134 step 5: negative control for the __amd_rocclr_copyBufferRectAligned
# investigation (present whenever device 3 / RDNA2 6900XT participates in a
# -sm tensor run, independent of device count -- see HI134.md). -sm layer
# never constructs comm_ctx/META at all, so if Rect still appears here it is
# not reduction-specific and BigCherry-side tuning of META is not the fix.
# Otherwise identical to production-dual-xtx's non-tensor-split settings
# (flash-attn/ubatch/batch/threads/spec/cache-type) so the comparison isolates
# split-mode, not other config differences.
server-args = [
  "-sm", "layer", "--flash-attn", "on",
  "--ubatch-size", "512", "--batch-size", "2048",
  "--threads", "8", "--parallel", "1",
  "--spec-type", "draft-mtp", "--spec-draft-n-max", "4",
  "-ctkd", "q8_0", "-ctvd", "q8_0",
]
tune-context = 4096
production-context = 64000
min-free-vram-bytes-per-device = 2147483648  # 2GiB headroom

[runtime-profile.hi135-tensor-split-pinned-xtx-6900xt]
# HI135 attribution control: identical explicit -ts 1,1,1 across a 3-GPU
# tensor-split group that includes the 6900XT (device 3), paired with
# hi135-tensor-split-pinned-xtx-r9700 below (same ratio, device 2 instead of
# device 3). Neither prior HI134 run ever pinned -ts -- every topology swap
# changed device architecture AND automatic shard geometry simultaneously,
# so this pair is the first evidence able to separate the two. Otherwise
# identical to production-dual-xtx.
server-args = [
  "-sm", "tensor", "-ts", "1,1,1", "--flash-attn", "on",
  "--ubatch-size", "512", "--batch-size", "2048",
  "--threads", "8", "--parallel", "1",
  "--spec-type", "draft-mtp", "--spec-draft-n-max", "4",
  "-ctkd", "q8_0", "-ctvd", "q8_0",
]
tune-context = 4096
production-context = 64000
min-free-vram-bytes-per-device = 2147483648  # 2GiB headroom

[runtime-profile.hi135-tensor-split-pinned-xtx-r9700]
# HI135 attribution control: pair to hi135-tensor-split-pinned-xtx-6900xt --
# same explicit -ts 1,1,1 ratio, device 2 (R9700, gfx1201) in the third slot
# instead of device 3 (6900XT, gfx1030). Run with --devices 0,1,2.
server-args = [
  "-sm", "tensor", "-ts", "1,1,1", "--flash-attn", "on",
  "--ubatch-size", "512", "--batch-size", "2048",
  "--threads", "8", "--parallel", "1",
  "--spec-type", "draft-mtp", "--spec-draft-n-max", "4",
  "-ctkd", "q8_0", "-ctvd", "q8_0",
]
tune-context = 4096
production-context = 64000
min-free-vram-bytes-per-device = 2147483648  # 2GiB headroom

[runtime-profile.production-safe-single]
server-args = ["--flash-attn", "on"]
tune-context = 4096
production-context = 8192
min-free-vram-bytes-per-device = 1073741824  # 1GiB headroom

# Explicit compatibility aliases for the legacy CLI. These selectors are not
# production source composition; the v2 source definitions above are.
[compat.recipe.dev]
ref = "pinned"
states = ["validated", "untested"]
builds = ["tune", "replay", "record"]
platform = "linux-multi"

[compat.recipe.release]
ref = "pinned"
states = ["validated"]
builds = ["record", "tune", "replay"]
platform = "linux-multi"

[compat.recipe.core]
ref = "pinned"
groups = ["core"]
states = ["validated"]
builds = ["tune"]
platform = "linux-multi"

[compat.recipe.upstream]
ref = "pinned"
groups = []
builds = ["stock"]
platform = "linux-multi"
default = true

[compat.recipe.bigcherry-native]
ref = "pinned"
states = ["validated"]
builds = ["native"]
platform = "linux-multi"
default = true

[compat.recipe.bigcherry]
ref = "pinned"
states = ["validated"]
builds = ["record", "tune", "replay"]
platform = "linux-multi"
default = true

[compat.recipe.workstation]
ref = "pinned"
states = ["validated", "untested"]
builds = ["tune"]
platform = "windows-gfx1100"

[compat.recipe.b10257]
ref = "b10257"
states = ["validated"]
builds = ["tune", "replay"]
platform = "linux-multi"

# --- RE48: tree registry (pin-status --all-remotes / --complete) ----------------
# local is implicit (the tree running the command); it is listed so the
# registry is explicit. `role = "campaign"` trees get the tooling-revision
# comparison; `required` trees must be reachable+consistent for --complete.
[[trees]]
name = "local"
alias = ""
path = ""
role = "local"
required = false

[[trees]]
name = "brutus"
alias = "brutus"
path = "/mnt/vault/development/llmhosts/bigcherry"
role = "campaign"
required = true
expected-tooling-revision = ""
