commit = "58025e01afd44ee06ea6fb23c7ccbdf38e0c34d5"
title = "cuda : pin the host state buffer during multi-GPU state restore"
plan-item = "RD58"
status = "ported-benched"
patch = "1234_rd58_pin_state_buffer_multigpu_restore"
note = "REAL match for RD58's 'pinned host buffer for multi-GPU prompt-cache/state restore' hypothesis. Root cause: ROCm/rocm-systems#4817 (still open) -- with 2+ devices in one process, ROCm's on-the-fly pageable-memory mapping for an async H2D copy can be torn down mid-transfer, faulting the SDMA engine inside the copy's source range. Registers the state-restore buffer as portable pinned host memory for the duration of the restore. Fork's own measured data (2x MI210): unpinned faults after 2 restores; pinned survives 140 restores/12 rounds/0 faults, temp-0 output unchanged. Ported 2026-08-24 with one deliberate deviation from the source PR: removed the unconditional failure-path LLAMA_LOG_WARN (fires on every ordinary restore where GGML_CUDA_REGISTER_HOST is simply unset -- not an error), kept the success diagnostic as the real-hardware activation proof this item's validation relies on. FIXED ACTIVATION GAP (found AND fixed 2026-08-24): the ported registration loop only found a real per-device HIP backend registry under -sm layer split; under -sm tensor (Brutus's actual production dual-XTX topology) `backends` contains a single Meta(...) scheduling wrapper with no registry (stock upstream ggml-backend-meta.cpp behavior, not a BigCherry regression), so pinning never activated there. Fixed by flattening any Meta-typed device into its real underlying per-device backends first, via two existing-but-file-local ggml-backend-meta.cpp functions exposed as public API (linkage change only, zero logic change). FINAL REAL-HARDWARE CONFIRMATION (2026-08-24, Brutus, -sm tensor): activation diagnostic fired on all 150 repeated real host-path restore cycles (55.97MB buffer), zero faults, zero crashes, correct byte count every time; all 5 of llama.cpp's own upstream save/load-state tests pass. Registration-overhead A/B (same binary, 5 reps x 30 cycles each arm): pinning is ~17% FASTER (13.36ms mean) than unpinned (16.15ms mean), no overlap across all 10 reps -- no material latency regression, the opposite. Status raised ported-untested -> ported-benched on this evidence. Original ROCm SDMA fault itself was never reproduced on Brutus (0 faults in 530+ combined cycles, ROCm 7.2, same version as the bug reporter) -- does not disprove the real, open, hardware-confirmed-elsewhere bug, just means the causal 'fault happens, pinning eliminates it' claim is not independently established here. Patch STATE stays untested pending that. See patches/1234's docstring and RD58's plan-item notes for the full history."
