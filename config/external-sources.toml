# BigCherry external-source registry.
#
# Every patch that backports code from an external repository, fork branch,
# or upstream PR is declared here so that a future agent can answer, without
# re-deriving anything: WHERE a patch came from, WHICH reviewed snapshot it
# came from, and HOW to check whether the source has moved, been rebased, or
# landed in mainline (making the patch redundant on the next pin bump).
#
# Conventions (mirroring RD01's provenance rules):
#   - `locator` (branch/PR names) are LOCATORS ONLY, never identity. The
#     authoritative identities are the commit SHAs in `snapshots` and
#     `tracked`.
#   - `snapshots` are reviewed points of the source, newest first. Exactly
#     one has `active = true` per source. A branch rebase or new head does
#     NOT silently mutate an active snapshot; it is a finding that requires
#     a new snapshot (see the stew675 v1 -> v2 history below) plus a re-audit.
#   - `tracked` lists every logical change taken from (or intentionally
#     skipped in) the source. Each entry links a plan item and, once
#     ported, the patch module in patches/. Cross-checked by
#     tools/tests/test_external_sources.py.
#
# `python -m bigcherry sources status`  -- offline view of this registry
# `python -m bigcherry sources check`   -- online: branch moved / rebased /
#                                          merged to mainline / content drift

version = 1

