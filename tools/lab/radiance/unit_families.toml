# Families the unit harness (unit_harness.py) knows: the libr4d units that make a family, the kernels whose resource
# records are compared, the selftest case whose outputs are hashed against the shipped library over the shapes and row
# counts the family serves (tails and ragged N included), and the rows replayed when they changed.
#
# A family is a name for "build these units into a small plugin and check them"; a unit that is in no family can still
# be named with --unit (resource records only).

[family.iqr]
units = ["r4d_gemm_iqr", "r4d_gemm_iqr_p1", "r4d_gemm_iqr_p2", "r4d_gemm_iqr_p3"]
# built only so the selftest case has its int8 reference rows and the gated row its quantiser (their kernels are not
# part of the family)
support_units = ["r4d_gemm_i8a8", "r4d_gemm_w8a8_tiled", "r4d_keyed", "r4d_quant_act_fp8", "r4d_fused_quant"]
# Mangled kernel names (regular expression) of the family: a kernel of the shipped library that matches and is gone from
# the build is reported removed.
kernels = "iqr_prefill_kernel|iqr_fused|iqr_gemm"
# The selftest case: its own oracle checks, then the hash of the output of every IQR case it runs.
case = "gemm_iqr_tiled"
# every row the case checks
rows = ["gemm_iqr_tiled"]

[family.iqr.hash]
# Extra cases on top of the case's own matrix, "N:K:M" each: the V4 trunk shapes at every row count around a tile edge,
# a ragged N (5376) and tail row counts.
shapes = [[5376, 2560], [5120, 2304], [6144, 5120], [5120, 6656]]
rows = [65, 96, 128, 129, 130, 160, 192, 193, 255, 256, 257, 1024, 2047, 2048, 2049]
tail_rows = [129, 193, 257, 2049]
tail_shape = [13312, 5120]

[family.iqr.replay]
# Rows that are replayed when the build changes them, and how: the selftest argument list for one point, the row it
# times, and the line that carries the time.
rows = ["gemm_iqr_tiled"]
command = ["--perfiqr", "{N}", "{K}", "{M}", "{B}", "{iters}", "--cold", "256"]
label = "iqr k{B} tiled"
shapes = [[13312, 5120], [5120, 6656], [6144, 5120], [5120, 2304]]
rows_m = [65, 96, 128, 129, 160, 192, 256, 512, 2048]
bits = [6, 7]

# IQ8R: the 8-bit trunk rows Qwen 27B serves (codes rotated 128 wide, a u8 scale per 256 of K under a bf16 scale a row,
# layout-folded to one bf16 per (row, 256)), the 16-token row up to 64 rows and the tiled row above.
[family.iq8r]
units = ["r4d_gemm_i8a8"]
# the case quantises the activations with had_quant_act_iq8r and checks the fused group-256 producers (rmsnorm, gated and
# gate quantisers) against the unfused bf16 pair; the keyed blocks back the rows' output buffers
support_units = ["r4d_quant_act_fp8", "r4d_fused_quant", "r4d_model_bf16", "r4d_keyed"]
kernels = "i8a8|iq8r"
case = "gemm_iq8r_tiled"
# every row the case checks: the two GEMMs by output hash and oracle, the quantiser and fused producers by the case's own oracles
rows = ["gemm_iq8r_nt_m16", "gemm_iq8r_tiled", "had_quant_act_iq8r", "rmsnorm_had_quant_iq8r", "gated_had_quant_iq8r",
        "gate_had_quant_iq8r"]

[family.iq8r.hash]
# The 27B trunk shapes per tensor-parallel rank (K a multiple of 256, N of 128), row counts around the tile edges, a ragged
# N (5376) and tails.
shapes = [[5376, 2560], [5120, 2304], [6144, 5120], [5120, 6656]]
rows = [1, 5, 16, 17, 64, 65, 96, 128, 129, 192, 256, 257, 1024, 2048]
tail_rows = [129, 257, 2049]
tail_shape = [13312, 5120]

[family.iq8r.replay]
rows = ["gemm_iq8r_tiled"]
command = ["--perfw8", "{N}", "{K}", "{M}", "{iters}", "--cold", "256"]
label = "gemm_iq8r_tiled"
shapes = [[13312, 5120], [5120, 6656], [6144, 5120], [5376, 2560]]
rows_m = [65, 96, 128, 160, 256, 512, 2048]
# --perfw8 has no bit-width argument; one placeholder value keeps the replay grid's shape
bits = [8]

# The int8 vocabulary head Qwen 27B selects (logits_gemm_i8) and the drafter's rescoring over the same stored head
# (logit_rerank_i8): int8 codes with a bf16 scale per row per 128 columns, an f32 output plane.
[family.head_i8]
units = ["r4d_logits_gemm_i8", "r4d_rowtopk_bf16"]
support_units = ["r4d_keyed"]
kernels = "lm_wmma|mvm_kernel|r4dchain_lm|logit_rerank"
case = "logits_gemm_i8"
rows = ["logits_gemm_i8", "logit_rerank_i8"]
# No replay: --perfvocab also needs the bc-iqr vocabulary and IQR head rows. Changed head code therefore stays
# inconclusive until a timing command is added; identical code passes on the hash and the case's oracle.

[family.head_i8.hash]
# The three tensor-parallel vocabulary shards of the 248320-token head at K = 5120, at decode, draft and verify row counts.
shapes = [[82816, 5120]]
rows = [1, 8, 9, 33, 64]
tail_rows = [1, 64]
tail_shape = [82688, 5120]

# The int8 trunk rows at group 128 (int8 codes with a bf16 scale per row per 128 of K, int8 activations with an f32 scale
# per 128): Flash-Next's engine trunk, the 16-token row up to 64 rows and the tiled row above.
[family.i8a8]
units = ["r4d_gemm_i8a8"]
support_units = ["r4d_quant_act_fp8", "r4d_keyed"]
kernels = "i8a8|8a8_prefill"
# the selftest's int8 trunk cases all answer to the quantiser's name, so one case runs both rows
case = "quant_act_i8g"
rows = ["gemm_i8a8_nt_m16", "gemm_i8a8_tiled", "quant_act_i8g"]

[family.i8a8.hash]
# Flash-Next's trunk shapes (N, K) at decode, draft and prefill row counts around the tile edges.
shapes = [[12288, 2560], [16384, 2560], [1280, 2560], [512, 2560], [2560, 6144], [2560, 640]]
rows = [1, 8, 9, 32, 33, 64, 65, 128, 129, 2047]
tail_rows = [257]
tail_shape = [16384, 2560]

[family.i8a8.replay]
rows = ["gemm_i8a8_tiled"]
command = ["--perfw8", "{N}", "{K}", "{M}", "{iters}", "--cold", "256"]
label = "gemm_i8a8_tiled"
shapes = [[16384, 2560], [2560, 6144], [12288, 2560]]
rows_m = [65, 128, 129, 512, 2048]
bits = [8]

# The grouped MoE GEMM over 4-bit non-linear experts against an int8 activation (moe_gemm_w4a8i8, w4nl64a8i8h): Flash-Next's
# expert projections, gate/up in two parts and the sorted-row down projection.
[family.moe_w4a8i8]
units = ["r4d_moe"]
support_units = ["r4d_quant_act_fp8", "r4d_keyed"]
kernels = "moe_w4|moe_gemm_w4"
case = "moe_gemm_w4a8i8"
rows = ["moe_gemm_w4a8i8"]
# the case's 640-expert shapes refuse the aligned prefill form by contract (its run map stops at 512 experts)
expected_skips = ["no run map past 512 experts, so no aligned launch"]
# No replay: changed expert code stays inconclusive until a timing command is configured.

[family.moe_w4a8i8.hash]
# Flash-Next's expert geometry "N0:K0:N1:K1:parts:experts:sorted:tokens": gate/up 1280 x 2560 in two parts and the down
# projection 2560 x 640 over sorted rows, at decode, draft and prefill token counts. Sixteen experts keep the host decode
# affordable; the per-expert geometry, and so the kernel path, is the model's.
cases = ["1280:2560:1280:2560:2:16:0:8", "1280:2560:1280:2560:2:16:0:64", "1280:2560:1280:2560:2:16:0:600",
         "2560:640:2560:640:1:16:1:8", "2560:640:2560:640:1:16:1:64", "2560:640:2560:640:1:16:1:600"]

# Overlays: an owned plugin whose rows are listed ahead of the base library. The harness builds the plugin, runs the base's
# selftest case through the overlay row (selftest rows are found by `row-prefix` + name), and compares with the base alone.
[overlay.iqr_embed]
component = "bc-iqr"
plugin = "libbciqr"
case = "embed_lookup_iqr"
row-prefix = "bc_"
# Kernels of the unit (mangled names) whose resource records are compared with the base library's.
kernels = "iqr_embed_kernel"
# Extra tables "rows:dim" the case also runs, and timed (cold, median of 31 launches)
cases = "32768:5120"

[overlay.iqr_vocab]
component = "bc-iqr"
plugin = "libbciqr"
case = "logits_gemm_vocab_iqr"
row-prefix = "bc_"
kernels = "vocab"
cases-env = "UH_VOCAB_CASES"
# "M:K:rows" (one class of 4-bit codes) besides the case's own tables: a prefill-sized and a decode-sized head
cases = "8:5120:4096,64:5120:2048"

# The IQR GEMM family: the three rows of the unit r4d_gemm_iqr and its fused single-band tile. The base the overlay runs over carries
# the int8 reference rows (and the counters and geometry helpers the unit asks of its base) but not the IQR units; the case's
# hashes are the family's (trunk shapes at row counts around the tile edges, tails, ragged N), and the replay is the family's
# for the rows below (single-band 65 to 128, multi-band, the 16 and 64-token tiles).
[overlay.iqr_gemm]
component = "bc-iqr"
plugin = "libbciqr"
case = "gemm_iqr_tiled"
row-prefix = "bc_"
kernels = "."
base-units = ["r4d_gemm_i8a8", "r4d_gemm_w8a8_tiled", "r4d_keyed"]
hash-family = "iqr"
rounds = 1
replay-family = "iqr"
replay-bits = [4, 7]
replay-rows = [1, 16, 64, 65, 96, 128, 129, 256, 512, 2048]
replay-shapes = [[13312, 5120], [6144, 5120], [5120, 2304]]

# The IQR GEMM family's 16/64-token row and its gated form (gemm_iqr_nt_m64, gemm_iqr_gated: the decode and draft rows
# Qwen 27B serves), on the forms bc-iqr owns only (UH_IQR_OWNED: the V4 computed trellis at 6 and 7 bits). The gated row's
# chain needs gated_had_quant_i8g from the base, so r4d_fused_quant (and the quantiser's group, r4d_quant_act_fp8) are
# base units. The reference is a harness build of the iqr family (the release library carries no IQR rows: bc-iqr owns them). Hashes: the case's own matrix plus the
# trunk shapes at the row counts of the GEMV, the 16-token tile and the narrow tile, and the gate_up shape gated at decode,
# draft and verify counts.
[overlay.iqr_gemm_m64]
component = "bc-iqr"
plugin = "libbciqr"
case = "gemm_iqr"
row-prefix = "bc_"
kernels = "."
base-units = ["r4d_gemm_i8a8", "r4d_gemm_w8a8_tiled", "r4d_keyed", "r4d_quant_act_fp8", "r4d_fused_quant"]
rounds = 1

[overlay.iqr_gemm_m64.env]
UH_IQR_OWNED = "1"
UH_GATED_CASES = "1:17408:5120,2:17408:5120,5:17408:5120,16:17408:5120"

[overlay.iqr_gemm_m64.hash]
shapes = [[5376, 2560], [5120, 2304], [6144, 5120], [5120, 6656]]
rows = [1, 2, 4, 8, 9, 16, 17, 32, 64]
tail_rows = [1, 16, 64]
tail_shape = [13312, 5120]
